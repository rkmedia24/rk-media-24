function mountShortMedia(v,sec){
  if(!v || !sec) return;
  if(!hasThumb(v) && v.userUploaded) ensurePoster(v);
  var slot=sec.querySelector(".shorts-media"); if(!slot) return;
  if(v.ytId){
    var _ex=slot.querySelector("iframe");
    if(_ex){ if(!_ex.getAttribute("src")){ try{ _ex.remove(); }catch(e){} } else return; } /* already mounted */
    var isActiveYt=+sec.getAttribute("data-idx")===state.shortsIdx;
    var fr=document.createElement("iframe");
    fr.setAttribute("src",shortEmbedURL(v.ytId,!(shortsSoundOn&&isActiveYt)));
    fr.addEventListener("load",function(){ try{ fr._rkLoaded=true; }catch(e){} });
    fr.setAttribute("title",v.title||"");
    fr.setAttribute("allow","accelerometer; autoplay; encrypted-media; picture-in-picture");
    fr.setAttribute("allowfullscreen","");
    fr.setAttribute("referrerpolicy","unsafe-url");
    slot.appendChild(fr); try{ if(__liveShortsMedia.indexOf(fr)<0) __liveShortsMedia.push(fr); }catch(e){}
    /* Belt-and-braces unmute for the active short (API commands
       sent early are queued by the player). Guarded: if the user
       swiped away meanwhile, nothing is unmuted or played. */
    if(isActiveYt&&shortsSoundOn){
      [500,1600].forEach(function(ms){ setTimeout(function(){ if(!document.body.contains(slot)) return; if(+sec.getAttribute("data-idx")!==state.shortsIdx) return; var f2=slot.querySelector("iframe"); if(f2){ ytCmd(f2,"unMute"); ytCmd(f2,"setVolume",[100]); ytCmd(f2,"playVideo"); } },ms); });
    }
    return;
  }
  var vd=slot.querySelector("video");
  if(vd){ if(vd.paused) tryPlayMedia(vd); return; }
  /* FAST PATH (Shorts speed): the record already carries a live
     blob: URL from IndexedDB — build the <video> element right now
     instead of waiting on the async ensureVideoSrc round-trip, so
     the next Reel starts at once when the user swipes to it. */
  if(typeof v.src==="string" && v.src.indexOf("blob:")===0 && !v._srcDead){
    buildShortVideo(v,sec); return;
  }
  /* Uploaded video: fetch IndexedDB bytes first so a restored upload
     never plays from a dead blob: URL. */
  ensureVideoSrc(v,function(ok){
    if(!ok){ slot.innerHTML=shortsBlockedHTML(v); return; }
    if(!document.body.contains(slot)) return;
    var list=shortsPlayerList();
    if(Math.abs(list.indexOf(v)-state.shortsIdx)>2) return; /* scrolled away meanwhile */

}
function unmountShortMedia(v,sec){
  if(!sec) return;
  var slot=sec.querySelector(".shorts-media"); if(!slot) return;
  var fr=slot.querySelector("iframe"); if(fr) fr.remove();
  var vd=slot.querySelector("video");
  if(vd){ try{ vd.pause(); }catch(e){} vd.removeAttribute("src"); try{ vd.load(); }catch(e){} vd.remove(); }
  try{ __liveShortsMedia=__liveShortsMedia.filter(function(el){ return el && el!==fr && el!==vd; }); }catch(e){}
}
function activateShort(idx){
  var list=shortsPlayerList(); if(!list.length) return;
  idx=Math.max(0,Math.min(idx,list.length-1));
  state.shortsIdx=idx;
  var sc=document.getElementById("shorts-scroller");
  for(var i=0;i<list.length;i++){
    var sec=sc?sc.querySelector('.shorts-page[data-idx="'+i+'"]'):null;
    if(!sec) continue;
    /* FIX (Shorts instant): mount two neighbours ahead (±2), so the
       video element / YouTube iframe for the short after next is
       created and buffering before the user swipes to it. Only the
       active short may play — neighbours stay paused and muted. */
    if(Math.abs(i-idx)<=2) mountShortMedia(list[i],sec);
    else unmountShortMedia(list[i],sec);
  }
  /* Only the active short may make sound: every mounted neighbour
     is paused the moment the active short changes, so the previous
     short's audio can never bleed over the next one. */
  for(var j=0;j<list.length;j++){
    var s2=sc?sc.querySelector('.shorts-page[data-idx="'+j+'"]'):null;
    if(!s2) continue;
    if(j===idx) playShortMedia(s2); else if(Math.abs(j-idx)<=2) pauseShortMedia(s2);
  }
  var c=document.getElementById("shorts-count");
  if(c) c.textContent=t("shorts")+" \u2022 "+(idx+1)+" / "+list.length;
  var pv=document.getElementById("shorts-prev"); if(pv) pv.disabled=idx<=0;
  var nx=document.getElementById("shorts-next"); if(nx) nx.disabled=idx>=list.length-1;
  var v=list[idx]; if(v) recordView(v.id);
}
function shortsGoTo(ni){
  var list=shortsPlayerList(); if(!list.length) return;
  ni=Math.max(0,Math.min(ni,list.length-1));
  var sc=document.getElementById("shorts-scroller");
  if(sc){ var h=sc.clientHeight||1; try{ sc._rkProgAt=Date.now(); sc.scrollTo({top:ni*h,behavior:"smooth"}); }catch(e){ sc.scrollTop=ni*h; } }
  activateShort(ni);
}
function bindShorts(){
  if(state.view!=="shorts") return;
  var list=shortsPlayerList(); if(!list.length) return;
  var sc=document.getElementById("shorts-scroller"); if(!sc) return;
  var idx=Math.max(0,Math.min(state.shortsIdx||0,list.length-1)); state.shortsIdx=idx;
  /* Jump to the current short instantly (no animation) on open. */
  var h=sc.clientHeight||1; try{ sc._rkProgAt=Date.now(); sc.scrollTop=idx*h; }catch(e){}
  activateShort(idx);
  /* FIX (Shorts instant): resolve every Short's source in the
     background now, so a swipe never waits on the async src
     round-trip — mountShortMedia then hits its FAST PATH. */
  try{ preResolveShortsSources(); }catch(e){}
  if(!sc._rkScroll){
    sc._rkScroll=true; var t=null;
    sc.addEventListener("scroll",function(){
      /* FIX (Shorts speed): cut the old short's sound the instant the
         swipe starts — do not wait for the 120ms debounce or the snap
         to settle, or the previous short's audio bleeds over the next
         one. Programmatic scrolls (prev/next buttons, snap nudge)
         are stamped with _rkProgAt and skipped here, so the newly
         activated short is never silenced by its own scroll. */
      try{
        if(Date.now()-(sc._rkProgAt||0)>=600){
          var hh0=sc.clientHeight||1;
          if(Math.abs(sc.scrollTop-(state.shortsIdx||0)*hh0)>10){
            var curSec=sc.querySelector('.shorts-page[data-idx="'+state.shortsIdx+'"]');
            if(curSec) pauseShortMedia(curSec,true);
          }
        }
      }catch(e){}
      if(t) clearTimeout(t);
      t=setTimeout(function(){
        var hh=sc.clientHeight||1;
        var ni=Math.max(0,Math.min(Math.round(sc.scrollTop/hh),list.length-1));
        if(ni!==state.shortsIdx) activateShort(ni);
          /* Snap safety net: if the scroller settled between pages
             (older WebViews sometimes miss the mandatory snap),
             nudge it onto the nearest page so exactly one short
             shows, with no peeking of the previous/next one. */
          if(Math.abs(sc.scrollTop-ni*hh)>2){ try{ sc._rkProgAt=Date.now(); }catch(e){} sc.scrollTo({top:ni*hh,behavior:"smooth"}); }
      },120);
    },{passive:true});
  }
  if(!sc._rkClick){
    sc._rkClick=true;
    sc.addEventListener("click",function(e){
      /* Check again on a not-yet-online Short: re-read its shared
         record; if the uploader's file has landed in the store,
         remount this page's media so the video plays right away. */
      var rc=e.target && e.target.closest ? e.target.closest("[data-srecheck]") : null;
      if(rc){
        var rv=videoById(rc.getAttribute("data-srecheck")); if(!rv) return;
        var rsec=rc.closest(".shorts-page"); if(!rsec) return;
        try{ rc.disabled=true; rc.textContent="…"; }catch(e){}
        fbRefreshVideoDoc(rv).then(function(){
          if(!document.body.contains(rsec)) return;
          var rslot=rsec.querySelector(".shorts-media"); if(rslot) rslot.innerHTML="";
          try{ rv._srcDead=false; }catch(e){}
          mountShortMedia(rv,rsec);
          setTimeout(function(){ try{ playShortMedia(rsec); }catch(e){} },600);
        });
        return;
      }
      var btn=e.target && e.target.closest ? e.target.closest("[data-sact]") : null;
      if(btn){
        var v=videoById(btn.getAttribute("data-vid")); if(!v) return;
        var act=btn.getAttribute("data-sact");
        if(act==="like"){
          if(!state.user){ openSignIn("like"); return; }
          liked[v.id]=!liked[v.id]; v.likes+=liked[v.id]?1:-1;
          btn.classList.toggle("on",!!liked[v.id]);
          var s=btn.querySelector("span"); if(s) s.textContent=fmt(v.likes);
        } else if(act==="comment"){

        }
        return;

         iframe never reach the page, so this fires for local videos
         and the letterbox area; the volume button covers the rest). */
      var md=e.target && e.target.closest ? e.target.closest(".shorts-media, .shorts-touch") : null;
      if(md){ shortsSoundOn=!shortsSoundOn; applyShortsSoundTo(md.closest(".shorts-page")); syncShortsSoundUI(); }
    });
  }
  var pv=document.getElementById("shorts-prev");
  if(pv && !pv._rkB){ pv._rkB=true; pv.addEventListener("click",function(){ shortsGoTo(state.shortsIdx-1); }); }
  var nx=document.getElementById("shorts-next");
  if(nx && !nx._rkB){ nx._rkB=true; nx.addEventListener("click",function(){ shortsGoTo(state.shortsIdx+1); }); }
  var ex=document.getElementById("shorts-exit");
  if(ex && !ex._rkB){ ex._rkB=true; ex.addEventListener("click",function(){ go("home"); }); }
}

  if(v==="shorts"){ state.shortsIdx=0; go("shorts"); return; }
  if(v==="create"){ openCreateChooser(); return; }
  if(v==="studio"){ openStudioSmart(); return; }
  go(v);
}
function go(view){
  /* FIX: tapping Home (or any nav) while the mini player is open
     stops it — audio may play only while the mini player is
     visibly open and the user is not navigating away. */
  if(miniState.minimized){ try{ closeMiniplayer(true); }catch(e){} }
  state.view=view; state.watchId=null; state.searchOpen=false; renderApp(); window.scrollTo(0,0);
}
/* Android Back: pop exactly one in-app level and report whether it
   was handled. MainActivity calls this through evaluateJavascript
   and only finishes the activity when it returns false (home root
   with nothing to pop). The single-file page has no browser history
   to go back through, so the back stack lives here. */
window.rkGoBack=function(){
  try{
    var ov=document.getElementById("overlay-root");
    if(ov && ov.querySelector(".modal-back")){ ov.innerHTML=""; return true; }
    if(document.fullscreenElement){ try{ document.exitFullscreen(); }catch(e){} return true; }
    if(document.body.classList.contains("landscape-watch")){ document.body.classList.remove("landscape-watch"); try{ __theaterOn=false; }catch(e){} return true; }
    if(state.searchOpen){ state.searchOpen=false; renderApp(); return true; }
    if(miniState && miniState.minimized){ closeMiniplayer(true); return true; }
    if(state.view==="library"){ go("you"); return true; }
    if(state.view && state.view!=="home"){ go("home"); return true; }
    return false;
  }catch(e){ return false; }
};
function doSearch(){
  var inp=document.getElementById("search-input"); if(!inp) return;
  var q=inp.value.trim();
  state.query=q; state.view="search"; state.searchOpen=false; renderApp(); window.scrollTo(0,0);
  /* Search must see other phones' videos too, not just this phone's
     local list: pull the shared collections first, then re-render
     the search view (only if still on search) so remote results show. */
  try{
    if(fbState.backend){ fbPull().then(function(){ try{ if(state.view==="search"||state.view==="home") renderApp(); }catch(e){} }).catch(function(){}); }
    else fbInitLazy();
  }catch(e){}
}
function renderMain(){
  var __savedMain=preservePlayer();
  try{ stopAllMedia(); }catch(e){}
  var m=document.getElementById("main"); if(!m){ restorePlayer(__savedMain); return; }
  if(state.view==="home") m.innerHTML=viewHome();
  else if(state.view==="watch") m.innerHTML=viewWatch();
  else if(state.view==="channel") m.innerHTML=viewChannel();
  else if(state.view==="studio") m.innerHTML=viewStudio();
  else if(state.view==="subs") m.innerHTML=viewSubs();
  else if(state.view==="search") m.innerHTML=viewSearch();
  else if(state.view==="shorts") m.innerHTML=viewShorts();
  else if(state.view==="you") m.innerHTML=viewYou();
  else if(state.view==="library") m.innerHTML=viewLibrary();
  bindMain();
  syncLandscapeTheater();
  restorePlayer(__savedMain);
}

/* Shared-store status on a video card: green when the file is in

function videoCard(v){
  /* Shorts confinement (double fit, layer 1): a Short NEVER renders
     as a 16:9 long-video card, no matter which list a caller built.
     Shorts live only in the Shorts shelf / Shorts grid / Shorts
     player. Every long-feed surface is leak-proof by construction. */
  try{ if(isShortVideo(v)) return ""; }catch(e){}
  var ch=chanById(v.channelId)||{id:(v&&v.channelId)||"",name:"Channel",handle:"",color:"#3949ab",initial:"C",avatarImg:null,subs:0};

    + '<div class="vtext"><h3 class="vtitle">'+esc(v.title)+'</h3>'
    + '<p class="vsub"><span class="chname" data-chan="'+ch.id+'">'+chanNameHTML(ch)+'</span><br>'
    + fmt(realViews(v.id))+' '+esc(t("views"))+' • '+esc(v.age)+'</p>'

    + (a.img?'<img class="ad-packet" src="'+esc(a.img)+'" alt="" style="max-width:100%;border-radius:8px">':"")

function gridHTML(list){
  /* Shorts confinement (double fit, layer 2): the long-video grid
     itself drops every Short before rendering, so Home, Search,
     Subscriptions, channel Videos tab and the Library stay free of
     Shorts even if a caller passes a mixed list. */
  list=(list||[]).filter(function(v){ try{ return !isShortVideo(v); }catch(e){ return true; } });
  var out=[]; var fa=feedAds(); var ai=0;
  list.forEach(function(v,i){
    try{ out.push(videoCard(v)); }catch(e){}
    if(fa.length && (i===3 || (i>3 && (i-3)%6===0))) out.push(adCardHTML(fa[ai++ % fa.length]));
  });
  return '<div class="grid">'+out.join("")+'</div>';
}
/* Long-only list (Search, Subscriptions, Library): Shorts are locked
   to the Shorts place (Shorts player + channel Shorts tab) and never
   appear here at all -- not as 16:9 long cards, not as a shelf. */
function mixedListHTML(list){
  var longs=list.filter(function(v){ return !isShortVideo(v); });
  return longs.length?gridHTML(longs):"";
}
function postTimeAgo(ts){
  var s=Math.max(0,Math.floor((Date.now()-(ts||Date.now()))/1000));
  if(s<60) return t("timeNow");
  var m=Math.floor(s/60); if(m<60) return t("timeMin").replace("{n}",m);
  var h=Math.floor(m/60); if(h<24) return t("timeHr").replace("{n}",h);
  return t("timeDay").replace("{n}",Math.floor(h/24));
}

   avatar + name + time + Subscribe + 3-dot on top, caption, photo

function feedPostHTML(p){

/* Home feed: LONG videos ONLY, newest first, with feed ads and
   photo posts interleaved further down. Shorts are locked to the
   Shorts place (bottom-nav Shorts player + channel Shorts tab) and
   never appear in the Home feed at all -- no Shorts shelf, no Short
   as a long card, nothing. */
function homeFeedHTML(){
  var list=videos.filter(function(v){ return (state.cat==="All" || v.cat===state.cat) && canListVideo(v); });
  /* FIX 4: stable newest-first order by creation time (not raw array
     order, which shifts as pulls merge) so every video sits in its
     correct sorted position and is reachable scrolling down. */
  var ordered=list.slice().sort(function(a,b){ var __ct=function(x){ var t=x._fbCreatedAt||x.createdAt||0; if(typeof t==="string"){ var n=Date.parse(t); return isFinite(n)?n:0; } return +t||0; }; var ta=__ct(a), tb=__ct(b); if(tb!==ta) return tb-ta; return String(a.id)<String(b.id)?-1:(String(a.id)>String(b.id)?1:0); });
  var longs=ordered.filter(function(v){ return !isShortVideo(v); });
  var plist=posts.slice().reverse();
  var fa=feedAds(); var ai=0, pi=0;
  var out=[];
  longs.forEach(function(v,i){
    try{ out.push(videoCard(v)); }catch(e){}
    if(fa.length && (i===5 || (i>5 && (i-5)%6===0))) out.push(adCardHTML(fa[ai++ % fa.length]));
    if(plist.length && (i===7 || (i>7 && (i-7)%8===0)) && plist[pi]) out.push(feedPostHTML(plist[pi++]));
  });
  if(!longs.length && plist.length) plist.forEach(function(p){ out.push(feedPostHTML(p)); });
  if(!out.length) return '<div class="empty-note">'+esc(t("noResults"))+'</div>';
  return '<div class="grid">'+out.join("")+'</div>';
}

/* ---------- In-place watch-page updates (never rebuild the player) ----------

/* One comment card: rounded card, avatar, name + time, text, and its own
   Like + Reply buttons. Each comment keeps a stable id (cid) so its
   buttons keep working after new comments are added on top. */
function commentHTML(c){
  if(!c.cid) c.cid="c"+Date.now()+Math.floor(Math.random()*1000000);
  var cav='<span class="avatar" style="background:#5d4037">'+esc(c.who.charAt(0).toUpperCase())+'</span>';

  return '<div class="comment">'+cav+'<div class="comment-body">'+cwho+'<p>'+esc(c.text)+'</p>'
    + '<div class="comment-actions"><button type="button" class="c-like'+(c.likedByMe?" on":"")+'" data-clike="'+esc(c.cid)+'">'+IC.like+'<span>'+fmt(c.likes||0)+'</span></button>'
    + '<button type="button" class="c-reply" data-creply="'+esc(c.who)+'">'+esc(t("replyBtn"))+'</button></div>'
    + '</div></div>';
}
function bindCommentButtons(root){
  (root||document).querySelectorAll("[data-clike]").forEach(function(b){
    if(b._rkBound) return; b._rkBound=true;
    b.addEventListener("click",function(){
      var cid=b.getAttribute("data-clike");
      var v=videoById(state.watchId);
      var c=v?v.comments.filter(function(x){return x.cid===cid;})[0]:null;
      var inPost=false;
      if(!c){ posts.forEach(function(pp){ (pp.comments||[]).forEach(function(x){ if(x.cid===cid){ c=x; inPost=true; } }); }); }
      if(!c && state.view==="shorts"){ var sl=shortsPlayerList(); var sv=sl[state.shortsIdx||0]; if(sv) c=sv.comments.filter(function(x){return x.cid===cid;})[0]||null; }
      if(!c) return;
      c.likedByMe=!c.likedByMe; c.likes=Math.max(0,(c.likes||0)+(c.likedByMe?1:-1));
      if(inPost) saveUserData();
      b.classList.toggle("on",!!c.likedByMe);
      var s=b.querySelector("span"); if(s) s.textContent=fmt(c.likes||0);
    });
  });
  (root||document).querySelectorAll("[data-creply]").forEach(function(b){
    if(b._rkBound) return; b._rkBound=true;
    b.addEventListener("click",function(){
      var postEl=b.closest?b.closest(".feed-post"):null;
      var inp=postEl?postEl.querySelector('.post-comments input[type="text"]'):(document.getElementById("cmt-input")||document.getElementById("sc-input"));
      if(!inp) return;
      var who=b.getAttribute("data-creply")||"";
      if(who && inp.value.indexOf("@"+who)!==0) inp.value="@"+who+" "+inp.value;
      inp.focus();
    });
  });
}

function viewWatch(){
  var v=videoById(state.watchId); if(!v) return '<div class="empty-note">'+esc(t("noResults"))+'</div>';
  if(!canPlayVideo(v)) return '<div class="empty-note">'+esc(t("privateVideo"))+'</div>';
  var ch=chanById(v.channelId);
  var above=nextAdFor(v.id,"above"); var below=nextAdFor(v.id,"below"); var commAd=nextAdFor(v.id,"comments");
  /* Up next is a LONG-video list: Shorts are confined to the Shorts
     feed/player and never appear here as landscape rows. */
  var up=videos.filter(function(x){return x.id!==v.id && canListVideo(x) && !isShortVideo(x);}).slice().reverse().slice(0,8);
  var comments=v.comments.map(function(c){ return commentHTML(c); }).join("");
  var showHouseAd = (state.adPending===v.id) && isLongVideo(v);
  var houseAd = showHouseAd ? houseAdHTML() : "";
  var playerHTML = v.ytId
    ? '<div class="player-box" id="player-box"><iframe id="yt-player" src="https://www.youtube-nocookie.com/embed/'+esc(v.ytId)+'?rel=0" title="'+esc(v.title)+'" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="unsafe-url"></iframe><button type="button" class="fs-btn" data-act="fullscreen" aria-label="'+esc(t("fullscreenBtn"))+'">'+IC.fs+'</button>'+houseAd+'</div>'
    : (fbIsRemoteOnly(v) ? fbRemoteOnlyHTML(v)
    : (v._srcDead ? deadVideoHTML("gone")
    : '<div class="player-box" id="player-box"><video id="player" controls autoplay playsinline preload="metadata"'+posterAttr(v)+' src="'+esc(v.src)+'"></video><button type="button" class="fs-btn" data-act="fullscreen" aria-label="'+esc(t("fullscreenBtn"))+'">'+IC.fs+'</button><button type="button" class="q-btn" data-act="quality" aria-label="Quality">'+esc(qualityBtnLabel(v))+'</button>'+houseAd+'</div>'));
  /* YouTube iframes use referrerpolicy="unsafe-url": the page loads from file://, so a strict policy sends no Referer. The native WebView also proxies embed requests as a fallback. */
  return '<div class="watch-wrap"><div>'
    + (above?adBannerHTML(above,true):"")
    + playerHTML
    + '</div>'
    + '<h1 class="watch-title">'+esc(v.title)+'</h1>'
    + hashtagsHTML(v)
    + '<div class="watch-row"><div class="chan-chip"><span data-chan="'+ch.id+'" style="cursor:pointer">'+avatarHTML(ch,40)+'</span>'
    + '<div><div class="nm" data-chan="'+ch.id+'">'+chanNameHTML(ch)+'</div><div class="sb">'+fmt(ch.subs)+' '+esc(t("subscribers"))+'</div></div></div>'
    + subBtnHTML(ch) + bellBtnHTML(ch)
    + '<div class="pill-actions"><button class="pill'+(liked[v.id]?" on":"")+'" data-act="like">'+IC.like+'<span>'+fmt(v.likes)+'</span></button>'
    + '<button class="pill'+(disliked[v.id]?" on":"")+'" data-act="unlike"><span class="flip-ic">'+IC.like+'</span><span>'+fmt(v.dislikes||0)+'</span></button>'
     + '<button class="pill" data-act="share">'+IC.share+'<span>'+esc(t("share"))+'</span></button>'
    + '<button class="pill" data-act="ask">'+IC.ask+'<span>'+esc(t("ask"))+'</span></button>' 
    + '<button class="pill'+(savedSet[v.id]?" on":"")+'" data-act="save">'+IC.save+'<span>'+esc(savedSet[v.id]?t("savedBtn"):t("saveBtn"))+'</span></button>'
    + '<button class="pill" data-act="report">'+IC.flag+'<span>'+esc(t("report"))+'</span></button>'
    + '<button class="pill" data-vmenu="'+v.id+'" aria-label="More">'+IC.dots+'</button>'
    + '</div></div>'
    + (below?adBannerHTML(below):"")
    + '<div class="desc-box"><div class="stats">'+fmt(realViews(v.id))+' '+esc(t("views"))+' • '+esc(v.age)+' • '+esc(v.cat)+'</div>'+esc(v.desc)
    + (v.ytId?'<div style="margin-top:6px;color:var(--ink-2);font-size:13px">▶ '+esc(t("autoPlaysYT"))+'</div>':"")+'</div>'
    + (commAd?adBannerHTML(commAd):"")
    + '<div class="comments"><h3>'+esc(t("comments"))+' • '+v.comments.length+'</h3>'
    + (state.user?'<div class="add-comment"><span class="avatar" style="background:#3949ab">'+esc(state.user.name.charAt(0).toUpperCase())+'</span><input id="cmt-input" type="text" placeholder="'+esc(t("addComment"))+'"><button class="btn red post-btn" id="cmt-go">'+esc(t("postBtn"))+'</button></div>'
      :'<div class="desc-box signin-cta" style="margin:0 0 14px"><span style="color:var(--ink-2)">'+esc(state.lang==="bn"?"মন্তব্য করতে সাইন ইন করুন":"Sign in to join the conversation and comment")+'</span><button class="btn red" data-act="signin-comment" style="height:34px">'+esc(t("signIn"))+'</button></div>')
    + comments + '</div>'
    + '</div>'
    + '<div class="upnext"><h3>'+esc(t("upNext"))+'</h3>'
    + up.map(function(x){ var xc=chanById(x.channelId);
        return '<div class="unext-row" data-watch="'+x.id+'"><div class="thumb'+(hasThumb(x)?"":" thumb-ph")+'">'+thumbInnerHTML(x)+(x.duration?'<span class="dur">'+esc(x.duration)+'</span>':"")+'</div>'
        + '<div class="vtext"><h4 class="vtitle">'+esc(x.title)+'</h4><p class="vsub">'+chanNameHTML(xc)+'<br>'+fmt(realViews(x.id))+' '+esc(t("views"))+' • '+esc(x.age)+'</p></div></div>';
      }).join("")
    + '</div></div>';
}

/* ---------- Channel page ---------- */
function viewChannel(){
  var ch=chanById(state.channelId) || chanById("rk");
  if(!state.chanTab || ["playlists","about"].indexOf(state.chanTab)>=0) state.chanTab="home";
  var list=videos.filter(function(v){return v.channelId===ch.id && canListVideo(v);}).slice().reverse();
  var shorts=list.filter(function(v){ return isShortVideo(v); });
  var longs=list.filter(function(v){ return isLongVideo(v); });
  var lives=list.filter(function(v){ return isLiveVideo(v); });
  var mine=myChannel && ch.id===myChannel.id;
  var links=ch.links||[];
  var subsList=ch.subscribers||[];
  var about=(ch.about||"");
  var aboutShort=about.length>110?about.slice(0,110):about;
  var out='<div class="banner">'+(ch.banner?'<img src="'+esc(ch.banner)+'" alt="">':"")+'</div>'
  + '<div class="chan-head2">'+avatarHTML(ch,96)
  + '<div style="flex:1;min-width:0"><div class="nm">'+chanNameHTML(ch)+'</div><div class="handle">'+esc(ch.handle)+'</div>'
  + '<div class="sub-line" data-act="open-subs"><span class="sub-avatars">'
  + subsList.slice(0,3).map(function(s){ return avatarHTML({name:s.name||"?",avatarImg:s.avatarImg||"",color:"#888",initial:(s.name||"?").charAt(0)},22); }).join("")
  + '</span><span>'+fmt(ch.subs)+' '+esc(t("subscribers"))+' ›</span></div></div></div>'
  + (about?'<p class="chan-about"><span id="about-short">'+esc(aboutShort)+'</span><span id="about-full" hidden>'+esc(about)+'<br><span class="hint">'+esc(t("joined"))+' '+esc(ch.joined)+' · '+fmt(chanViews(ch.id))+' '+esc(t("totalViews"))+'</span></span>'+(about.length>110?' <span class="more-link" data-act="about-more" id="about-more">...'+esc(t("more"))+'</span>':"")+'</p>':"")
  + (links.length?'<div class="chan-links" data-act="open-links">'+IC.linkIcon+'<span>'+esc(links[0].name)+(links.length>1?" "+esc(links.length===2?t("andMoreLink1"):t("andMoreLinks").replace("{n}",links.length-1)):"")+'</span></div>':"")
  + (mine
      ? '<div class="chan-owner-btns"><button class="btn outline" data-act="goto-analytics">'+IC.chart+' '+esc(t("analytics"))+'</button><button class="btn outline" data-act="edit-channel">'+IC.edit+' '+esc(t("editChannel"))+'</button></div><button class="btn outline chan-community" data-act="goto-community">'+IC.people+' '+esc(t("community"))+'</button>'
      : '<div style="margin:12px 0 4px;display:flex;align-items:center;gap:10px">'+subBtnHTML(ch)+bellBtnHTML(ch)+'</div>')
  + (mine && state.role==="admin" ? '<div class="guide-banner warn"><div><b>'+esc(t("youAreAdmin"))+'</b><br>'+esc(t("adminLocked"))+'</div></div>' : "")
  + '<div class="tabs">'+[["home",t("home")],["videos",t("videos")],["shorts",t("shorts")],["live",t("live")],["posts",t("posts")]].map(function(tb){ return '<button data-ctab="'+tb[0]+'" class="'+(state.chanTab===tb[0]?"active":"")+'">'+esc(tb[1])+'</button>'; }).join("")+'</div>';
  if(state.chanTab==="home"){
    if(!list.length) out+='<div class="empty-note"><b>'+esc(t("noVideos"))+'</b><br>'+esc(t("uploadFirst"))+'</div>';
    else{
      var feat=longs[0]||null;
      if(feat) out+='<div class="featured" data-watch="'+feat.id+'"><div class="thumb'+(hasThumb(feat)?"":" thumb-ph")+'">'+thumbInnerHTML(feat)+(feat.duration?'<span class="dur">'+esc(feat.duration)+'</span>':"")+'</div><h3>'+esc(feat.title)+'</h3><p>'+chanNameHTML(ch)+' · '+fmt(realViews(feat.id))+' '+esc(t("views"))+' · '+esc(feat.age)+'</p></div>';
      var rest=longs.slice(feat?1:0, feat?9:8);
      if(rest.length) out+=gridHTML(rest);
    }
  }
  else if(state.chanTab==="videos") out+= longs.length? gridHTML(longs) : '<div class="empty-note">'+esc(t("noLongVideos"))+'</div>';
  else if(state.chanTab==="shorts") out+= shorts.length? shortsGridHTML(shorts) : '<div class="empty-note">'+esc(t("noShortsYet"))+'</div>';
  else if(state.chanTab==="live") out+= (mine?'<button class="btn red" data-golive="1" style="margin:4px 0 12px">'+esc(t("liveGo"))+'</button>':"") + (lives.length? gridHTML(lives) : '<div class="empty-note">'+esc(t("noLiveYet"))+'</div>');
  else if(state.chanTab==="posts"){
    var plist=posts.filter(function(p){ return p.channelId===ch.id; }).slice().reverse();
    out+= plist.length? plist.map(function(p){ return postCardHTML(p,ch); }).join("") : '<div class="empty-note">'+esc(t("noPostsYet"))+'</div>';
  }
  return out;
}
/* ---------- Shorts: vertical full-screen player, vertical videos of 2 minutes or less ---------- */
function viewShorts(){
  var list=shortsPlayerList();
  if(!list.length) return '<h2 class="section-title">'+esc(t("shorts"))+'</h2><div class="empty-note">'+esc(t("noShortsYet"))+'</div>';
  var idx=Math.max(0,Math.min(state.shortsIdx||0,list.length-1)); state.shortsIdx=idx;
  /* Native vertical scroll-snap paging: one full-screen section per
     short inside a snap scroller. Swiping scrolls natively to the
     next/previous short — no JS touch detection (touches inside a
     YouTube iframe never reach the page, so JS swipe detection could
     never work there). Media is mounted lazily for the active short
     and its neighbours only, so dozens of YouTube iframes never load
     at once. */
  var pages=list.map(function(v,i){
    var ch=chanById(v.channelId);
    if(!hasThumb(v)&&v.userUploaded) ensurePoster(v);
    var poster=hasThumb(v)?'<img class="shorts-poster" src="'+esc(v.thumb)+'" alt="">':"";
    return '<section class="shorts-page" data-idx="'+i+'"><div class="shorts-player">'
    + '<div class="shorts-media" data-idx="'+i+'" data-vid="'+v.id+'"'+(v.ytId?' data-yt="'+esc(v.ytId)+'"':"")+'>'+poster+'</div>'
    + '<div class="shorts-touch" data-idx="'+i+'"></div>'
    + '<div class="shorts-info"><h3>'+esc(v.title)+'</h3><p><span data-chan="'+v.channelId+'" style="cursor:pointer">'+chanNameHTML(ch)+'</span> &bull; '+fmt(realViews(v.id))+' '+esc(t("views"))+'</p></div>'
    + '<div class="shorts-side">'
    + '<button data-sact="like" data-vid="'+v.id+'" class="'+(liked[v.id]?"on":"")+'">'+IC.like+'<span>'+fmt(v.likes)+'</span></button>'
    + '<button data-sact="comment" data-vid="'+v.id+'">'+IC.msg+'<span>'+fmt((v.comments||[]).length)+'</span></button>'
    + '<button data-sact="share" data-vid="'+v.id+'">'+IC.share+'<span>'+esc(t("share"))+'</span></button>'
    + '<button data-sact="unmute" data-vid="'+v.id+'">'+IC.volume+'<span>'+esc(shortsSoundOn?t("muteBtn"):t("unmute"))+'</span></button>'
    + '</div></div></section>';
  }).join("");
  return '<h2 class="section-title" id="shorts-count">'+esc(t("shorts"))+' &bull; '+(idx+1)+' / '+list.length+'</h2>'
  + '<div class="shorts-scroller" id="shorts-scroller">'+pages+'</div>'
  + '<div class="shorts-nav"><button class="btn ghost" id="shorts-prev" '+(idx<=0?"disabled":"")+'>&uarr; '+esc(t("backBtn"))+'</button><button class="btn" id="shorts-next" '+(idx>=list.length-1?"disabled":"")+'>'+esc(t("upNext"))+' &darr;</button></div>'
  + '<button class="shorts-exit" id="shorts-exit" aria-label="Back">‹</button>';
}

/* ---------- Library lists (from the You tab) ---------- */
function viewLibrary(){
  var tab=state.libTab||"watchlater";
  var hist=watchHistoryList();
  var savedList=videos.filter(function(v){ return savedSet[v.id] && canListVideo(v); }).slice().reverse();
  var mine=myChannel? videos.filter(function(v){ return v.channelId===myChannel.id; }).slice().reverse() : [];
  var title=tab==="history"?t("history"):tab==="yourvideos"?t("yourVideos"):tab==="downloads"?t("downloads"):t("watchLater");
  var out='<button class="btn ghost" data-act="back-to-you" style="margin-bottom:8px">‹ '+esc(t("you"))+'</button>'
  + '<h2 class="section-title">'+esc(title)+'</h2>';

/* ---------- Studio ---------- */

function studioRealtimeHTML(){

  var topRows=top48.length? top48.map(function(r){ var v=videoById(r.id); return '<div class="ad-list-item"><div class="grow"><h4>'+esc(v?v.title:r.id)+'</h4><p>'+fmt(r.n)+' '+esc(t("views"))+'</p></div></div>'; }).join("") : '<p class="hint">'+esc(t("noDataYet"))+'</p>';
  return '<div class="panel"><h3>Realtime</h3>'
  + '<div class="chan-stats"><span class="stat-chip">'+esc(t("views48h"))+': <b id="rt-48">'+v48+'</b></span>'
  + '<span class="stat-chip">'+esc(t("views60m"))+': <b id="rt-60">'+v60+'</b></span></div>'

function viewsOverTimeHTML(){
  var days=viewsByDay(7);
  var max=1; days.forEach(function(d){ if(d.n>max) max=d.n; });
  var rows=days.map(function(d){ var w=Math.round(d.n/max*100); return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:7px"><span style="width:86px;flex:none;font-size:13px;color:var(--ink-2)">'+esc(d.label)+'</span><span style="flex:1;height:14px;background:var(--bg-chip);border-radius:7px;overflow:hidden"><i style="display:block;height:100%;width:'+w+'%;background:var(--red)"></i></span><b style="width:44px;text-align:right;font-size:13px">'+d.n+'</b></div>'; }).join("");
  return '<div class="panel"><h3>'+esc(t("viewsOverTime"))+'</h3>'+rows+'</div>';
}
function topVideosHTML(limit){
  var top=topVideosFromEvents(0,limit||5);
  if(!top.length) return '<div class="panel"><h3>'+esc(t("topVideos"))+'</h3><p class="hint">'+esc(t("noDataYet"))+'</p></div>';
  var rows=top.map(function(r){ var v=videoById(r.id); return '<div class="ad-list-item"><div class="grow"><h4>'+esc(v?v.title:r.id)+'</h4><p>'+fmt(r.n)+' '+esc(t("views"))+'</p></div></div>'; }).join("");
  return '<div class="panel"><h3>'+esc(t("topVideos"))+' &bull; '+esc(t("allTime"))+'</h3>'+rows+'</div>';

function studioMonetization(ch){
  var subs=ch.subs, hours=chanHours(ch.id);

  var ready = subs>=500 && hours>=3000;
  var status = ch.monStatus||"none";
  var out='<div class="panel"><h3>'+esc(t("monTitle"))+'</h3><p class="hint">'+esc(t("monSub"))+'</p>'
  + '<div class="field"><label>'+esc(t("monSubs"))+'</label><div class="progress"><i style="width:'+sp+'%"></i></div>'
  + '<div class="meter-row"><span><b>'+fmt(subs)+'</b> / 500 '+esc(t("subscribers"))+'</span><span>'+Math.floor(sp)+'%</span></div></div>'
  + '<div class="field"><label>'+esc(t("monHours"))+'</label><div class="progress"><i style="width:'+hp+'%"></i></div>'
  + '<div class="meter-row"><span><b>'+fmt(hours)+'</b> / 3,000 '+esc(t("watchHours"))+'</span><span>'+Math.floor(hp)+'%</span></div></div>';
  if(status==="on") out+='<p class="status-ok">✓ '+esc(t("monOn"))+'</p>';
  else if(status==="applied") out+='<p class="status-ok">'+esc(t("monApplied"))+'</p>';

  out+='</div>';

  return out;
}

/* ---------- Bindings ---------- */
function bindMain(){
  document.querySelectorAll("[data-cat]").forEach(function(b){
    b.addEventListener("click",function(){ state.cat=b.getAttribute("data-cat"); renderMain(); });
  });
  document.querySelectorAll("[data-watch]").forEach(function(el){
    el.addEventListener("click",function(e){
      if(e.target.closest("[data-chan]")||e.target.closest("[data-sub]")||e.target.closest("[data-vmenu]")||e.target.closest("[data-vshare]")) return;
      openWatch(el.getAttribute("data-watch"));
    });
  });
  /* Shorts shelf card: open the Shorts player at that short. */
  document.querySelectorAll("[data-short]").forEach(function(el){
    el.addEventListener("click",function(){ openShortsPlayer(el.getAttribute("data-short")); });
  });
  /* Visible Share on a Shorts card: same sheet, do not open the player. */
  document.querySelectorAll("[data-ssshare]").forEach(function(b){
    b.addEventListener("click",function(e){
      e.stopPropagation();
      var v=videoById(b.getAttribute("data-ssshare")); if(v) shareVideo(v);
    });
  });
  document.querySelectorAll("[data-golive]").forEach(function(b){
    b.addEventListener("click",function(){ openGoLive(); });
  });
  /* Post actions (Share / Save / Like / Delete / Edit) live in the
     post ⋮ menu — nothing sits under the photo. Comment posting
     below still works through the input under an open post. */
  document.querySelectorAll("[data-postcmtgo]").forEach(function(b){
    b.addEventListener("click",function(){
      var pid=b.getAttribute("data-postcmtgo");
      var p=posts.filter(function(x){ return x.id===pid; })[0]; if(!p) return;
      if(!state.user){ openSignIn("comment"); return; }
      var inp=document.getElementById("post-cmt-input-"+pid); if(!inp) return;
      var txt=inp.value.trim(); if(!txt) return;
      var nc={who:state.user.name,text:txt,when:"now",chId:myChannel?myChannel.id:null,cid:"c"+pid+"-n"+Date.now()};
      p.comments=p.comments||[]; p.comments.unshift(nc);
      saveUserData();
      var art=document.querySelector('[data-post="'+pid+'"]');
      if(art){
        var cmtBtn=art.querySelector('[data-postcmt="'+pid+'"] span:last-child');
        if(cmtBtn) cmtBtn.textContent=fmt(p.comments.length);
        var box=art.querySelector(".post-comments");
        if(box){ box.insertAdjacentHTML("afterbegin",commentHTML(nc)); bindCommentButtons(box); }
      }
      inp.value="";
    });
  });
  /* Post ⋮ menu: every post action lives here — Share, Save, Like,
     Unlike, Comments, View channel, plus Edit + Delete for the post
     owner (or the app owner). Nothing sits under the photo. */
  document.querySelectorAll("[data-postmenu]").forEach(function(b){
    b.addEventListener("click",function(){
      var pid=b.getAttribute("data-postmenu");
      var p=posts.filter(function(x){ return x.id===pid; })[0]; if(!p) return;
      var items=[
        {label:t("share"),act:"share"},
        {label:p.saved?t("savedBtn"):t("saveBtn"),act:"save"},
        {label:t("like")+" • "+fmt(p.likes||0),act:"like"},
        {label:t("unlike"),act:"unlike"},
        {label:t("comments")+" • "+fmt((p.comments||[]).length),act:"cmt"},
        {label:t("viewChannel"),act:"chan"}
      ];
      if(canManagePost(p)){
        items.push({label:t("editPost"),act:"edit"});
        items.push({label:t("postDelete"),act:"del",danger:true});
      }
      overlay.innerHTML='<div class="modal-back"><div class="modal"><button class="icon-btn x" id="pm-x" aria-label="Close">✕</button>'
        + items.map(function(it){ return '<button class="btn ghost" data-pm="'+it.act+'" style="width:100%;justify-content:flex-start;margin-bottom:8px'+(it.danger?';color:#c00':'')+'">'+esc(it.label)+'</button>'; }).join("")
        + '</div></div>';
      document.getElementById("pm-x").addEventListener("click",function(){ overlay.innerHTML=""; });
      overlay.querySelectorAll("[data-pm]").forEach(function(mb){
        mb.addEventListener("click",function(){
          var a=mb.getAttribute("data-pm"); overlay.innerHTML="";
          if(a==="share"){ shareText((p.text||"RK Tube")+" — RK Tube"); }
          else if(a==="save"){ p.saved=!p.saved; saveUserData(); toast(p.saved?t("savedBtn"):t("saveBtn")); renderApp(); }
          else if(a==="like"){
            if(!state.user){ openSignIn("like"); return; }
            if(dislikedPost[pid]) dislikedPost[pid]=false;
            likedPost[pid]=!likedPost[pid]; p.likes=Math.max(0,(p.likes||0)+(likedPost[pid]?1:-1));
            saveUserData(); renderApp();
          }
          else if(a==="unlike"){
            if(!state.user){ openSignIn("like"); return; }
            if(likedPost[pid]){ likedPost[pid]=false; p.likes=Math.max(0,(p.likes||0)-1); }
            dislikedPost[pid]=!dislikedPost[pid];
            saveUserData(); renderApp();
          }
          else if(a==="cmt"){ openPostCmts[pid]=!openPostCmts[pid]; renderApp(); }
          else if(a==="chan"){ state.channelId=p.channelId; state.chanTab="home"; state.view="channel"; renderApp(); window.scrollTo(0,0); }
          else if(a==="edit"){ openEditPost(p); }
          else if(a==="del"){ showConfirmDeletePost(p); }
        });
      });
    });
  });
  document.querySelectorAll("[data-chan]").forEach(function(el){
    el.addEventListener("click",function(e){ e.stopPropagation(); state.channelId=el.getAttribute("data-chan"); state.chanTab="home"; state.view="channel"; renderApp(); window.scrollTo(0,0); });
  });
  document.querySelectorAll("[data-sub]").forEach(function(b){
    b.addEventListener("click",function(e){
      e.stopPropagation();
      var id=b.getAttribute("data-sub"); var ch=chanById(id); if(!ch) return;
      if(!state.user){ openSignIn("subscribe:"+id); return; }
      subscriptions[id]=!subscriptions[id];
      /* Count from the highest subs this phone knows (the floor),
         not a possibly stale local copy, so a subscribe never
         overwrites a bigger remote count with local+1. This
         phone's own tap is authoritative for its +/-1. */
      ch.subs=Math.max(ch.subs||0,fbSubsFloorGet(id))+(subscriptions[id]?1:-1);
      if(ch.subs<0) ch.subs=0;
      try{ fbSubsFloorPut(id,ch.subs); }catch(e){}
      /* Record who subscribed (real in-app subscribers only): the
         channel page shows this list under "N subscribers". */
      if(subscriptions[id] && myChannel){
        if(!ch.subscribers) ch.subscribers=[];
        if(!ch.subscribers.some(function(s){ return s.chId===myChannel.id; }))
          ch.subscribers.push({chId:myChannel.id,name:myChannel.name,avatarImg:myChannel.avatarImg||""});
      } else if(!subscriptions[id] && ch.subscribers && myChannel){
        ch.subscribers=ch.subscribers.filter(function(s){ return s.chId!==myChannel.id; });
      }
      saveSubs(); saveUserData(); saveAiChanState(ch);
      try{ fbSyncSub(id,!!subscriptions[id],!!notifSubs[id]); fbSyncChannel(ch); }catch(e){}
      if(!subscriptions[id] && notifSubs[id]){ delete notifSubs[id]; saveNotif(); }
      updateBellUI(id);
      /* On the watch page, update the button + count in place: a full
         render would move/rebuild the player and restart the video. */
      if(state.view==="watch"){ updateSubUI(ch); }
      else { renderApp(); }
    });
  });
  document.querySelectorAll("[data-bell]").forEach(function(b){
    b.addEventListener("click",function(e){
      e.stopPropagation();
      var id=b.getAttribute("data-bell");
      if(!subscriptions[id]){ toast(t("notifNeedSub")); return; }
      if(notifSubs[id]) delete notifSubs[id]; else notifSubs[id]=true;
      saveNotif(); updateBellUI(id);
      toast(notifSubs[id]?t("notifOn"):t("notifOff"));
    });
  });
  document.querySelectorAll("[data-stab]").forEach(function(b){
    b.addEventListener("click",function(){ state.studioTab=b.getAttribute("data-stab"); renderMain(); });
  });
  document.querySelectorAll("[data-ctab]").forEach(function(b){
    b.addEventListener("click",function(){ state.chanTab=b.getAttribute("data-ctab"); renderMain(); });
  });
  document.querySelectorAll("[data-act]").forEach(function(b){
    b.addEventListener("click",function(){ handleAct(b.getAttribute("data-act")); });
  });
  document.querySelectorAll("[data-adtoggle]").forEach(function(sw){
    sw.addEventListener("change",function(){
      if(!isOwner()) return;
      var a=ads.filter(function(x){return x.id===sw.getAttribute("data-adtoggle");})[0];
      if(a){ a.active=sw.checked; saveUserData(); }
    });
  });
  document.querySelectorAll("[data-addel]").forEach(function(b){
    b.addEventListener("click",function(){
      ads=ads.filter(function(x){return x.id!==b.getAttribute("data-addel");});
      if(editingAdId && !ads.some(function(x){return x.id===editingAdId;})) editingAdId=null;
      saveUserData(); renderMain();
    });
  });
  document.querySelectorAll("[data-adedit]").forEach(function(b){
    b.addEventListener("click",function(){
      editingAdId=b.getAttribute("data-adedit");
      var a=ads.filter(function(x){return x.id===editingAdId;})[0];
      adImgData=a&&a.img?a.img:"";
      renderMain(); window.scrollTo(0,0);
    });
  });
  var adImgFile=document.getElementById("ad-img-file");
  if(adImgFile) adImgFile.addEventListener("change",function(){
    readImage(adImgFile.files[0],function(d){ adImgData=d; var pv=document.getElementById("ad-img-preview"); if(pv){ pv.src=d; pv.style.display=""; } },640);
  });

     or a new tab in the web preview. Never navigates the app itself. */
  document.querySelectorAll("[data-adlink]").forEach(function(el){
    el.addEventListener("click",function(ev){
      var u=el.getAttribute("data-adlink"); if(!u) return;
      ev.preventDefault(); ev.stopPropagation(); /* the button inside a sticker also carries data-adlink — one open only */
      if(window.RkTubeNative && RkTubeNative.openLink){ try{ RkTubeNative.openLink(u); return; }catch(e){} }
      window.open(u,"_blank");

  document.querySelectorAll("[data-ai-del]").forEach(function(b){

      aiRemoveSource(b.getAttribute("data-ai-del"));

    b.addEventListener("click",function(){

      myChannel.admins=(myChannel.admins||[]).filter(function(a){return a.email!==b.getAttribute("data-admin-del");});
      renderMain(); toast(t("saved"));
    });

    b.addEventListener("click",function(){ openWatch(b.getAttribute("data-review-watch")); });

    b.addEventListener("click",function(){
      if(!isOwner()) return;
      var v=videoById(b.getAttribute("data-owner-rm")); if(v) showConfirmRemove(v);
    });

    b.addEventListener("click",function(e){
      e.stopPropagation();
      var v=videoById(b.getAttribute("data-vmenu")); if(v) openVideoMenu(v);
    });

      var v=videoById(b.getAttribute("data-vshare")); if(v) shareVideo(v);
    });
  });

/* Tap-to-play: try to play with sound; if the WebView blocks sound
   autoplay, play muted, then restore sound once playback has
   started (unmuting a video that is already playing does not
   re-trigger the autoplay block). A video the user muted on
   purpose is left muted. */
function tryPlayMedia(el){
  if(!el) return;
  /* FIX: never play a node that is no longer in the document — a
     detached <video> keeps sounding (the preroll 3s fallback used
     to re-play the old watch player after navigation). */
  try{ if(!document.body.contains(el)) return; }catch(e){ return; }
  var wasMuted=false;
  try{ wasMuted=!!el.muted; }catch(e){}
  var p=null;
  try{ p=el.play(); }catch(e){ p=null; }
  if(p && p.catch){
    p.catch(function(){
      if(wasMuted) return;
      try{ el.muted=true; }catch(e){}
      var p2=null;
      try{ p2=el.play(); }catch(e){}
      if(p2 && p2.catch) p2.catch(function(){});
      setTimeout(function(){ try{ if(!document.body.contains(el)) return; if(!el.paused) el.muted=false; }catch(e){} },600);
    });
  }
}
/* Tap-to-play: after the watch page has fully rendered — and the
   preserved player, if any, has been restored into place — make
   sure the right thing is playing: the house ad while it shows,
   the main video once it does not. Called only from the openWatch
   tap flow (never on a re-render), so a video the user paused is
   never resumed behind their back. */
function autoplayWatchPlayer(){
  if(state.view!=="watch") return;
  var pre=document.getElementById("preroll");
  var player=document.getElementById("player");
  var ad=document.getElementById("house-ad");
  if(pre){
    if(player){ try{ player.pause(); }catch(e){} }
    if(ad) tryPlayMedia(ad);
    return;
  }
  if(player) tryPlayMedia(player);
}
function setupPreroll(){
  var pre=document.getElementById("preroll");
  var player=document.getElementById("player");
  var yt=document.getElementById("yt-player");
  /* No house ad on this watch page — uploaded videos autoplay as
     before; YouTube videos keep their old behaviour (tap to play). */
  if(!pre){ if(player) tryPlayMedia(player); return; }
  if(!player && !yt) return;
  if(player){ try{ player.pause(); }catch(e){} }
  var ad=document.getElementById("house-ad");
  var done=false;
  function dismissHouseAd(){
    if(done) return; done=true;
    try{ state.adPending=null; }catch(e){}
    try{ if(ad) ad.pause(); }catch(e){}
    try{ if(pre&&pre.parentNode) pre.parentNode.removeChild(pre); }catch(e){}
    if(player) tryPlayMedia(player);
    else if(yt){ try{ if(yt.src.indexOf("autoplay=")===-1) yt.src=yt.src+"&autoplay=1&enablejsapi=1"; else ytCmd(yt,"playVideo"); }catch(e){} }
  }
  var skip=document.getElementById("skip-ad");
  if(skip) skip.addEventListener("click",function(e){ if(e) e.stopPropagation(); dismissHouseAd(); });
  if(ad){
    ad.addEventListener("ended",dismissHouseAd);
    ad.addEventListener("error",dismissHouseAd);
    /* Fallback: if the ad file is missing or will not start, never
       leave the viewer stuck — show the main video after 3s. */
    setTimeout(function(){ try{ if(!done && ad.paused && ad.currentTime===0) dismissHouseAd(); }catch(e){} },3000);
    /* If the ad itself will not start at all, the 3s fallback above
       dismisses it to the main video — never a black box. */
    tryPlayMedia(ad);
  } else {
    dismissHouseAd();
  }
}

   it. Never mounts new media — mounting is activateShort's job. */
function ensureShortPlaying(){
  if(state.view!=="shorts") return;
  var sc=document.getElementById("shorts-scroller"); if(!sc) return;
  var sec=sc.querySelector('.shorts-page[data-idx="'+state.shortsIdx+'"]'); if(!sec) return;
  playShortMedia(sec);
}
function openShortsPlayer(id){
  var list=shortsPlayerList(); var idx=0;
  list.forEach(function(x,i){ if(x.id===id) idx=i; });
  if(miniState.id) closeMiniplayer(true);
  state.shortsIdx=idx; state.view="shorts"; state.searchOpen=false;
  renderApp(); window.scrollTo(0,0);
  /* The active short mounts its media asynchronously (IndexedDB
     bytes); re-check shortly after open so a lost first play()
     cannot leave the short paused. */
  setTimeout(function(){ try{ ensureShortPlaying(); }catch(e){} },400);
}
function openWatch(id){
  var v=videoById(id); if(!v) return;
  if(isShortVideo(v)){ openShortsPlayer(id); return; }
  if(miniState.id && miniState.id!==id) closeMiniplayer(true);
  if(miniState.id===id){ expandMiniplayer(); return; }
  viewRecordedFor=null;
  state.watchId=id; state.view="watch"; state.searchOpen=false; state.adPending=id;
  /* Uploaded video: fetch the IndexedDB bytes first so the player
     never renders with a dead blob: URL. With bytes it plays from
     a fresh URL; without them the page shows the plain message. */
  ensureVideoSrc(v,function(){ try{ renderApp(); }catch(e){} try{ window.scrollTo(0,0); }catch(e){} autoplayWatchPlayer(); });
  watchHistoryPush(id);
}
/* Downscale before storing: a full-size phone photo as base64 can
   exceed the ~5 MB localStorage quota, so images are shrunk on a
   canvas first — banner max 1280 px wide, logo max 400 px, JPEG
   quality 0.75. If the canvas is unavailable the original is kept
   and the caller still checks the save result before toasting. */
function downscaleImage(dataUrl,maxW,cb){
  var img=new Image();
  img.onload=function(){
    try{
      var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
      if(!w || !h || w<=maxW){ cb(dataUrl); return; }
      var c=document.createElement("canvas");
      c.width=maxW; c.height=Math.max(1,Math.round(h*maxW/w));
      var ctx=c.getContext("2d");
      if(!ctx){ cb(dataUrl); return; }
      ctx.drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL("image/jpeg",0.75));
    }catch(e){ cb(dataUrl); }
  };
  img.onerror=function(){ cb(dataUrl); };
  img.src=dataUrl;
}
function readImage(file,cb,maxW){
  if(!file) return;
  var r=new FileReader();
  r.onload=function(){ if(maxW) downscaleImage(r.result,maxW,cb); else cb(r.result); };
  r.readAsDataURL(file);
}
/* Logo zoom editor: pick a photo, zoom (1x-3x) and drag it inside the
   circle so the face fits, then Save renders the visible circular
   region to a 400x400 JPEG (q0.75, same as downscaleImage). Cancel
   changes nothing. At 1x with no drag the saved crop is the same
   centred cover crop the circular avatar display shows, so it matches
   the old direct-save result. The banner picker is untouched. */
var logoZoomState=null;
var LOGO_ZOOM_SIZE=260, LOGO_ZOOM_OUT=400;
function logoZoomDraw(ctx,size,st){
  var img=st.img, iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
  if(!iw||!ih) return;
  var base=Math.max(size/iw,size/ih);
  var dw=iw*base*st.scale, dh=ih*base*st.scale;
  var maxOx=Math.max(0,(dw-size)/2), maxOy=Math.max(0,(dh-size)/2);
  st.ox=Math.max(-maxOx,Math.min(maxOx,st.ox));
  st.oy=Math.max(-maxOy,Math.min(maxOy,st.oy));
  ctx.save();
  ctx.clearRect(0,0,size,size);
  ctx.beginPath(); ctx.arc(size/2,size/2,size/2,0,Math.PI*2); ctx.clip();
  ctx.drawImage(img,size/2-dw/2+st.ox,size/2-dh/2+st.oy,dw,dh);
  ctx.restore();
}
function logoZoomRender(){
  var st=logoZoomState; if(!st) return;
  var cv=document.getElementById("logo-zoom-canvas"); if(!cv) return;
  var ctx=cv.getContext("2d"); if(!ctx) return;
  logoZoomDraw(ctx,LOGO_ZOOM_SIZE,st);
  var lbl=document.getElementById("logo-zoom-label"); if(lbl) lbl.textContent=(Math.round(st.scale*10)/10)+"x";
}
function logoZoomClose(){ logoZoomState=null; var o=document.getElementById("overlay-root"); if(o) o.innerHTML=""; }
function logoZoomSave(){
  var st=logoZoomState; if(!st||!myChannel) return;
  try{
    var c=document.createElement("canvas"); c.width=LOGO_ZOOM_OUT; c.height=LOGO_ZOOM_OUT;
    var ctx=c.getContext("2d"); if(!ctx) return;
    var k=LOGO_ZOOM_OUT/LOGO_ZOOM_SIZE;
    var scaled={img:st.img,scale:st.scale,ox:st.ox*k,oy:st.oy*k};
    logoZoomDraw(ctx,LOGO_ZOOM_OUT,scaled);
    var url=c.toDataURL("image/jpeg",0.75);
    var old=myChannel.avatarImg; myChannel.avatarImg=url;
    if(saveUserData()){ try{ fbSyncChannel(myChannel); }catch(e){} logoZoomClose(); renderApp(); toast(t("saved")); }
    else { myChannel.avatarImg=old; toast(t("saveFailed")); }
  }catch(e){ toast(t("saveFailed")); }
}
function openLogoZoomEditor(dataUrl){
  var img=new Image();
  img.onload=function(){
    logoZoomState={img:img,url:dataUrl,scale:1,ox:0,oy:0};
    var o=document.getElementById("overlay-root"); if(!o) return;
    o.innerHTML='<div class="modal-back"><div class="modal"><h2>'+esc(t("logoZoomTitle"))+'</h2>'
      +'<p class="sub">'+esc(t("logoZoomHint"))+'</p>'
      +'<div class="logo-zoom-wrap"><div class="logo-zoom-stage" id="logo-zoom-stage"><canvas id="logo-zoom-canvas" width="'+LOGO_ZOOM_SIZE+'" height="'+LOGO_ZOOM_SIZE+'"></canvas></div>'
      +'<div class="logo-zoom-row"><span>1x</span><input type="range" id="logo-zoom-range" min="1" max="3" step="0.1" value="1"><span id="logo-zoom-label">1x</span></div>'
      +'<div class="logo-zoom-actions"><button class="btn" id="logo-zoom-cancel">'+esc(t("logoZoomCancel"))+'</button><button class="btn red" id="logo-zoom-save">'+esc(t("saveBtn"))+'</button></div></div></div></div>';
    logoZoomRender();
    var rg=document.getElementById("logo-zoom-range");
    if(rg) rg.addEventListener("input",function(){ if(logoZoomState){ logoZoomState.scale=parseFloat(rg.value)||1; logoZoomRender(); } });
    var stg=document.getElementById("logo-zoom-stage");
    if(stg){
      var drag=null;
      stg.addEventListener("pointerdown",function(e){ if(!logoZoomState) return; drag={x:e.clientX,y:e.clientY,ox:logoZoomState.ox,oy:logoZoomState.oy}; try{ stg.setPointerCapture(e.pointerId); }catch(err){} e.preventDefault(); });
      stg.addEventListener("pointermove",function(e){ if(!drag||!logoZoomState) return; logoZoomState.ox=drag.ox+(e.clientX-drag.x); logoZoomState.oy=drag.oy+(e.clientY-drag.y); logoZoomRender(); });
      var endDrag=function(){ drag=null; };
      stg.addEventListener("pointerup",endDrag); stg.addEventListener("pointercancel",endDrag);
    }
    var sv=document.getElementById("logo-zoom-save"); if(sv) sv.addEventListener("click",logoZoomSave);
    var cx=document.getElementById("logo-zoom-cancel"); if(cx) cx.addEventListener("click",function(){ logoZoomClose(); });
  };
  img.onerror=function(){ if(myChannel){ var old=myChannel.avatarImg; myChannel.avatarImg=dataUrl; if(saveUserData()){ try{ fbSyncChannel(myChannel); }catch(e){} renderApp(); toast(t("saved")); } else { myChannel.avatarImg=old; toast(t("saveFailed")); } } };
  img.src=dataUrl;
}

/* ---------- Corner account menu (YouTube-style) ----------
   Opened from the avatar in the top-right corner. Header shows the
   channel avatar, channel name, handle and the signed-in Gmail.
   Below: Your channel (or Create channel when this Gmail has no
   channel yet), RK Studio, team tools (team session only), switch
   account, language, Get the app, and Sign out. */
function openNotifications(){
  var items=[];
  var subIds=Object.keys(subscriptions).filter(function(k){ return subscriptions[k]; });
  var latest=videos.filter(function(v){ return subIds.indexOf(v.channelId)>=0 && canListVideo(v); }).slice().reverse().slice(0,5);
  latest.forEach(function(v){ var ch=chanById(v.channelId); items.push({id:v.id,title:v.title,sub:(ch?ch.name:"")+" - "+fmt(realViews(v.id))+" "+t("views")}); });
  if(isOwner()){
    var pend=reports.filter(function(r){ return r.status==="pending"; }).length;
    if(pend) items.push({id:null,title:t("pendingReports"),sub:pend+" "+t("reportStatusPending")});
  }
  var body=items.length? items.map(function(it){
    return it.id
      ? '<button class="notif-item" data-notif-watch="'+it.id+'"><span style="font-size:18px">&#9654;</span><span><h4>'+esc(it.title)+'</h4><p>'+esc(it.sub)+'</p></span></button>'
      : '<button class="notif-item" data-notif-reports="1"><span style="font-size:18px">&#9873;</span><span><h4>'+esc(it.title)+'</h4><p>'+esc(it.sub)+'</p></span></button>';
  }).join("") : '<div class="empty-note">'+esc(t("noNotifications"))+'</div>';
  overlay.innerHTML='<div class="modal-back"><div class="modal"><button class="icon-btn x" id="nt-x" aria-label="Close">&times;</button>'
  + '<h2>'+esc(t("notifications"))+'</h2>'
  + (subIds.length? '<p class="sub">'+esc(t("newFromSubs"))+'</p>' : "")
  + body + '</div></div>';
  document.getElementById("nt-x").addEventListener("click",function(){ overlay.innerHTML=""; });
  overlay.querySelectorAll("[data-notif-watch]").forEach(function(b){ b.addEventListener("click",function(){ overlay.innerHTML=""; openWatch(b.getAttribute("data-notif-watch")); }); });
  overlay.querySelectorAll("[data-notif-reports]").forEach(function(b){ b.addEventListener("click",function(){ overlay.innerHTML=""; if(isOwner()){ state.view="studio"; state.studioTab="reports"; renderApp(); window.scrollTo(0,0); } }); });
}
