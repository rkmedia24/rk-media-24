 {id:"notplaying",keys:["not playing","won't play","wont play","cannot play","can't play","চলে না","চলছে না","চলতেছে না","play hoy na","প্লে হয় না","black screen","ভিডিও চলে"],
  en:"If a video will not play:\n1. Check your internet connection and try again.\n2. If it is your own video, its upload may not have finished — upload it again and keep the app open until it shows Upload ready.\n3. Some formats cannot play on every phone. MP4 works best — convert the video to MP4 and upload it again.\n4. Close the app fully, open it again, and try once more.",
  bn:"ভিডিও না চললে:\n১. ইন্টারনেট সংযোগ চেক করে আবার চেষ্টা করুন।\n২. নিজের ভিডিও হলে আপলোড শেষ নাও হয়ে থাকতে পারে — আবার আপলোড করুন এবং Upload ready না দেখানো পর্যন্ত অ্যাপ খোলা রাখুন।\n৩. কিছু ফরম্যাট সব ফোনে চলে না। MP4 সবচেয়ে ভালো — ভিডিও MP4 করে আবার আপলোড করুন।\n৪. অ্যাপ পুরোপুরি বন্ধ করে আবার খুলে চেষ্টা করুন।",
  hi:"वीडियो न चले तो:\n1. इंटरनेट कनेक्शन जांचकर फिर कोशिश करें।\n2. अगर यह आपका अपना वीडियो है, तो शायद उसका अपलोड पूरा नहीं हुआ — फिर से अपलोड करें और Upload ready दिखने तक ऐप खुला रखें।\n3. कुछ फ़ॉर्मेट हर फ़ोन पर नहीं चलते। MP4 सबसे अच्छा है — वीडियो को MP4 में बदलकर फिर अपलोड करें।\n4. ऐप पूरी तरह बंद करके फिर खोलें और कोशिश करें।"},
 {id:"upload",keys:["how to upload","upload a video","upload video","post a video","how do i upload","আপলোড করব","আপলোড কিভাবে","আপলোড কীভাবে","ভিডিও দিব","ভিডিও ছাড়ব","upload korte","আপলোড"],
  en:"How to upload a video:\n1. Sign in with your Gmail and open your channel.\n2. Tap the + (Create) button.\n3. Choose Long video, Short video or Photo.\n4. Pick the video file, write a title, add hashtags (for example #funny #music) and choose who can see it — Public, Unlisted or Private.\n5. Keep the app open until it says Upload ready — only then is the video saved online for everyone.\nShorts must be vertical (9:16) and 2 minutes or less. Long videos can be any length.",
  bn:"ভিডিও আপলোড করার নিয়ম:\n১. Gmail দিয়ে সাইন-ইন করে আপনার চ্যানেল খুলুন।\n২. + (Create) বাটনে চাপ দিন।\n৩. Long video, Short video বা Photo বেছে নিন।\n৪. ভিডিও ফাইল বেছে নিন, টাইটেল লিখুন, হ্যাশট্যাগ দিন (যেমন #funny #music) এবং কে দেখতে পারবে বেছে নিন — Public, Unlisted বা Private।\n৫. Upload ready না দেখানো পর্যন্ত অ্যাপ খোলা রাখুন — তখনই ভিডিও সবার জন্য অনলাইনে সেভ হয়।\nশর্ট হতে হবে খাড়া (9:16) এবং ২ মিনিট বা তার কম। লম্বা ভিডিও যেকোনো দৈর্ঘ্যের হতে পারে।",
  hi:"वीडियो अपलोड करने का तरीका:\n1. अपने Gmail से साइन-इन करें और अपना चैनल खोलें।\n2. + (Create) बटन दबाएं।\n3. Long video, Short video या Photo चुनें।\n4. वीडियो फ़ाइल चुनें, टाइटल लिखें, हैशटैग दें (जैसे #funny #music) और चुनें कि कौन देख सकता है — Public, Unlisted या Private।\n5. Upload ready दिखने तक ऐप खुला रखें — तभी वीडियो सबके लिए ऑनलाइन सेव होता है।\nशॉर्ट वर्टिकल (9:16) और 2 मिनट या उससे कम का होना चाहिए। लंबे वीडियो किसी भी लंबाई के हो सकते हैं।"},
 {id:"shorts",keys:["short","শর্ট","vertical","খাড়া","2 minutes","too long for a short"],
  en:"About Shorts:\n• A Short is a VERTICAL video (9:16), 2 minutes or less.\n• If your upload was refused as a Short, check two things: is it vertical, and is it under 2 minutes?\n• A horizontal (16:9) or longer video cannot be a Short — upload it as a Long video instead.\n• Vertical videos of 2 minutes or less appear in the Shorts tab automatically.",
  bn:"শর্ট সম্পর্কে:\n• শর্ট মানে খাড়া (9:16) ভিডিও, ২ মিনিট বা তার কম।\n• আপলোড শর্ট হিসেবে না নিলে দুটো জিনিস চেক করুন: ভিডিওটা খাড়া কিনা, আর ২ মিনিটের কম কিনা।\n• আড়াআড়ি (16:9) বা লম্বা ভিডিও শর্ট হয় না — সেটা Long video হিসেবে আপলোড করুন।\n• ২ মিনিট বা তার কমের খাড়া ভিডিও অটোমেটিক Shorts ট্যাবে আসে।",
  hi:"शॉर्ट्स के बारे में:\n• शॉर्ट एक वर्टिकल वीडियो (9:16) होता है, 2 मिनट या उससे कम।\n• अगर आपका अपलोड शॉर्ट के रूप में स्वीकार नहीं हुआ, तो दो चीज़ें जांचें: क्या यह वर्टिकल है, और क्या यह 2 मिनट से कम है?\n• हॉरिज़ॉन्टल (16:9) या लंबा वीडियो शॉर्ट नहीं बन सकता — उसे Long video के रूप में अपलोड करें।\n• 2 मिनट या उससे कम के वर्टिकल वीडियो Shorts टैब में अपने आप आ जाते हैं।"},
 {id:"channel",keys:["create a channel","open a channel","make a channel","new channel","চ্যানেল খুলব","চ্যানেল খুলতে","চ্যানেল তৈরি","channel khulbo","edit channel","change channel name","banner","channel logo"],
  en:"How to open a channel:\n1. Tap Sign in and sign in with your Gmail.\n2. Tap your profile photo in the top corner, then Create channel.\n3. Give your channel a name, pick a logo photo and write the About.\n4. Add a banner and up to 3 links (Facebook, YouTube and so on) from Edit channel.\nOne Gmail can own more than one channel — switch between them from the profile menu.",
  bn:"চ্যানেল খোলার নিয়ম:\n১. Sign in-এ চাপ দিয়ে Gmail দিয়ে সাইন-ইন করুন।\n২. উপরের কোণায় আপনার প্রোফাইল ছবিতে চাপ দিয়ে Create channel বেছে নিন।\n৩. চ্যানেলের নাম দিন, লোগোর ছবি বেছে নিন, About লিখুন।\n৪. Edit channel থেকে ব্যানার আর সর্বোচ্চ ৩টি লিংক (Facebook, YouTube ইত্যাদি) যোগ করুন।\nএকটা Gmail দিয়ে একাধিক চ্যানেল রাখা যায় — প্রোফাইল মেনু থেকে বদলাতে পারবেন।",
  hi:"चैनल बनाने का तरीका:\n1. Sign in दबाकर अपने Gmail से साइन-इन करें।\n2. ऊपर कोने में अपनी प्रोफ़ाइल फ़ोटो दबाकर Create channel चुनें।\n3. चैनल का नाम दें, लोगो की फ़ोटो चुनें और About लिखें।\n4. Edit channel से बैनर और अधिकतम 3 लिंक (Facebook, YouTube आदि) जोड़ें।\nएक Gmail से एक से ज़्यादा चैनल रखे जा सकते हैं — प्रोफ़ाइल मेनू से बदल सकते हैं।"},
 {id:"signin",keys:["sign in","signin","login","log in","can't sign","cannot sign","সাইন-ইন","লগইন","ঢুকতে পারছি না","ঢুকতে পারছিনা","gmail problem","switch account","sign out","forgot gmail","forgot which"],
  en:"About signing in:\n• RK Tube signs you in with your Gmail. Always use the same Gmail — your channel and videos are tied to it.\n• Your channel belongs to the Gmail you were signed in with when you created it.\n• Installing a new version of the app OVER the old one keeps everything — do not uninstall first.\n• Even after uninstalling, sign in again with the same Gmail and your channel and your finished uploads come back.\n• To change account: profile photo in the top corner → Switch account.",
  bn:"সাইন-ইন সম্পর্কে:\n• RK Tube-তে Gmail দিয়ে সাইন-ইন হয়। সব সময় একই Gmail ব্যবহার করুন — আপনার চ্যানেল আর ভিডিও ওই Gmail-এর সাথেই যুক্ত।\n• চ্যানেল তৈরি করার সময় যে Gmail দিয়ে সাইন-ইন ছিলেন, চ্যানেলটা সেই Gmail-এর।\n• অ্যাপের নতুন ভার্সন পুরানটার উপরেই ইনস্টল করুন — আগে আনইনস্টল করবেন না, সব ঠিক থাকবে।\n• আনইনস্টল হয়ে গেলেও একই Gmail দিয়ে আবার সাইন-ইন করলেই চ্যানেল আর শেষ হওয়া আপলোডগুলো ফিরে আসে।\n• অ্যাকাউন্ট বদলাতে: উপরের কোণায় প্রোফাইল ছবি → Switch account।",
  hi:"साइन-इन के बारे में:\n• RK Tube में Gmail से साइन-इन होता है। हमेशा वही Gmail इस्तेमाल करें — आपका चैनल और वीडियो उसी से जुड़े हैं।\n• आपका चैनल उस Gmail का है जिससे साइन-इन करके आपने उसे बनाया था।\n• ऐप का नया वर्शन पुराने के ऊपर ही इंस्टॉल करें — पहले अनइंस्टॉल न करें, सब कुछ सुरक्षित रहेगा।\n• अनइंस्टॉल हो जाने पर भी उसी Gmail से फिर साइन-इन करने पर आपका चैनल और पूरे हुए अपलोड वापस आ जाते हैं।\n• अकाउंट बदलने के लिए: ऊपर कोने में प्रोफ़ाइल फ़ोटो → Switch account।"},
 {id:"subs",keys:["subscribe","subscriber","সাবস্ক্রাইব","bell","notification","নোটিফিকেশন","views","view","ভিউ","watch time"],
  en:"Subscribers, the bell and views:\n• Viewers tap Subscribe on your channel, then the bell, to get notifications about your new videos.\n• A view is counted when a video actually plays.\n• Keep uploading good videos and share your channel link with friends to grow.\n• See your numbers any time in RK Tube Studio → Dashboard and Analytics.",
  bn:"সাবস্ক্রাইবার, বেল আর ভিউ:\n• দর্শক আপনার চ্যানেলে Subscribe চাপ দিয়ে বেল চাপলেই নতুন ভিডিওর নোটিফিকেশন পায়।\n• ভিডিও আসলেই চললেই ভিউ গোনা হয়।\n• ভালো ভিডিও আপলোড করুন আর চ্যানেলের লিংক বন্ধুদের সাথে শেয়ার করুন — এভাবেই চ্যানেল বড় হয়।\n• আপনার সংখ্যাগুলো দেখুন RK Tube Studio → Dashboard আর Analytics-এ।",
  hi:"सब्सक्राइबर, बेल और व्यू:\n• दर्शक आपके चैनल पर Subscribe दबाकर बेल दबाएं तो उन्हें आपके नए वीडियो की नोटिफिकेशन मिलती है।\n• व्यू तभी गिना जाता है जब वीडियो सच में चलता है।\n• अच्छे वीडियो अपलोड करते रहें और चैनल का लिंक दोस्तों के साथ शेयर करें — इसी तरह चैनल बढ़ता है।\n• अपने नंबर कभी भी RK Tube Studio → Dashboard और Analytics में देखें।"},
 {id:"monetization",keys:["monetization","monetize","মনিটাইজেশন","মনিটাইজ","earn money","income","টাকা আয়","আয় করব","আয় করতে","payment","payout","পেমেন্ট","টাকা পাব","watch hour"],
  en:"Monetization on RK Tube:\n• Your channel needs 500 subscribers AND 3,000 watch hours.\n• When you reach both, open RK Tube Studio → Monetization and tap Apply for monetization.\n• The RK Tube team reviews everything. If everything is complete and correct, the team turns monetization ON for your channel.\n• Earnings are then calculated automatically from your views, at the rate the RK Tube team sets per 1,000 views.\n• Save your bank account details in your channel so the RK Tube team can pay you. Payments start from the minimum payout amount the team sets.",
  bn:"RK Tube-এ মনিটাইজেশন:\n• আপনার চ্যানেলে লাগবে ৫০০ সাবস্ক্রাইবার এবং ৩,০০০ ওয়াচ আওয়ার (ঘণ্টা দেখা)।\n• দুটোই পূরণ হলে RK Tube Studio → Monetization-এ গিয়ে Apply for monetization চাপুন।\n• আরকে টিউব টিম সবকিছু যাচাই করে দেখে। সবকিছু সম্পূর্ণ আর ঠিকঠাক থাকলেই টিম আপনার চ্যানেলে মনিটাইজেশন চালু করে দেয়।\n• তারপর আয় অটোমেটিক হিসাব হয় আপনার ভিউ থেকে — আরকে টিউব টিম প্রতি ১,০০০ ভিউতে যে রেট ঠিক করে সেই অনুযায়ী।\n• চ্যানেলে আপনার ব্যাংক অ্যাকাউন্টের তথ্য সেভ করে রাখুন, যাতে আরকে টিউব টিম টাকা পাঠাতে পারে। টিমের ঠিক করা সর্বনিম্ন অঙ্ক থেকে পেমেন্ট শুরু হয়।",
  hi:"RK Tube पर मोनेटाइजेशन:\n• आपके चैनल को 500 सब्सक्राइबर और 3,000 वॉच आवर चाहिए।\n• दोनों पूरे हो जाएं तो RK Tube Studio → Monetization में जाकर Apply for monetization दबाएं।\n• RK Tube टीम सब कुछ जांचकर देखती है। सब कुछ पूरा और सही होने पर टीम आपके चैनल पर मोनेटाइजेशन चालू कर देती है।\n• उसके बाद कमाई आपके व्यू से ऑटोमैटिक गिनी जाती है — RK Tube टीम प्रति 1,000 व्यू पर जो रेट तय करती है, उसी हिसाब से।\n• अपने चैनल में बैंक अकाउंट की जानकारी सेव रखें ताकि RK Tube टीम पैसे भेज सके। पेमेंट टीम की तय की गई न्यूनतम राशि से शुरू होता है।"},
 {id:"guidelines",keys:["guideline","guidelines","গাইডলাইন","rules","নিয়ম","policy","নীতি","what is allowed","what is not allowed","কী আপলোড করা যাবে"],
  en:"RK Tube Community Guidelines.\nUpload only your own videos, or videos you have the rights to use.\nNot allowed:\n• Full films, TV shows, songs or someone else's video uploaded as your own (copyright).\n• Violent or dangerous content, or instructions for weapons or harmful acts.\n• Hate, threats or harassment against any person or group.\n• Spam, scams, fake giveaways, or titles and thumbnails that promise what the video does not have.\n• Sexual or nude content, and anything that puts children at risk — child-safety violations are removed immediately and get a strike right away.\nBreaking the rules brings a warning first, then strikes. Ask me about warnings and strikes for the details.",
  bn:"RK Tube কমিউনিটি গাইডলাইন।\nশুধু নিজের বানানো ভিডিও, বা ব্যবহারের অধিকার আছে এমন ভিডিও আপলোড করুন।\nযা চলবে না:\n• পুরো সিনেমা, টিভি অনুষ্ঠান, গান বা অন্যের ভিডিও নিজের বলে আপলোড করা (কপিরাইট)।\n• সহিংস বা বিপজ্জনক বিষয়, অস্ত্র বা ক্ষতিকর কাজের নির্দেশনা।\n• কোনো ব্যক্তি বা গোষ্ঠীর প্রতি ঘৃণা, হুমকি বা হয়রানি।\n• স্প্যাম, প্রতারণা, ভুয়া পুরস্কার, কিংবা ভিডিওতে যা নেই টাইটেল-থাম্বনেইলে তার প্রতিশ্রুতি।\n• যৌন বা নগ্ন বিষয়, আর শিশুদের ঝুঁকিতে ফেলে এমন কিছু — শিশু নিরাপত্তা ভাঙলে সাথে সাথে সরানো হয় এবং সরাসরি স্ট্রাইক হয়।\nনিয়ম ভাঙলে আগে ওয়ার্নিং, তারপর স্ট্রাইক হয়। বিস্তারিত জানতে ওয়ার্নিং ও স্ট্রাইক নিয়ে জিজ্ঞেস করুন।",
  hi:"RK Tube कम्युनिटी गाइडलाइन।\nसिर्फ़ अपने बनाए हुए वीडियो, या जिनके इस्तेमाल का अधिकार आपके पास है, वही अपलोड करें।\nजो मना है:\n• पूरी फ़िल्में, टीवी शो, गाने या किसी और का वीडियो अपना बताकर अपलोड करना (कॉपीराइट)।\n• हिंसक या ख़तरनाक सामग्री, या हथियारों या हानिकारक कामों के निर्देश।\n• किसी व्यक्ति या समूह के प्रति नफ़रत, धमकी या उत्पीड़न।\n• स्पैम, धोखाधड़ी, नकली इनाम, या ऐसे टाइटल व थंबनेल जो वीडियो में न हो उसका वादा करें।\n• यौन या नग्न सामग्री, और बच्चों को जोखिम में डालने वाली कोई भी चीज़ — बाल सुरक्षा का उल्लंघन तुरंत हटाया जाता है और सीधे स्ट्राइक मिलती है।\nनियम तोड़ने पर पहले वार्निंग, फिर स्ट्राइक मिलती है। विस्तार के लिए वार्निंग और स्ट्राइक के बारे में पूछें।"},
 {id:"strike",keys:["strike","স্ট্রাইক","warning","ওয়ার্নিং","terminated","channel closed","চ্যানেল বন্ধ","banned"],
  en:"Warnings and strikes:\n• First violation = a WARNING (not a strike). It stays on the channel for 90 days, then it is removed automatically.\n• Another violation after a warning = a STRIKE. Strikes also expire after 90 days.\n• 3 active strikes at the same time = the channel is terminated and cannot upload again.\n• Check your channel standing any time in RK Tube Studio → Guidelines.",
  bn:"ওয়ার্নিং ও স্ট্রাইক:\n• প্রথমবার নিয়ম ভাঙলে = ওয়ার্নিং (স্ট্রাইক নয়)। এটা চ্যানেলে ৯০ দিন থাকে, তারপর অটোমেটিক মুছে যায়।\n• ওয়ার্নিংয়ের পরে আবার নিয়ম ভাঙলে = স্ট্রাইক। স্ট্রাইকও ৯০ দিন পর শেষ হয়ে যায়।\n• একসাথে ৩টি সক্রিয় স্ট্রাইক = চ্যানেল বন্ধ, আর আপলোড করা যায় না।\n• আপনার চ্যানেলের অবস্থা যেকোনো সময় দেখুন RK Tube Studio → Guidelines-এ।",
  hi:"वार्निंग और स्ट्राइक:\n• पहली बार नियम तोड़ने पर = वार्निंग (स्ट्राइक नहीं)। यह चैनल पर 90 दिन रहती है, फिर अपने आप हट जाती है।\n• वार्निंग के बाद फिर नियम तोड़ा = स्ट्राइक। स्ट्राइक भी 90 दिन बाद ख़त्म हो जाती है।\n• एक साथ 3 सक्रिय स्ट्राइक = चैनल बंद, फिर अपलोड नहीं होगा।\n• अपने चैनल की स्थिति कभी भी RK Tube Studio → Guidelines में देखें।"},
 {id:"report",keys:["report","রিপোর্ট","removed my video","video removed","ভিডিও সরিয়ে","ভিডিও ডিলিট হয়েছে"],
  en:"Reports:\n• Any viewer can report a video that breaks the guidelines — open the video's three-dot menu and choose Report, then pick the reason.\n• The RK Tube team reviews every report: the video is kept if there is no problem, or removed. Removing can also add a warning or strike to that channel.\n• If your video was removed and you think it was a mistake, open the Guidelines page in RK Tube Studio to see the reason recorded for your channel.",
  bn:"রিপোর্ট:\n• গাইডলাইন ভাঙে এমন ভিডিও যেকোনো দর্শক রিপোর্ট করতে পারে — ভিডিওর তিন-ডট মেনু থেকে Report বেছে কারণ বেছে নিন।\n• আরকে টিউব টিম প্রতিটি রিপোর্ট যাচাই করে: সমস্যা না থাকলে ভিডিও থাকে, থাকলে সরিয়ে দেওয়া হয়। সরানোর সাথে ওই চ্যানেলে ওয়ার্নিং বা স্ট্রাইকও যোগ হতে পারে।\n• আপনার ভিডিও সরানো হলে ভুল হয়েছে মনে হলে RK Tube Studio-র Guidelines পেজে আপনার চ্যানেলের জন্য লেখা কারণটা দেখুন।",
  hi:"रिपोर्ट:\n• गाइडलाइन तोड़ने वाले वीडियो को कोई भी दर्शक रिपोर्ट कर सकता है — वीडियो के तीन-डॉट मेनू से Report चुनकर कारण चुनें।\n• RK Tube टीम हर रिपोर्ट की जांच करती है: समस्या न हो तो वीडियो रहता है, हो तो हटा दिया जाता है। हटाने के साथ उस चैनल को वार्निंग या स्ट्राइक भी मिल सकती है।\n• अगर आपका वीडियो हटाया गया और आपको लगता है कि ग़लती हुई है, तो RK Tube Studio के Guidelines पेज पर अपने चैनल के लिए लिखा कारण देखें।"},
 {id:"live",keys:["live","লাইভ","go live","লাইভে যাব"],
  en:"Going live:\n• Your channel needs 20 subscribers and a verified mobile number.\n• Verify your number from the Live setup in the app — enter your mobile number and save it.\n• Live also needs the live server connection to be set up — if the app asks for an Agora App ID, the live server is not connected yet, and live will start once that connection is finished.\nThe RK Tube team account can always go live.",
  bn:"লাইভে যাওয়া:\n• আপনার চ্যানেলে লাগবে ২০ সাবস্ক্রাইবার এবং ভেরিফাই করা মোবাইল নাম্বার।\n• অ্যাপের Live সেটআপ থেকে নাম্বার ভেরিফাই করুন — মোবাইল নাম্বার লিখে সেভ করুন।\n• লাইভের জন্য লাইভ সার্ভারের সংযোগও লাগে — অ্যাপ Agora App ID চাইলে বুঝবেন লাইভ সার্ভার এখনো যুক্ত হয়নি; সংযোগ শেষ হলেই লাইভ চালু হবে।\nআরকে টিউব টিমের অ্যাকাউন্ট সব সময় লাইভে যেতে পারে।",
  hi:"लाइव जाने के लिए:\n• आपके चैनल को 20 सब्सक्राइबर और वेरिफ़ाई किया हुआ मोबाइल नंबर चाहिए।\n• ऐप के Live सेटअप से नंबर वेरिफ़ाई करें — मोबाइल नंबर लिखकर सेव करें।\n• लाइव के लिए लाइव सर्वर का कनेक्शन भी चाहिए — अगर ऐप Agora App ID मांगे, तो समझें कि लाइव सर्वर अभी जुड़ा नहीं है; कनेक्शन पूरा होते ही लाइव चालू होगा।\nRK Tube टीम का अकाउंट हमेशा लाइव जा सकता है।"},
 {id:"editdelete",keys:["edit video","delete video","delete my","edit my","ভিডিও এডিট","ভিডিও মুছব","ভিডিও ডিলিট","মুছে ফেলব","hashtag","হ্যাশট্যাগ"],
  en:"To edit or delete your video or photo post:\n• Open it and tap the three-dot menu.\n• Choose Edit to change the title, hashtags or visibility, or Delete to remove it.\n• Photo posts have only the three-dot menu — Share, Save, Like and Delete are all inside it.\nDeleting is permanent, so be sure before you confirm.",
  bn:"আপনার ভিডিও বা ছবির পোস্ট এডিট বা মুছতে:\n• সেটা খুলে তিন-ডট মেনুতে চাপ দিন।\n• Edit বেছে টাইটেল, হ্যাশট্যাগ বা দৃশ্যমানতা বদলান, অথবা Delete বেছে মুছে ফেলুন।\n• ছবির পোস্টে শুধু তিন-ডট মেনুই আছে — Share, Save, Like আর Delete সব ওর ভিতরেই।\nমুছে ফেলা স্থায়ী — নিশ্চিত হয়ে তবেই করুন।",
  hi:"अपना वीडियो या फ़ोटो पोस्ट एडिट या डिलीट करने के लिए:\n• उसे खोलकर तीन-डॉट मेनू दबाएं।\n• Edit चुनकर टाइटल, हैशटैग या विज़िबिलिटी बदलें, या Delete चुनकर हटा दें।\n• फ़ोटो पोस्ट में सिर्फ़ तीन-डॉट मेनू होता है — Share, Save, Like और Delete सब उसी के अंदर हैं।\nडिलीट करना स्थायी है — पक्का करके ही करें।"},
 {id:"visibility",keys:["cannot find","can't find","not found","খুঁজে পাচ্ছি না","খুঁজে পাওয়া যাচ্ছে না","search problem","private video","visibility","দেখা যায় না","সার্চে আসে না"],
  en:"If a video cannot be found:\n• Check its visibility — Private videos are visible only to you, Unlisted videos open only with the link, Public videos appear in the feed and in search for everyone.\n• Change visibility from the video's three-dot menu → Edit.\n• Also make sure the upload finished — a video that is still only on your phone does not appear for anyone else.",
  bn:"ভিডিও খুঁজে না পেলে:\n• দৃশ্যমানতা চেক করুন — Private ভিডিও শুধু আপনি দেখতে পান, Unlisted শুধু লিংক দিয়ে খোলে, Public ভিডিও ফিড আর সার্চে সবার কাছে আসে।\n• দৃশ্যমানতা বদলান ভিডিওর তিন-ডট মেনু → Edit থেকে।\n• আপলোড শেষ হয়েছে কিনা তাও দেখুন — ভিডিও শুধু আপনার ফোনে থাকলে অন্য কারো কাছে আসবে না।",
  hi:"वीडियो न मिले तो:\n• उसकी विज़िबिलिटी जांचें — Private वीडियो सिर्फ़ आप देख सकते हैं, Unlisted सिर्फ़ लिंक से खुलता है, Public वीडियो फ़ीड और सर्च में सबको दिखता है।\n• विज़िबिलिटी वीडियो के तीन-डॉट मेनू → Edit से बदलें।\n• यह भी देखें कि अपलोड पूरा हुआ था या नहीं — वीडियो सिर्फ़ आपके फ़ोन में हो तो किसी और को नहीं दिखेगा।"},
 {id:"studio",keys:["studio","স্টুডিও","analytics","dashboard","ড্যাশবোর্ড"],
  en:"RK Tube Studio is the creator app that works with RK Tube — like YouTube Studio. Open it from your profile menu with RK Studio. There you can see your Dashboard and Analytics, manage your videos, apply for monetization, check warnings and strikes in Guidelines, and look after your channel. It opens with the same Gmail as RK Tube.",
  bn:"RK Tube Studio হলো RK Tube-এর সাথে কাজ করা ক্রিয়েটর অ্যাপ — YouTube Studio-র মতো। প্রোফাইল মেনু থেকে RK Studio চাপ দিয়ে খুলুন। সেখানে Dashboard আর Analytics দেখতে পারবেন, ভিডিও পরিচালনা, মনিটাইজেশনের আবেদন, Guidelines-এ ওয়ার্নিং ও স্ট্রাইক চেক — সব এক জায়গায়। RK Tube-এর একই Gmail দিয়েই খোলে।",
  hi:"RK Tube Studio, RK Tube के साथ काम करने वाला क्रिएटर ऐप है — YouTube Studio की तरह। प्रोफ़ाइल मेनू से RK Studio दबाकर खोलें। वहां Dashboard और Analytics देख सकते हैं, वीडियो संभाल सकते हैं, मोनेटाइजेशन के लिए आवेदन कर सकते हैं, Guidelines में वार्निंग और स्ट्राइक जांच सकते हैं। यह RK Tube वाले उसी Gmail से खुलता है।"},
 {id:"ads",keys:["ads","advertisement","বিজ্ঞাপন","বিজ্ঞাপণ"],
  en:"About ads on RK Tube:\n• Ads are placed by the RK Tube team and can appear before a video, below it, or in the feed.\n• Creators do not place their own ads — when your channel is monetized, you earn from the ads the team runs.\n• Only the RK Tube team sees the ad controls, in the team panel.",
  bn:"RK Tube-এ বিজ্ঞাপন:\n• বিজ্ঞাপন বসায় আরকে টিউব টিম — ভিডিওর আগে, নিচে বা ফিডে আসতে পারে।\n• ক্রিয়েটররা নিজে বিজ্ঞাপন বসাতে পারে না — আপনার চ্যানেল মনিটাইজড হলে টিমের চালানো বিজ্ঞাপন থেকেই আপনি আয় করেন।\n• বিজ্ঞাপনের নিয়ন্ত্রণ শুধু আরকে টিউব টিম দেখে, টিম প্যানেলে।",
  hi:"RK Tube पर विज्ञापन:\n• विज्ञापन RK Tube टीम लगाती है और वे वीडियो से पहले, नीचे या फ़ीड में आ सकते हैं।\n• क्रिएटर ख़ुद विज्ञापन नहीं लगाते — जब आपका चैनल मोनेटाइज़ होता है, तो टीम के चलाए विज्ञापनों से आप कमाते हैं।\n• विज्ञापन का नियंत्रण सिर्फ़ RK Tube टीम देखती है, टीम पैनल में।"},
 {id:"premium",keys:["premium","প্রিমিয়াম","is it free","free?","ফ্রি"],
  en:"RK Tube is free. There is no Premium in RK Tube yet — watching, uploading and every feature here stays free.",
  bn:"RK Tube ফ্রি। RK Tube-তে এখনো কোনো Premium নেই — দেখা, আপলোড আর সব ফিচার এখানে ফ্রিই থাকবে।",
  hi:"RK Tube मुफ़्त है। RK Tube में अभी कोई Premium नहीं है — देखना, अपलोड करना और हर फ़ीचर यहाँ मुफ़्त ही रहेगा।"},
 {id:"language",keys:["language","ভাষা","change language","বাংলা করব","english korbo"],
  en:"To change the app language: tap your profile photo in the top corner and choose your language from the list, or open Settings with the gear icon. The app starts in English by default and remembers your choice.",
  bn:"অ্যাপের ভাষা বদলাতে: উপরের কোণায় প্রোফাইল ছবিতে চাপ দিয়ে তালিকা থেকে ভাষা বেছে নিন, অথবা গিয়ার আইকন থেকে Settings খুলুন। অ্যাপ ডিফল্টভাবে English-এ শুরু হয় এবং আপনার পছন্দ মনে রাখে।",
  hi:"ऐप की भाषा बदलने के लिए: ऊपर कोने में अपनी प्रोफ़ाइल फ़ोटो दबाकर सूची से भाषा चुनें, या गियर आइकन से Settings खोलें। ऐप डिफ़ॉल्ट रूप से English में शुरू होता है और आपकी पसंद याद रखता है। और यहाँ हेल्प सेंटर में आप जिस भाषा में चैट करेंगे, मैं उसी भाषा में जवाब दूंगा।"},
 {id:"install",keys:["install","ইনস্টল","update app","app update","new phone","নতুন ফোন","apk","download app","অ্যাপ আপডেট"],
  en:"Getting and updating RK Tube:\n• Install the app file (APK) shared by RK MEDIA.\n• For an update, install the new version OVER the old app — do NOT uninstall first. Your channel, videos and sign-in stay safe.\n• Your channel and finished uploads are tied to your Gmail, so signing in with the same Gmail on a new phone brings them back.\n• Only trust app files shared by RK MEDIA.",
  bn:"RK Tube পাওয়া আর আপডেট করা:\n• RK MEDIA-এর দেওয়া অ্যাপ ফাইল (APK) ইনস্টল করুন।\n• আপডেটের সময় নতুন ভার্সন পুরান অ্যাপের উপরেই ইনস্টল করুন — আগে আনইনস্টল করবেন না। চ্যানেল, ভিডিও আর সাইন-ইন সব ঠিক থাকবে।\n• আপনার চ্যানেল আর শেষ হওয়া আপলোড Gmail-এর সাথে যুক্ত — নতুন ফোনে একই Gmail দিয়ে সাইন-ইন করলেই ফিরে আসে।\n• শুধু RK MEDIA-এর দেওয়া অ্যাপ ফাইলই বিশ্বাস করুন।",
  hi:"RK Tube पाना और अपडेट करना:\n• RK MEDIA की दी हुई ऐप फ़ाइल (APK) इंस्टॉल करें।\n• अपडेट के समय नया वर्शन पुराने ऐप के ऊपर ही इंस्टॉल करें — पहले अनइंस्टॉल न करें। चैनल, वीडियो और साइन-इन सब सुरक्षित रहेंगे।\n• आपका चैनल और पूरे हुए अपलोड आपके Gmail से जुड़े हैं — नए फ़ोन पर उसी Gmail से साइन-इन करते ही वापस आ जाते हैं।\n• सिर्फ़ RK MEDIA की दी हुई ऐप फ़ाइल पर ही भरोसा करें।"}
];
var HELP_FALLBACK={
 en:"I want to give you the right answer, so let me point you the right way. I can help with:\n• Uploading videos, Shorts and photos — and uploads that get stuck\n• Creating and editing your channel\n• Sign-in and account problems\n• Views, subscribers and notifications\n• Monetization — 500 subscribers + 3,000 watch hours\n• Guidelines, warnings, strikes and reports\n• Going live\n• Who owns and developed RK Tube\nTap a topic above, or ask again with a few more words about your problem.",
 bn:"সঠিক উত্তরটাই দিতে চাই, তাই পথটা দেখিয়ে দিচ্ছি। আমি যেসব বিষয়ে সাহায্য করতে পারি:\n• ভিডিও, শর্ট আর ছবি আপলোড — আটকে যাওয়া আপলোডসহ\n• চ্যানেল খোলা আর সাজানো\n• সাইন-ইন আর অ্যাকাউন্টের সমস্যা\n• ভিউ, সাবস্ক্রাইবার আর নোটিফিকেশন\n• মনিটাইজেশন — ৫০০ সাবস্ক্রাইবার + ৩,০০০ ওয়াচ আওয়ার\n• গাইডলাইন, ওয়ার্নিং, স্ট্রাইক আর রিপোর্ট\n• লাইভে যাওয়া\n• RK Tube-এর মালিক আর ডেভেলপার কে\nউপরের টপিকে চাপ দিন, অথবা সমস্যাটা আরেকটু খুলে লিখে আবার জিজ্ঞেস করুন।"};

var HELP_KB_HI={
 greeting:"हाय, हेलो!",
 thanks:"आपका स्वागत है! कुछ और चाहिए — अपलोड, चैनल, व्यू या नियम — तो कभी भी यहीं पूछें।",
 owner:"RK Tube — मालिक और डेवलपर\n• मालिक: RK Rajkhan\n• डेवलपर: RK Rajkhan\n• घर: रूपगंज, ढाका, बांग्लादेश\nRK Tube को RK MEDIA के RK Rajkhan ने बनाया है। ऐप के बारे में कुछ और जानना हो — अपलोड, चैनल या गाइडलाइन — तो यहीं पूछें।",
 stuck:"अगर आपका वीडियो ऐप में दिखता है लेकिन चलता नहीं है — या दूसरे लोग उसे देख या चला नहीं पाते — तो लगभग तय है कि अपलोड पूरा नहीं हुआ।\n• वीडियो सबके लिए ऑनलाइन तभी सेव होता है जब अपलोड 100% हो जाए और Upload ready दिखे।\n• पूरे अपलोड के दौरान RK Tube खुला रखें। ऐप बंद हो जाए या इंटरनेट कट जाए तो फ़ाइल सिर्फ़ आपके फ़ोन में रह जाती है और कहीं और नहीं चलती।\n• बड़े वीडियो में समय लगता है — अच्छा Wi-Fi इस्तेमाल करें और फ़ोन चार्ज रखें।\n• MP4 फ़ॉर्मेट सबसे अच्छा चलता है।\nउपाय: ऐप खोलकर वीडियो फिर से अपलोड करें — इस बार अपलोड पूरी तरह ख़त्म होने तक ऐप खुला रखकर इंतज़ार करें।",
 notplaying:"वीडियो न चले तो:\n1. इंटरनेट कनेक्शन जांचकर फिर कोशिश करें।\n2. अगर यह आपका अपना वीडियो है, तो शायद उसका अपलोड पूरा नहीं हुआ — फिर से अपलोड करें और Upload ready दिखने तक ऐप खुला रखें।\n3. कुछ फ़ॉर्मेट हर फ़ोन पर नहीं चलते। MP4 सबसे अच्छा है — वीडियो को MP4 में बदलकर फिर अपलोड करें।\n4. ऐप पूरी तरह बंद करके फिर खोलें और कोशिश करें।",
 upload:"वीडियो अपलोड करने का तरीका:\n1. अपने Gmail से साइन-इन करें और अपना चैनल खोलें।\n2. + (Create) बटन दबाएं।\n3. Long video, Short video या Photo चुनें।\n4. वीडियो फ़ाइल चुनें, टाइटल लिखें, हैशटैग दें (जैसे #funny #music) और चुनें कि कौन देख सकता है — Public, Unlisted या Private।\n5. Upload ready दिखने तक ऐप खुला रखें — तभी वीडियो सबके लिए ऑनलाइन सेव होता है।\nशॉर्ट वर्टिकल (9:16) और 2 मिनट या उससे कम का होना चाहिए। लंबे वीडियो किसी भी लंबाई के हो सकते हैं।",
 shorts:"शॉर्ट्स के बारे में:\n• शॉर्ट एक वर्टिकल वीडियो (9:16) होता है, 2 मिनट या उससे कम।\n• अगर आपका अपलोड शॉर्ट के रूप में स्वीकार नहीं हुआ, तो दो चीज़ें जांचें: क्या यह वर्टिकल है, और क्या यह 2 मिनट से कम है?\n• हॉरिज़ॉन्टल (16:9) या लंबा वीडियो शॉर्ट नहीं बन सकता — उसे Long video के रूप में अपलोड करें।\n• 2 मिनट या उससे कम के वर्टिकल वीडियो Shorts टैब में अपने आप आ जाते हैं।",
 channel:"चैनल बनाने का तरीका:\n1. Sign in दबाकर अपने Gmail से साइन-इन करें।\n2. ऊपर कोने में अपनी प्रोफ़ाइल फ़ोटो दबाकर Create channel चुनें।\n3. चैनल का नाम दें, लोगो की फ़ोटो चुनें और About लिखें।\n4. Edit channel से बैनर और अधिकतम 3 लिंक (Facebook, YouTube आदि) जोड़ें।\nएक Gmail से एक से ज़्यादा चैनल रखे जा सकते हैं — प्रोफ़ाइल मेनू से बदल सकते हैं।",
 signin:"साइन-इन के बारे में:\n• RK Tube में Gmail से साइन-इन होता है। हमेशा वही Gmail इस्तेमाल करें — आपका चैनल और वीडियो उसी से जुड़े हैं।\n• आपका चैनल उस Gmail का है जिससे साइन-इन करके आपने उसे बनाया था।\n• ऐप का नया वर्शन पुराने के ऊपर ही इंस्टॉल करें — पहले अनइंस्टॉल न करें, सब कुछ सुरक्षित रहेगा।\n• अनइंस्टॉल हो जाने पर भी उसी Gmail से फिर साइन-इन करने पर आपका चैनल और पूरे हुए अपलोड वापस आ जाते हैं।\n• अकाउंट बदलने के लिए: ऊपर कोने में प्रोफ़ाइल फ़ोटो → Switch account।",
 subs:"सब्सक्राइबर, बेल और व्यू:\n• दर्शक आपके चैनल पर Subscribe दबाकर बेल दबाएं तो उन्हें आपके नए वीडियो की नोटिफिकेशन मिलती है।\n• व्यू तभी गिना जाता है जब वीडियो सच में चलता है।\n• अच्छे वीडियो अपलोड करते रहें और चैनल का लिंक दोस्तों के साथ शेयर करें — इसी तरह चैनल बढ़ता है।\n• अपने नंबर कभी भी RK Tube Studio → Dashboard और Analytics में देखें।",
 monetization:"RK Tube पर मोनेटाइजेशन:\n• आपके चैनल को 500 सब्सक्राइबर और 3,000 वॉच आवर चाहिए।\n• दोनों पूरे हो जाएं तो RK Tube Studio → Monetization में जाकर Apply for monetization दबाएं।\n• RK Tube टीम सब कुछ जांचकर देखती है। सब कुछ पूरा और सही होने पर टीम आपके चैनल पर मोनेटाइजेशन चालू कर देती है।\n• उसके बाद कमाई आपके व्यू से ऑटोमैटिक गिनी जाती है — RK Tube टीम प्रति 1,000 व्यू पर जो रेट तय करती है, उसी हिसाब से।\n• अपने चैनल में बैंक अकाउंट की जानकारी सेव रखें ताकि RK Tube टीम पैसे भेज सके। पेमेंट टीम की तय की गई न्यूनतम राशि से शुरू होता है।",
 guidelines:"RK Tube कम्युनिटी गाइडलाइन।\nसिर्फ़ अपने बनाए हुए वीडियो, या जिनके इस्तेमाल का अधिकार आपके पास है, वही अपलोड करें।\nजो मना है:\n• पूरी फ़िल्में, टीवी शो, गाने या किसी और का वीडियो अपना बताकर अपलोड करना (कॉपीराइट)।\n• हिंसक या ख़तरनाक सामग्री, या हथियारों या हानिकारक कामों के निर्देश।\n• किसी व्यक्ति या समूह के प्रति नफ़रत, धमकी या उत्पीड़न।\n• स्पैम, धोखाधड़ी, नकली इनाम, या ऐसे टाइटल व थंबनेल जो वीडियो में न हो उसका वादा करें।\n• यौन या नग्न सामग्री, और बच्चों को जोखिम में डालने वाली कोई भी चीज़ — बाल सुरक्षा का उल्लंघन तुरंत हटाया जाता है और सीधे स्ट्राइक मिलती है।\nनियम तोड़ने पर पहले वार्निंग, फिर स्ट्राइक मिलती है। विस्तार के लिए वार्निंग और स्ट्राइक के बारे में पूछें।",
 strike:"वार्निंग और स्ट्राइक:\n• पहली बार नियम तोड़ने पर = वार्निंग (स्ट्राइक नहीं)। यह चैनल पर 90 दिन रहती है, फिर अपने आप हट जाती है।\n• वार्निंग के बाद फिर नियम तोड़ा = स्ट्राइक। स्ट्राइक भी 90 दिन बाद ख़त्म हो जाती है।\n• एक साथ 3 सक्रिय स्ट्राइक = चैनल बंद, फिर अपलोड नहीं होगा।\n• अपने चैनल की स्थिति कभी भी RK Tube Studio → Guidelines में देखें।",
 report:"रिपोर्ट:\n• गाइडलाइन तोड़ने वाले वीडियो को कोई भी दर्शक रिपोर्ट कर सकता है — वीडियो के तीन-डॉट मेनू से Report चुनकर कारण चुनें।\n• RK Tube टीम हर रिपोर्ट की जांच करती है: समस्या न हो तो वीडियो रहता है, हो तो हटा दिया जाता है। हटाने के साथ उस चैनल को वार्निंग या स्ट्राइक भी मिल सकती है।\n• अगर आपका वीडियो हटाया गया और आपको लगता है कि ग़लती हुई है, तो RK Tube Studio के Guidelines पेज पर अपने चैनल के लिए लिखा कारण देखें।",
 live:"लाइव जाने के लिए:\n• आपके चैनल को 20 सब्सक्राइबर और वेरिफ़ाई किया हुआ मोबाइल नंबर चाहिए।\n• ऐप के Live सेटअप से नंबर वेरिफ़ाई करें — मोबाइल नंबर लिखकर सेव करें।\n• लाइव के लिए लाइव सर्वर का कनेक्शन भी चाहिए — अगर ऐप Agora App ID मांगे, तो समझें कि लाइव सर्वर अभी जुड़ा नहीं है; कनेक्शन पूरा होते ही लाइव चालू होगा।\nRK Tube टीम का अकाउंट हमेशा लाइव जा सकता है।",

/* A greeting is answered the way other help centers do it: two
   short messages — first the hello, then "how can I help you?" —
   in the language the visitor is writing in. The long topic list
   never goes out as a greeting; it only appears in the fallback
   when a question matches no topic at all. */
var HELP_ASK_LINE={en:"How can I help you?",bn:"আমি আপনাকে কিভাবে সহযোগিতা করতে পারি?",hi:"मैं आपकी कैसे मदद कर सकता हूँ?"};
/* The hello carries NO name at all — not a fixed name and not the
   name on the account (the ID) the visitor is messaging from. It is
   just the plain hello in their language, followed by the separate
   "how can I help you?" message. No name is ever added to it. */
function helpGreetingFor(L){
  var g=null; HELP_KB.forEach(function(k){ if(k.id==="greeting") g=k; });
  if(!g) return "Hi, hello!";
  return L==="bn"?g.bn:(L==="hi"?(g.hi||HELP_KB_HI.greeting||g.en):g.en);
}
var helpChat=[];
function helpLangFor(q){
  if(!q) return state.lang==="bn"?"bn":(state.lang==="hi"?"hi":"en");
  if(/[\u0980-\u09FF]/.test(q)) return "bn";
  if(/[\u0900-\u097F]/.test(q)) return "hi";
  var s=" "+String(q).toLowerCase()+" ";
  var strong=["kivabe","hocche","hoche","parchi","parbo","korte","amar","lagbe","keno"];
  var hits=0; strong.forEach(function(w){ if(s.indexOf(w)>=0) hits++; });
  if(hits>=2 || s.indexOf("kivabe")>=0 || s.indexOf("hocche")>=0) return "bn";
  return "en";
}
function helpFind(q){
  var raw=String(q||"").toLowerCase().replace(/[?!.,;:"'()।]/g," ");
  var padded=" "+raw.replace(/\s+/g," ")+" ";
  var shortQ=raw.trim().length<=22;
  var best=null,bs=0;
  HELP_KB.forEach(function(k){
    if(k.id==="greeting" && !shortQ) return;
    var sc=0;
    k.keys.concat(HELP_KEYS_HI[k.id]||[]).forEach(function(w){
      var wl=w.toLowerCase();
      var hit = wl.length<=3 ? padded.indexOf(" "+wl+" ")>=0 : raw.indexOf(wl)>=0;
      if(hit) sc+=wl.length;
    });
    if(sc>bs){ bs=sc; best=k; }
  });
  return bs>0?best:null;
}
function helpBubbleHTML(m){
  var txt=esc(m.text).replace(/\n/g,"<br>");
  if(m.me) return '<div class="help-row me"><div class="help-bubble">'+txt+'</div></div>';
  return '<div class="help-row bot"><span class="help-mini">'+IC.help+'</span><div class="help-bubble">'+txt+'</div></div>';
}
function helpRenderMsgs(){
  var box=document.getElementById("help-msgs"); if(!box) return;
  box.innerHTML=helpChat.map(helpBubbleHTML).join("");
  box.scrollTop=box.scrollHeight;
}
function helpAsk(text){
  text=String(text||"").trim(); if(!text) return;
  helpChat.push({me:true,text:text});
  helpRenderMsgs();
  var inp=document.getElementById("help-input"); if(inp) inp.value="";
  var box=document.getElementById("help-msgs"); if(!box) return;
  var tr=document.createElement("div"); tr.className="help-row bot"; tr.id="help-typing-row";
  tr.innerHTML='<span class="help-mini">'+IC.help+'</span><div class="help-bubble"><span class="help-typing"><i></i><i></i><i></i></span></div>';
  box.appendChild(tr); box.scrollTop=box.scrollHeight;
  var L=helpLangFor(text);
  var topic=helpFind(text);
  var ans=topic ? (L==="bn"?topic.bn:(L==="hi"?(topic.hi||HELP_KB_HI[topic.id]||topic.en):topic.en)) : (L==="hi"?HELP_FALLBACK_HI:HELP_FALLBACK[L]);
  if(topic && topic.id==="greeting") ans=helpGreetingFor(L);
  setTimeout(function(){
    var trow=document.getElementById("help-typing-row"); if(trow) trow.remove();
    if(!document.getElementById("help-msgs")) return;
    helpChat.push({me:false,text:ans});
    helpRenderMsgs();
    if(topic && topic.id==="greeting"){
      /* Right after the hello, ask how we can help — as its own
         message, the way YouTube's help chat opens. */
      setTimeout(function(){
        helpChat.push({me:false,text:HELP_ASK_LINE[L]||HELP_ASK_LINE.en});
        helpRenderMsgs();
      },700);
    }
  },650);
}

/* ---------- IndexedDB video bytes + visibility + default category ----------
   Uploaded videos used to live only as a blob: URL made for the
   session, so after a cold start the record stayed but playback
   died and the file had to be re-uploaded. Video bytes now go to
   IndexedDB (rktube_media_v1), which can hold Blobs — localStorage
   cannot. On boot, rehydrateUploads() swaps each uploaded video's
   dead blob: URL for a fresh one from IndexedDB. If IndexedDB is
   unavailable the old in-memory behaviour stays and the record
   still saves.
   Visibility (YouTube rules): Public = listed everywhere.
   Unlisted = NOT listed in feed/channel/search/Shorts, but plays
   when opened directly. Private = only the channel owner can
   see/play it. Records without a visibility field count as public.
   Category is NOT asked at upload time any more: the default
   upload category lives in Settings (rktube_default_cat_v1) and
   uploads use it automatically. */
var IDB_NAME="rktube_media_v1", IDB_STORE="videos";
var __idbP=null;
function idbOpen(){
  if(!__idbP){
    __idbP=new Promise(function(resolve){
      try{
        if(!window.indexedDB){ resolve(null); return; }
        var req=window.indexedDB.open(IDB_NAME,1);
        req.onupgradeneeded=function(){ try{ req.result.createObjectStore(IDB_STORE,{keyPath:"id"}); }catch(e){} };
        req.onsuccess=function(){ resolve(req.result); };
        req.onerror=function(){ resolve(null); };
        req.onblocked=function(){ resolve(null); };
      }catch(e){ resolve(null); }
    });
  }
  return __idbP;
}
function idbSaveVideo(id,blob){
  return idbOpen().then(function(db){
    if(!db) return false;
    return new Promise(function(resolve){
      try{
        var tx=db.transaction(IDB_STORE,"readwrite");
        tx.objectStore(IDB_STORE).put({id:id,blob:blob,type:blob.type||"",size:blob.size||0,at:Date.now()});
        tx.oncomplete=function(){ resolve(true); };
        tx.onerror=function(){ resolve(false); };
      }catch(e){ resolve(false); }
    });
  });
}
function idbGetVideo(id){
  return idbOpen().then(function(db){
    if(!db) return null;
    return new Promise(function(resolve){
      try{
        var rq=db.transaction(IDB_STORE,"readonly").objectStore(IDB_STORE).get(id);
        rq.onsuccess=function(){ resolve(rq.result&&rq.result.blob?rq.result.blob:null); };
        rq.onerror=function(){ resolve(null); };
      }catch(e){ resolve(null); }
    });
  });
}
function idbDeleteVideo(id){
  idbOpen().then(function(db){
    if(!db) return;
    try{ db.transaction(IDB_STORE,"readwrite").objectStore(IDB_STORE).delete(id); }catch(e){}
  });
}
function rehydrateUploads(){
  if(!window.indexedDB) return;
  videos.forEach(function(v){
    if(!v.userUploaded) return;
    idbGetVideo(v.id).then(function(blob){
      if(blob){ try{ v.src=URL.createObjectURL(blob); v._idb=true; }catch(e){} }
    });
  });
}
/* ---- Uploaded-video playback: never a broken player ----
   A record saved to storage carries its blob: URL as a string,
   which is dead after a restart — only IndexedDB still holds the
   bytes. _live is set at publish time and is NEVER saved (see
   saveUserData), and _idb is set only when this session swapped
   in a fresh IndexedDB URL, so after a restart neither flag is
   present and the stored blob: URL must be treated as dead.
   ensureVideoSrc() fetches the bytes first and only then lets
   the watch page render: with bytes the player gets a fresh
   IndexedDB blob URL; without bytes the record is marked _srcDead
   and the watch page shows a plain message instead of a player.
   A poster is only emitted when the thumbnail is a usable URL —
   a missing or broken poster value is left out entirely, so the
   player is a clean dark box with a play button, never a
   broken-image glyph. */
function ensureVideoSrc(v,cb,triedRefresh){
  if(!v){ cb(true); return; }
  if(v._idb || v._live){ cb(true); return; }
  if(!v.userUploaded && !v.b2File){ cb(true); return; }
  if(typeof v.src==="string" && v.src.indexOf("blob:")===0){ cb(true); return; }
  if(fbIsRemoteOnly(v)){ if(triedRefresh){ cb(false); return; } /* The local copy may be stale: the B2 file may have landed after the last pull. Re-fetch this one doc and retry once before showing the remote-only note. */ fbRefreshVideoDoc(v).then(function(){ if(v.b2File && !fbIsRemoteOnly(v)){ ensureVideoSrc(v,cb,true); return; } cb(false); }); return; }
  if(v._srcDead){ cb(false); return; }
  if(v.b2File && !v.userUploaded){ var __qfA=b2FileForQuality(v)||v.b2File; var __fnA=(__qfA&&typeof __qfA==="object")?__qfA.fileName:__qfA; b2DownloadUrl(__fnA).then(function(url){ if(url){ v.src=url; v._b2=true; try{ v._using720=(__qfA===v.b2File720); }catch(e){} cb(true); } else { v._srcDead=true; cb(false); } }); return; }
  idbGetVideo(v.id).then(function(blob){
    if(blob){ try{ v.src=URL.createObjectURL(blob); v._idb=true; }catch(e){} try{ if(v.userUploaded && v.b2File && !v.b2File720 && !v._smoothStarted){ v._smoothStarted=true; makeSmoothCopy(v, blob); } }catch(e){} cb(true); }
    else if(v.b2File){ var __qfB=b2FileForQuality(v)||v.b2File; var __fnB=(__qfB&&typeof __qfB==="object")?__qfB.fileName:__qfB; b2DownloadUrl(__fnB).then(function(url){ if(url){ v.src=url; v._b2=true; try{ v._using720=(__qfB===v.b2File720); }catch(e){} cb(true); } else { v._srcDead=true; cb(false); } }); }
    else { v._srcDead=true; cb(false); }
  });
}
/* A video has a usable poster only if the thumb is a real image.
   A data-URI thumb counts only if it is big enough to be a real
   poster (a 1x1 black JPEG is under 2 KB). */
function hasThumb(v){ var t=v&&v.thumb; if(typeof t!=="string"||!t) return false; if(t.indexOf("data:")==0) return t.length>2000; return /^(https?:|blob:)/.test(t); }
function thumbPlaceholderHTML(v){ return '<span class="thumb-ph-ic">&#9654;</span><span class="thumb-ph-title">'+esc((v&&v.title)||"")+'</span>'; }
function thumbInnerHTML(v){ if(hasThumb(v)) return '<img src="'+esc(v.thumb)+'" alt="'+esc(v.title||"")+'" loading="lazy">'; if(v&&v.userUploaded) ensurePoster(v); return thumbPlaceholderHTML(v); }
function posterAttr(v){
  if(!hasThumb(v)){ if(v&&v.userUploaded) ensurePoster(v); return ""; }
  return ' poster="'+esc(v.thumb)+'"';
}
/* A saved upload can have no usable poster (its capture failed, or it
   stored a black frame). Re-capture a real frame from the saved bytes:
   seek in, skip frames that are near-all-black, keep the first good
   one and save it, so the card shows a picture next time. While the
   capture runs, the card shows the titled placeholder, never a bare
   black box. */
var __posterBusy={};
function ensurePoster(v){
  if(!v||!v.userUploaded||__posterBusy[v.id]) return;
  /* A blob: thumb shows locally but is useless in Firestore (it only
     exists in this browser session), so it must be re-captured as a
     data URI and synced. Only a real data-URI/https thumb skips the
     capture. */
  var __blobThumb=!!(typeof v.thumb==="string"&&v.thumb.indexOf("blob:")===0);
  if(hasThumb(v)&&!__blobThumb) return;
  __posterBusy[v.id]=true;
  idbGetVideo(v.id).then(function(blob){
    if(!blob){ __posterBusy[v.id]=false; return; }
    var url=null;
    try{ url=URL.createObjectURL(blob); }catch(e){ __posterBusy[v.id]=false; return; }
    var vd=document.createElement("video");
    var done=false, tries=0;
    function finish(thumb){
      if(done) return; done=true;
      try{ if(url) URL.revokeObjectURL(url); }catch(e){}
      __posterBusy[v.id]=false;
      if(!thumb) return;
      v.thumb=thumb; saveUserData();
      /* Sync the captured thumb to the shared store right away: the
         backfill only syncs whatever thumb exists at boot time, so
         a thumb captured after boot would otherwise never reach
         other phones (which have no video bytes to capture their
         own poster from). Guarded: a failed sync must not break
         the local save/refresh. */
      try{ fbSyncVideo(v); }catch(e){}
      refreshPosterDOM(v);
    }
    function grab(){
      try{
        var w=vd.videoWidth||0, h=vd.videoHeight||0;
        if(!w||!h){ finish(null); return; }
        var c=document.createElement("canvas");
        if(w>=h){ c.width=320; c.height=Math.max(1,Math.round(320*h/w)); }
        else { c.height=320; c.width=Math.max(1,Math.round(320*w/h)); }
        var ctx=c.getContext("2d"); if(!ctx){ finish(null); return; }
        ctx.drawImage(vd,0,0,c.width,c.height);
        var d=ctx.getImageData(0,0,c.width,c.height).data, sum=0, n=0;
        for(var i=0;i<d.length;i+=1604){ sum+=d[i]+d[i+1]+d[i+2]; n++; }
        if(n>0 && (sum/n)<24){
          if(tries<2){ tries++; seekTo(0.5); return; }
          finish(null); return;
        }
        finish(c.toDataURL("image/jpeg",0.82));
      }catch(e){ finish(null); }
    }
    function seekTo(frac){
      try{
        var dur=vd.duration||0;
        if(!dur||!isFinite(dur)){ if(tries<2){ tries++; setTimeout(function(){ seekTo(frac); },400); } else finish(null); return; }
        var to=setTimeout(function(){ if(tries<2){ tries++; seekTo(frac===0.25?0.5:0.25); } else finish(null); },2500);
        vd.onseeked=function(){ clearTimeout(to); setTimeout(grab,120); };
        vd.currentTime=Math.max(0.2,Math.min(dur*frac,dur-0.05));
      }catch(e){ finish(null); }
    }
    var mto=setTimeout(function(){ finish(null); },8000);
    vd.onloadedmetadata=function(){ clearTimeout(mto); seekTo(0.25); };
    vd.onerror=function(){ clearTimeout(mto); finish(null); };
    vd.muted=true; vd.playsInline=true; vd.preload="auto";
    try{ vd.src=url; vd.load(); }catch(e){ finish(null); }
  });
}

/* ---------- Upload ---------- */
var upVideoFile=null, upThumbData=null, upVidId=null, upBlob=null, upDuration="", upDurationSec=0, upVw=0, upVh=0, upReady=false, upMode="long", upProbe=null;
/* Upload quota — enforced on the upload screen: one account can use
   up to 20 GB of uploads per day, and a single video can be up to
   8 GB, so one long, full-quality video (6–7 GB) always fits. The
   counter is per channel, counts every video published today, and
   resets at midnight — a daily limit, never a lifetime one.
   The ledger is SAVED in this phone/browser's localStorage (key
   below), following the same pattern as the team account: closing
   and reopening the app does NOT erase today's usage — it holds for
   the whole day — and only a new day zeroes it, because each entry
   carries its date and is ignored once the date no longer matches
   today. Yesterday's entries are also dropped on load, so nothing
   ever carries over past midnight. */
var UPLOAD_DAY_LIMIT=20*1024*1024*1024;
var UPLOAD_FILE_LIMIT=8*1024*1024*1024;
var UPLOAD_LEDGER_KEY="rktube_upload_ledger_v1";
function upTodayKey(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function loadUploadLedger(){
  var today=upTodayKey(), out={};
  try{
    var raw=window.localStorage.getItem(UPLOAD_LEDGER_KEY);
    if(raw){
      var saved=JSON.parse(raw);
      for(var id in saved){
        var e=saved[id];
        if(e && e.day===today && isFinite(e.bytes)) out[id]={day:today,bytes:Number(e.bytes)||0};
      }
    }
  }catch(err){}
  return out;
}
function saveUploadLedger(){
  try{ window.localStorage.setItem(UPLOAD_LEDGER_KEY,JSON.stringify(uploadLedger)); }catch(err){}
}
var uploadLedger=loadUploadLedger();
function uploadedTodayBytes(channelId){
  var e=uploadLedger[channelId];
  return (e && e.day===upTodayKey()) ? e.bytes : 0;
}
function recordUploadBytes(channelId,bytes){
  var day=upTodayKey(), e=uploadLedger[channelId];
  if(!e || e.day!==day) uploadLedger[channelId]={day:day,bytes:bytes};
  else e.bytes+=bytes;
  saveUploadLedger();
}
function fmtSize(b){
  if(b>=1024*1024*1024) return (Math.round(b/(1024*1024*1024)*100)/100)+" GB";
  if(b>=1024*1024) return Math.round(b/(1024*1024))+" MB";
  if(b>=1024) return Math.round(b/1024)+" KB";
  return b+" B";
}
function quotaBoxHTML(channelId){
  var used=uploadedTodayBytes(channelId), left=Math.max(0,UPLOAD_DAY_LIMIT-used);
  var pct=Math.min(100,Math.round(used/UPLOAD_DAY_LIMIT*1000)/10);
  return '<div class="quota-box"><div class="quota-head"><b>'+esc(t("upQuotaTitle"))+'</b><span>'+pct+'%</span></div>'
   + '<div class="quota-bar"><i style="width:'+pct+'%"></i></div>'
   + '<p>'+esc(t("upTodayLine").replace("{used}",fmtSize(used)).replace("{total}",fmtSize(UPLOAD_DAY_LIMIT)).replace("{left}",fmtSize(left)))+'</p>'
   + '<p>'+esc(t("upMaxLine").replace("{max}",fmtSize(UPLOAD_FILE_LIMIT)))+'</p></div>';
}
/* ---- Create chooser + upload engine (rebuilt 2026-11-06) ----
   The + (Create) button opens a chooser first — Live / Long video /
   Short video / Photo — never straight to the form. When a video file
   is picked, the bytes are read in slices with real progress and saved
   to IndexedDB right away, while the title is still being typed.
   Publish only finalizes. A probe timeout guards against a
   phone-recorded file the WebView cannot decode (the old stall:
   Publish sat on "Publishing…" forever, zero progress). */
var upPhotoData=null;
var upProbeToken=0;
function upSetProgress(pct,txt){
  var bar=document.getElementById("up-prog-fill"); if(bar) bar.style.width=Math.max(0,Math.min(100,pct))+"%";
  var st=document.getElementById("up-status"); if(st) st.textContent=txt;
  var go=document.getElementById("up-go"); if(go) go.disabled=!(pct>=100);
}
function upProbeDuration(file,cb){
  var myId=upVidId, myTok=++upProbeToken;
  var done=false;
  function fin(sec,dur,vw,vh){
    if(done) return; done=true;
    if(myId!==upVidId || myTok!==upProbeToken) return;
    cb(sec,dur,vw||0,vh||0);
  }
  try{
    var src=URL.createObjectURL(file);
    var probe=document.createElement("video");
    upProbe=probe;
    probe.preload="metadata"; probe.muted=true; probe.src=src;
    var to=setTimeout(function(){ fin(0,""); },8000);
    probe.onloadedmetadata=function(){ clearTimeout(to); var d=Math.round(probe.duration||0); fin(d, isFinite(d)&&d>0? Math.floor(d/60)+":"+String(d%60).padStart(2,"0") : "", probe.videoWidth||0, probe.videoHeight||0); };
    probe.onerror=function(){ clearTimeout(to); fin(0,""); };
  }catch(e){ fin(0,""); }
}
function upReadAndStore(file){
  var total=file.size||0, myId=upVidId;
  if(total>256*1024*1024){
    upSetProgress(5,t("upUploading")+" — "+fmtSize(total));
    return idbSaveVideo(myId,file).then(function(ok){ if(myId!==upVidId) return false; upBlob=file; return ok; });
  }
  var CH=2*1024*1024, parts=[], off=0;
  return new Promise(function(resolve){
    function next(){
      if(myId!==upVidId){ resolve(false); return; }
      if(off>=total){
        var blob=new Blob(parts,{type:file.type||"video/mp4"});
        upSetProgress(92,t("upUploading")+" — 92%");
        idbSaveVideo(myId,blob).then(function(ok){ if(myId!==upVidId){ resolve(false); return; } upBlob=blob; upSetProgress(100,t("upReady")); resolve(ok); });
        return;
      }
      var slice=file.slice(off,off+CH);
      var r=new FileReader();
      r.onload=function(){ parts.push(r.result); off+=slice.size; upSetProgress(Math.round(off/total*90),t("upUploading")+" — "+Math.round(off/total*90)+"%"); next(); };
      r.onerror=function(){ resolve(false); };
      r.readAsArrayBuffer(slice);
    }
    next();
  });
}
function startUploadNow(file){
  upVideoFile=file; upReady=false; upBlob=null; upDuration=""; upDurationSec=0; upVw=0; upVh=0;
  upVidId="u"+Date.now()+Math.floor(Math.random()*1000);
  var go=document.getElementById("up-go"); if(go) go.disabled=true;
  upSetProgress(2,t("upUploading")+" — 2%");
  var line=document.getElementById("up-chosen");
  if(line) line.textContent="🎬 "+file.name+" · "+fmtSize(file.size);
  upProbeDuration(file,function(sec,dur,vw,vh){
    upDurationSec=sec; upDuration=dur; upVw=vw||0; upVh=vh||0;
    upCheckShort();
  });
  upReadAndStore(file).then(function(ok){
    if(upVidId!==upVidId) return;
    if(!ok){
      /* IndexedDB unavailable: fall back to the in-session blob URL.
         The record still saves; playback after a restart will need
         the file again (the old caveat). */
      upBlob=file;
    }
    upReady=true;
    upSetProgress(100,t("upReady"));
  });
}
function upCheckShort(){
  var warn=document.getElementById("up-short-warn");

  if(upMode!=="short"){ if(warn) warn.hidden=true; return; }
  if(upVw>0&&upVh>0&&upVw>upVh){
    if(warn){ warn.hidden=false; warn.querySelector("span").textContent=t("upNotVertical"); }
    if(go) go.disabled=true; return;

    if(warn){ warn.hidden=false; warn.querySelector("span").textContent=t("upTooLongShort").replace("{dur}",upDuration); }

    if(warn) warn.hidden=true;
    if(go) go.disabled=!upReady;
  }
}

/* Poster capture, robust: wait for metadata, seek to ~25% of the
   video, then draw only after the frame is actually there. A drawn
   frame that is (near-)all black is retried once at 50% — a black
   frame usually means the seek landed before a decodable frame.
   Canvas keeps the video's own aspect (portrait for Shorts), capped
   at 640 px on the long side. Returns null only if no real frame
   could be grabbed; the caller then leaves thumb empty and the card
   renders a styled placeholder instead of a black box. */
function captureThumb(video,cb){
  var done=false, tries=0;
  function once(url){ if(done) return; done=true; cb(url); }
  function grab(){
    try{
      var vw=video.videoWidth||0, vh=video.videoHeight||0;
      var c=document.createElement("canvas");
      if(vw>=vh){ c.width=640; c.height=Math.max(1,Math.round(640*vh/Math.max(1,vw))); }
      else { c.height=640; c.width=Math.max(1,Math.round(640*vw/Math.max(1,vh))); }
      var ctx=c.getContext("2d"); if(!ctx){ once(null); return; }
      ctx.drawImage(video,0,0,c.width,c.height);
      var blank=false;
      try{
        var d=ctx.getImageData(0,0,c.width,c.height).data, sum=0, n=0;
        for(var i=0;i<d.length;i+=1604){ sum+=d[i]+d[i+1]+d[i+2]; n++; }
        blank=n>0 && (sum/n)<24;
      }catch(e){ blank=false; }
      if(blank && tries<2){ tries++; seekTo(0.5); return; }
      if(blank){ once(null); return; }
      once(c.toDataURL("image/jpeg",0.82));
    }catch(e){ once(null); }
  }
  function seekTo(frac){
    try{
      var d=video.duration||0;
      if(!d || !isFinite(d)){ if(tries<2){ tries++; setTimeout(function(){ seekTo(frac); },400); } else once(null); return; }
      var target=Math.max(0.2,Math.min(d*frac,d-0.05));
      var to=setTimeout(function(){ if(tries<2){ tries++; seekTo(frac===0.25?0.5:0.25); } else once(null); },2000);
      video.onseeked=function(){ clearTimeout(to); setTimeout(grab,120); };
      video.currentTime=target;
    }catch(e){ once(null); }
  }
  try{
    if(video.readyState>=1 && video.duration) seekTo(0.25);
    else{
      var mto=setTimeout(function(){ once(null); },4000);
      video.onloadedmetadata=function(){ clearTimeout(mto); seekTo(0.25); };
      if(video.readyState>=1) seekTo(0.25);
    }
  }catch(e){ once(null); }
}

/* ---------- FIX 5: video quality (720p smooth copy) ----------
   On upload, a 720p copy of the video is rendered in the browser
   (canvas + MediaRecorder) and uploaded to B2 as a SECOND file; the
   original file is never touched. The player offers Auto / 720p /
   Original; Auto picks 720p when the network is slow (navigator
   downlink / save-data). Older videos without a 720p copy offer
   Original only. The transcode runs in the background and is
   best-effort: any failure leaves the original exactly as it was. */
var RK_TUBE_QUALITY_KEY="rktube_quality_v1";
function videoQualityPref(){ try{ var p=window.localStorage.getItem(RK_TUBE_QUALITY_KEY); if(p==="720p"||p==="original"||p==="auto") return p; }catch(e){} return "auto"; }
function setVideoQualityPref(p){ try{ window.localStorage.setItem(RK_TUBE_QUALITY_KEY,(p==="720p"||p==="original")?p:"auto"); }catch(e){} }
function qualityIsSlow(){ try{ var c=(navigator&&navigator.connection)?navigator.connection:null; if(c){ if(c.saveData) return true; if(typeof c.downlink==="number" && c.downlink>0 && c.downlink<2.5) return true; if(typeof c.effectiveType==="string" && (c.effectiveType==="slow-2g"||c.effectiveType==="2g")) return true; } }catch(e){} return false; }
function qualityUse720(v){ try{ if(!v||!v.b2File720) return false; var p=videoQualityPref(); if(p==="720p") return true; if(p==="original") return false; return qualityIsSlow(); }catch(e){} return false; }
function qualityBtnLabel(v){
  if(!v||!v.b2File) return t("qAuto");
  var p=videoQualityPref();
  if(p==="720p") return v.b2File720?t("q720"):t("qOrig");
  if(p==="original") return t("qOrig");
  return (v.b2File720 && qualityUse720(v))?t("q720"):t("qAuto");
}
function b2FileForQuality(v){ try{ if(v && v.b2File720 && qualityUse720(v)) return v.b2File720; }catch(e){} return v?v.b2File:null; }
function makeSmoothCopy(vid, srcBlob){
  try{
    if(!vid || vid.b2File720 || vid._smoothStarted || vid.ytId) return;
    vid._smoothStarted=true;
    var proceed=function(blob){
      if(!blob) return;
      var url=null;
      try{ url=URL.createObjectURL(blob); }catch(e){ return; }
      var el=document.createElement("video");
      el.muted=true; el.playsInline=true; el.preload="auto"; el.src=url;
      el.onloadedmetadata=function(){
        try{
          var W=el.videoWidth||0, H=el.videoHeight||0;
          if(!W||!H){ URL.revokeObjectURL(url); return; }
          var scale=Math.min(1, 1280/Math.max(W,H));
          var cw=Math.max(2,Math.round(W*scale/2)*2), ch=Math.max(2,Math.round(H*scale/2)*2);
          var cv=document.createElement("canvas"); cv.width=cw; cv.height=ch;
          var ctx=cv.getContext("2d");
          var stream=null;
          try{ stream=cv.captureStream(30); }catch(e){ stream=null; }
          if(!stream || !window.MediaRecorder){ URL.revokeObjectURL(url); return; }
          var rec=null;
          try{ rec=new MediaRecorder(stream,{mimeType:"video/webm"}); }catch(e){ rec=null; }
          if(!rec){ URL.revokeObjectURL(url); return; }
          var chunks=[];
          rec.ondataavailable=function(ev){ if(ev.data&&ev.data.size) chunks.push(ev.data); };
          rec.onstop=function(){
            try{
              var out=new Blob(chunks,{type:"video/webm"});
              if(!out||!out.size){ URL.revokeObjectURL(url); return; }
              /* Direct b2UploadFile (NOT b2UploadVideoWithStatus: that
                 helper nulls vid.b2File on failure, and the 720p copy
                 must never touch the original). Silent, background. */
              b2UploadFile(out,"rk-"+vid.id+"-720p.webm").then(function(res){
                try{
                  if(res&&res.ok){
                    vid.b2File720={bucket:B2_CONFIG.bucketName,fileName:res.fileName};
                    vid.b2Size720=res.size;
                    try{ saveUserData(); }catch(e){}
                    try{ fbSyncVideo(vid); }catch(e){}
                  }
                }catch(e){}
                try{ URL.revokeObjectURL(url); }catch(e2){}
              }).catch(function(){ try{ URL.revokeObjectURL(url); }catch(e){} });
            }catch(e){ try{ URL.revokeObjectURL(url); }catch(e2){} }
          };
          el.onended=function(){ try{ if(rec.state!=="inactive") rec.stop(); }catch(e){} };
          try{ rec.start(500); }catch(e){ URL.revokeObjectURL(url); return; }
          var draw=function(){ try{ if(!el.ended){ ctx.drawImage(el,0,0,cw,ch); requestAnimationFrame(draw); } }catch(e){} };
          draw();
          el.play().catch(function(){ try{ if(rec.state!=="inactive") rec.stop(); }catch(e){} });
        }catch(e){ try{ URL.revokeObjectURL(url); }catch(e2){} }
      };
      el.onerror=function(){ try{ URL.revokeObjectURL(url); }catch(e){} };
    };
    if(srcBlob){ proceed(srcBlob); return; }
    try{
      idbGetVideo(vid.id, function(blob){
        if(blob){ proceed(blob); return; }
        if(vid.b2File){
          var __fn=(vid.b2File&&typeof vid.b2File==="object")?vid.b2File.fileName:vid.b2File;
          b2DownloadUrl(__fn).then(function(u){
            if(!u) return;
            var xhr=new XMLHttpRequest(); xhr.open("GET",u,true); xhr.responseType="blob";
            xhr.onload=function(){ try{ if(xhr.status>=200&&xhr.status<300&&xhr.response) proceed(xhr.response); }catch(e){} };
            xhr.onerror=function(){};
            try{ xhr.send(); }catch(e){}
          }).catch(function(){});
        }
      });
    }catch(e){}
  }catch(e){}
}
function finishUpload(vid){
  try{ if(vid){ applyKnownAspect(vid); vid.isShort=!!isShortVideo(vid); } }catch(e){}
  if(myChannel && upVideoFile) recordUploadBytes(myChannel.id, upVideoFile.size);
  videos.push(vid);
  try{ fbSyncVideo(vid); }catch(e){}
  var uploadOK=saveUserData(); /* keep the uploaded video's record for the next cold start */
  overlay.innerHTML="";
  openWatch(vid.id);
  if(!upVideoFile){ toast(uploadOK ? t("publish")+" ✓" : t("saveFailed")); return; }
  if(!b2Enabled()){ toast((uploadOK ? t("publish")+" ✓" : t("saveFailed"))+" — "+t("b2NeedSetup")); return; }
  /* The shared-store (B2) upload runs automatically now — it is NOT
     gated on the local save, and any failure is shown on the video
     itself with a Retry action (see b2UploadVideoWithStatus). */
  b2UploadVideoWithStatus(vid, upVideoFile);
  try{ makeSmoothCopy(vid, upVideoFile); }catch(e){}
  toast(uploadOK ? t("publish")+" ✓" : t("saveFailed"));
}
/* Shared-store upload with a visible result. The primary path is the
   presigned PUT (b2UploadVideo); this wrapper only adds the failure
   handling the old code lacked: a visible message + a Retry action
   on the video card, and the video is marked local-only until the
   upload actually succeeds. */
function b2UploadVideoWithStatus(vid,file){
  if(!vid||!file) return Promise.resolve({ok:false,reason:"no-file"});
  try{ vid._b2UploadState="uploading"; vid._b2Failed=null; }catch(e){}
  /* Automatic retries: one transient failure (a dropped connection,
     a slow uplink, the app briefly backgrounded) must not strand the
     video on this phone forever — other phones can only play a video
     whose file actually reached the shared store. Three attempts
     with a growing pause; the state stays "uploading" between
     attempts so the card keeps showing the uploading note, not a
     failure. Permanent failures (too big, store full, not set up)
     are not retried — they would fail identically every time. */
  var delays=[0,6000,20000];
  function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
  function attempt(i){
    var p=null;
    try{ p=b2UploadVideo(vid,file); }catch(e){ p=Promise.reject(e); }
    return Promise.resolve(p).then(function(res){
      if(res&&res.ok) return res;
      var rsn=(res&&res.reason)||"failed";
      if(rsn==="too-big"||rsn==="storage-full"||rsn==="not-configured"||rsn==="no-file") return res||{ok:false,reason:rsn};
      if(i<delays.length-1) return wait(delays[i+1]).then(function(){ return attempt(i+1); });
      return res||{ok:false,reason:"failed"};
    },function(err){
      if(i<delays.length-1) return wait(delays[i+1]).then(function(){ return attempt(i+1); });
      throw err;
    });
  }
  return attempt(0).then(function(res){
    try{ vid._b2UploadState=null; }catch(e){}
    if(res&&res.ok){ try{ saveUserData(); renderMain(); }catch(e){} toast(t("b2Uploaded")); return res; }
    var reason=(res&&res.reason)||"failed";
    try{ vid.b2File=null; vid.localOnly=true; vid._b2Failed=reason; saveUserData(); fbSyncVideo(vid); renderMain(); }catch(e){}
    toast(t("b2UploadFailed")+" ("+reason+")");
    return res||{ok:false,reason:"failed"};
  }).catch(function(err){
    var reason=(err&&err.reason)||"failed";
    try{ vid._b2UploadState=null; vid.b2File=null; vid.localOnly=true; vid._b2Failed=reason; saveUserData(); fbSyncVideo(vid); renderMain(); }catch(e){}
    toast(t("b2UploadFailed")+" ("+reason+")");
    return {ok:false,reason:"failed"};
  });
}
/* Retry the shared-store upload for one video (fallback only — the
   automatic upload is the main path). Re-runs the presigned PUT and
   then re-syncs the video doc so other phones see the b2File. The
   file bytes come from the just-uploaded File still in memory, or
   from this phone's IndexedDB copy. */
function fbRetryB2Upload(v){
  if(!v||v.b2File||v._b2UploadState==="uploading") return Promise.resolve({ok:false,reason:"no-file"});
  if(!b2Enabled()){ toast(t("b2NeedSetup")); return Promise.resolve({ok:false,reason:"not-configured"}); }
  var getFile=function(){
    if(upVideoFile && v.id===upVidId) return Promise.resolve(upVideoFile);
    return idbGetVideo(v.id).then(function(blob){ return blob||upVideoFile||null; });
  };
  return getFile().then(function(file){
    if(!file){ toast(t("b2NoFile")); return {ok:false,reason:"no-file"}; }
    return b2UploadVideoWithStatus(v,file);
  }).catch(function(){ toast(t("b2NoFile")); return {ok:false,reason:"no-file"}; });
}

/* ============================================================
   Auto-import from YouTube — AGREED channels only.
   The owner lists source channels that agreed to share their
   videos (starting with his own). Once a day, when the app opens
   on a new day, RK Tube reads each channel's official public
   YouTube feed (feeds/videos.xml?channel_id=UC…) and posts the
   newest videos it has not imported before, up to the daily
   numbers the owner set: a total per day and a per-channel per
   day, with optional rotation (one channel's turn each day).
   Imported videos play inside RK Tube on YouTube's own player
   (embed) — nothing is copied or re-uploaded.
   The source list, settings, imported-video records and the
   import log are SAVED in this phone/browser's localStorage
   (same deliberate pattern as the team account, the upload
   ledger and the payout book), so the daily check never imports
   the same video twice and imported videos stay in the feed
   across restarts on this device. A cross-device, always-on
   daily run needs the planned server (Firebase) step; until
   then the check runs when the app is opened, and the panel
   says honestly when a feed could not be read — YouTube does
   not let web pages read feeds directly, so after a direct try
   a free public relay is tried before the check is logged as
   unreadable. If the owner saves a free YouTube Data API v3 key
   of his own (settings.ytApiKey, kept in this same localStorage
   store and never shown in full again after saving), the check
   uses the Data API instead of the feed: each channel's uploads

/* Bulk backfill fetch: the comedy channel's uploads, page by page,
   until 20 matching LONG videos are in hand (or no more pages).
   The no-key path uses the public feed via aiFetchEntries (one page
   only -- the feed has no pages). Returns the entries, or null when
   a page fails before 20 matches are in hand: the flag stays unset
   and the next boot retries instead of burning the one-time chance
   on a partial import. */
function aiBulkFetchComedy(src){
  if(!aiApiKey()){
    return aiWithTimeout(aiFetchEntries(src),AI_FETCH_TIMEOUT_MS).then(function(entries){
      if(!entries) return null;
      return aiWithTimeout(aiAttachDurations(entries),AI_FETCH_TIMEOUT_MS).catch(function(){ return entries; }).then(function(){ return entries; });
    });
  }
  var all=[];
  function page(token,pagesLeft){
    if(pagesLeft<=0) return Promise.resolve(all);
    return aiFetchApiPage(src,token).then(function(pg){
      return aiWithTimeout(aiAttachDurations(pg.entries),AI_FETCH_TIMEOUT_MS).catch(function(){ return pg.entries; }).then(function(){
        all=all.concat(pg.entries);
        if(aiBulkMatchCount(all)>=AI_BULK_COMEDY_MAX || !pg.nextPageToken) return all;
        return page(pg.nextPageToken,pagesLeft-1);
      });
    }).catch(function(){
      if(aiBulkMatchCount(all)>=AI_BULK_COMEDY_MAX) return all;
      throw new Error("bulk page failed");
    });
  }
  return page("",4).catch(function(){ return null; });
}
/* Remove one YouTube-imported video completely: the video itself
   (Firestore delete + IndexedDB delete, via ownerRemoveVideo) and
   its record in aiStore.imported, so aiRehydrate never brings it
   back. No-op when it is already gone. */
function aiRemoveVideoByYtId(ytId){
  var v=null;
  try{ v=(videos||[]).filter(function(x){ return x && x.ytId===ytId; })[0]||null; }catch(e){}
  if(v){ try{ ownerRemoveVideo(v.id); }catch(e){} }
  var had=false;
  try{
    var before=(aiStore.imported||[]).length;
    aiStore.imported=(aiStore.imported||[]).filter(function(x){ return x.ytId!==ytId; });
    had=((aiStore.imported||[]).length!==before);
  }catch(e){}
  if(!v && !had) return false;
  try{ aiSave(); }catch(e){}
  return true;
}
function aiBulkImportComedyLong(){
  /* Rafi's story must NEVER come back (Raj 19:31 CST): blocklist
     both its YouTube id and its app video id, and remove it (video
     + imported record + Firestore doc) on every boot until it is
     gone. Runs before the one-time flag check, so it also runs after
     the bulk import itself is done. */
  try{ fbDeletedIdsAdd(AI_BULK_RAFI_YTID); }catch(e){}
  try{ fbDeletedIdsAdd("yt"+AI_BULK_RAFI_YTID); }catch(e){}
  try{ aiRemoveVideoByYtId(AI_BULK_RAFI_YTID); }catch(e){}
  try{ if(window.localStorage.getItem(AI_BULK_COMEDY_KEY)==="1") return; }catch(e){ return; }
  if(!aiYtOn()) return; /* YouTube link off -- no import, ever */
  if(aiRunning){ /* daily check in flight -- wait for it, then run */
    if(aiBulkComedyTries<12){ aiBulkComedyTries++; setTimeout(aiBulkImportComedyLong,5000); }
    return;
  }
  var src=null;

  if(!src) return; /* comedy source not linked -- nothing to do */
  aiBulkFetchComedy(src).then(function(all){
    if(!all) return; /* fetch failed -- flag NOT set, next boot retries */
    var haveDur=all.some(function(en){ return (en && (en.durationSec||0))>0; });
    var added=0;
    for(var i=0;i<all.length && added<AI_BULK_COMEDY_MAX;i++){

      if(en.ytId===AI_BULK_RAFI_YTID) continue; /* Rafi's story -- never */
      try{ if(fbIsDeletedId(en.ytId)) continue; }catch(e){} /* blocklisted -- never */
      if(aiStore.imported.some(function(x){ return x.ytId===en.ytId; })) continue;
      if(haveDur){ if((en.durationSec||0)<=120) continue; } /* LONG only */
      else if(shortFormTagHit(en.title)) continue;
      if(((en.title||"").toLowerCase().indexOf("flags battle")>=0)) continue; /* live videos -- never */
      aiImportVideo(src,en);

/* One-time bulk import (Raj, 21:03 CST): ALL long videos from ALL
   THREE linked channels, FEWER Shorts (at most 3 newest per
   channel), and NO live videos. Pages through each channel's
   uploads (Data API when a key is saved; without a key, the free
   feed's latest page — that is all the feed offers), imports every
   long video not already here, and sets its flag only when every
   channel was read — a failed read retries on the next boot
   instead of burning the one-time chance. */
var AI_BULK_ALL_KEY="rktube_bulk_all_long_v1";
var AI_BULK_ALL_SHORTS_PER_CHAN=3;
var aiBulkAllTries=0;
function aiBulkFetchAll(src){
  if(!aiApiKey()){
    return aiWithTimeout(aiFetchEntries(src),AI_FETCH_TIMEOUT_MS).then(function(entries){
      if(!entries) return null;
      return aiWithTimeout(aiAttachDurations(entries),AI_FETCH_TIMEOUT_MS).catch(function(){ return entries; }).then(function(){ return entries; });
    }).catch(function(){ return null; });
  }
  var all=[];
  function page(token,pagesLeft){
    if(pagesLeft<=0) return Promise.resolve(all);
    return aiFetchApiPage(src,token).then(function(pg){
      return aiWithTimeout(aiAttachDurations(pg.entries),AI_FETCH_TIMEOUT_MS).catch(function(){ return pg.entries; }).then(function(){
        all=all.concat(pg.entries);
        if(!pg.nextPageToken) return all;
        return page(pg.nextPageToken,pagesLeft-1);
      });
    });
  }
  return page("",6).catch(function(){ return null; });
}
function aiBulkImportAllLong(){
  try{ if(window.localStorage.getItem(AI_BULK_ALL_KEY)==="1") return; }catch(e){ return; }
  if(!aiYtOn()) return; /* YouTube link off — no import, ever */
  if(aiRunning){ if(aiBulkAllTries<12){ aiBulkAllTries++; setTimeout(aiBulkImportAllLong,5000); } return; }
  var srcs=(aiStore.sources||[]).slice();
  if(!srcs.length) return;
  var chain=Promise.resolve(), allOk=true, totalAdded=0;
  srcs.forEach(function(src){
    chain=chain.then(function(){
      return aiBulkFetchAll(src).then(function(all){
        if(!all){ allOk=false; return; }
        var haveDur=all.some(function(en){ return en && (en.durationSec||0)>0; });
        var shortsHere=0;
        for(var i=0;i<all.length;i++){
          var en=all[i]; if(!en || !en.ytId) continue;
          if(en.ytId===AI_BULK_RAFI_YTID) continue; /* Rafi's story — never */
          try{ if(fbIsDeletedId(en.ytId)) continue; }catch(e){}
          if(aiStore.imported.some(function(x){ return x.ytId===en.ytId; })) continue;
          if(aiIsLiveEntry(en)) continue; /* live — never */
          if(((en.title||"").toLowerCase().indexOf("flags battle")>=0)) continue; /* known live series — never */
          var isShort = aiIsShortEntry(en);
          if(isShort){ if(shortsHere>=AI_BULK_ALL_SHORTS_PER_CHAN) continue; if(aiImportVideo(src,en)){ shortsHere++; totalAdded++; } }
          else if(aiImportVideo(src,en)) totalAdded++;
        }
      });
    });
  });
  chain.then(function(){
    if(allOk){ try{ window.localStorage.setItem(AI_BULK_ALL_KEY,"1"); }catch(e){} }
    aiLog("All-channels bulk import — "+totalAdded+" videos imported (all long, few Shorts, no live)"+(allOk?"":" · a channel could not be read — will retry"));
    if(totalAdded>0){ try{ renderApp(); }catch(e){} }
  });
}
/* One-time Shorts cleanup (Raj, 21:19-21:21 CST): too many Shorts
   had already been imported before the caps existed, flooding the
   app. Keep only the NEWEST 3 imported Shorts per linked channel
   (the same "fewer Shorts" number as the bulk import), remove the
   rest completely (video + shared-store doc + imported record, via
   aiRemoveVideoByYtId) and blocklist their YouTube ids on this
   device so the daily check and rehydrate never bring them back.
   Only auto-imported YouTube Shorts are touched — user uploads and
   long videos are never pruned. Runs once per device (flag), after
   the boot pull + bulk imports; the daily rule (at most 1 new Short
   per channel per day) governs everything imported afterwards. */
var AI_PRUNE_SHORTS_KEY="rktube_shorts_prune_v1";
var AI_PRUNE_SHORTS_KEEP=3;
function aiPruneExcessShorts(){
  try{ if(window.localStorage.getItem(AI_PRUNE_SHORTS_KEY)==="1") return; }catch(e){ return; }
  if(!aiStore || !aiStore.imported || !aiStore.imported.length){ try{ window.localStorage.setItem(AI_PRUNE_SHORTS_KEY,"1"); }catch(e){} return; }
  var bySrc={};
  aiStore.imported.forEach(function(rec){
    if(!rec || !rec.ytId) return;
    var isS = rec.isShort===true || ((rec.durationSec||0)>0 && (rec.durationSec||0)<=60) || shortFormTagHit(rec.title);
    if(!isS) return;
    (bySrc[rec.srcId]=bySrc[rec.srcId]||[]).push(rec);
  });
  var removed=0;
  Object.keys(bySrc).forEach(function(srcId){
    var list=bySrc[srcId].slice().sort(function(a,b){ return (b.published||0)-(a.published||0); }); /* newest first */
    list.slice(AI_PRUNE_SHORTS_KEEP).forEach(function(rec){
      try{ fbDeletedIdsAdd(rec.ytId); }catch(e){}
      try{ fbDeletedIdsAdd("yt"+rec.ytId); }catch(e){}
      try{ if(aiRemoveVideoByYtId(rec.ytId)) removed++; }catch(e){}
    });
  });
  try{ window.localStorage.setItem(AI_PRUNE_SHORTS_KEY,"1"); }catch(e){}
  if(removed>0){
    aiLog("Shorts cleanup — "+removed+" excess imported Short(s) removed (newest "+AI_PRUNE_SHORTS_KEEP+" per channel kept, rest blocklisted)");
    try{ renderApp(); }catch(e){}
  }
}
