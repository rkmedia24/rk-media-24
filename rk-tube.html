<style>
:root{
  color-scheme: light;
  --bg:#ffffff; --bg-soft:#f9f9f9; --bg-hover:#f2f2f2; --bg-chip:#f2f2f2;
  --ink:#0f0f0f; --ink-2:#606060; --ink-3:#909090;
  --line:#e5e5e5; --card:#ffffff;
  --red:#e62117; --red-dark:#c81e12; --red-soft:#fdecea;
  --blue:#065fd4; --green:#0f7b3d; --gold:#b8860b;
  --shadow:0 4px 24px rgba(0,0,0,.14);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#0f0f0f; --bg-soft:#181818; --bg-hover:#272727; --bg-chip:#272727;
    --ink:#f1f1f1; --ink-2:#aaaaaa; --ink-3:#717171;
    --line:#303030; --card:#1f1f1f;
    --red-soft:#3a1512;
  }
}
*{box-sizing:border-box}
/* The page is locked to the screen width: no pinch-zoom, no sideways
   panning. Wide rows (chips, tabs, Shorts shelf, history) scroll
   inside themselves instead. */
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%;width:100%}
/* Never let Android font-boosting widen the page on a customer phone:
   text scales up, min-content widths grow, and the whole page ends up
   wider than the screen with content cut off at the right edge. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
img,video,iframe{max-width:100%}
body{
  min-height:100vh;min-height:100dvh;
  font-family:Roboto,"Segoe UI",Arial,"Noto Sans Bengali",sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:var(--blue);text-decoration:none}
[hidden]{display:none !important}

/* ---------- Logo ---------- */
.logo{display:inline-flex;align-items:center;gap:9px;user-select:none}
.logo svg{display:block;flex:none}
.logo .wordmark{font-size:21px;font-weight:700;letter-spacing:-.5px;color:var(--ink);white-space:nowrap}
.logo .wordmark b{color:var(--red);font-weight:700}
.logo .wordmark .pro{font-size:9px;font-weight:600;letter-spacing:.12em;color:var(--ink-2);vertical-align:super;margin-inline-start:3px}

/* ---------- Top bar ---------- */
header.topbar{
  position:sticky;top:0;z-index:60;background:var(--bg);
  display:flex;align-items:center;gap:14px;
  padding:0 16px;height:58px;border-bottom:1px solid transparent;
}
.icon-btn{
  width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;flex:none;
}
.icon-btn:hover{background:var(--bg-hover)}
.icon-btn svg{width:22px;height:22px}
.search-wrap{flex:1;display:flex;justify-content:center;min-width:0}
.search-bar{display:flex;align-items:center;width:100%;max-width:560px}
.search-bar input{
  flex:1;min-width:0;height:40px;padding:0 16px;font-size:15px;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-inline-end:0;
  border-radius:20px 0 0 20px;outline:none;
}
.search-bar input:focus{border-color:var(--blue)}
[dir="rtl"] .search-bar input{border-radius:0 20px 20px 0;border-inline-end:1px solid var(--line);border-inline-start:0}
.search-bar button{
  width:62px;height:40px;border:1px solid var(--line);background:var(--bg-soft);
  border-radius:0 20px 20px 0;display:flex;align-items:center;justify-content:center;color:var(--ink);
}
[dir="rtl"] .search-bar button{border-radius:20px 0 0 20px}
.search-bar button svg{width:20px;height:20px}
.top-actions{display:flex;align-items:center;gap:6px;flex:none}
.create-btn{
  display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;
  border:0;border-radius:19px;background:var(--bg-chip);color:var(--ink);font-size:14px;font-weight:500;
}
.create-btn:hover{background:var(--bg-hover)}
.create-btn svg{width:20px;height:20px}
.lang-select{
  height:38px;border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:19px;padding:0 10px;font-size:13.5px;max-width:118px;
}
.avatar{
  width:34px;height:34px;border-radius:50%;flex:none;overflow:hidden;border:0;padding:0;
  background:var(--red);color:#fff;font-weight:600;font-size:15px;
  display:inline-flex;align-items:center;justify-content:center;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.signin-btn{
  border:1px solid var(--line);background:var(--bg);color:var(--blue);
  height:38px;padding:0 14px;border-radius:19px;font-size:14px;font-weight:500;
  display:inline-flex;align-items:center;gap:7px;
}
.signin-btn svg{width:20px;height:20px}

/* ---------- Layout ---------- */
.shell{display:flex;align-items:flex-start}
nav.rail{
  width:76px;flex:none;position:sticky;top:58px;height:calc(100vh - 58px);
  display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:4px;background:var(--bg);
}
nav.rail button{
  width:64px;padding:9px 0 7px;border:0;border-radius:10px;background:transparent;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;
}
nav.rail button:hover{background:var(--bg-hover)}
nav.rail button.active{background:var(--bg-hover);font-weight:600}
nav.rail button svg{width:22px;height:22px}
main{flex:1;min-width:0;padding:14px 20px 90px}
@media (max-width:760px){
  nav.rail{display:none}
  main{padding:10px 12px 96px}
  .logo .wordmark{font-size:19px}
  #tb-logo{display:none}
  .footer-note{padding-bottom:96px !important}
  .lang-select{max-width:86px}
  .create-btn span{display:none}
  .create-btn{padding:0 10px}
}

/* bottom nav (mobile) */
nav.bottombar{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg);
  border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom));
}
nav.bottombar button{
  flex:1;border:0;background:transparent;color:var(--ink);padding:5px 0 3px;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;border-radius:8px;
}
nav.bottombar button.active{font-weight:700}
nav.bottombar button svg{width:22px;height:22px}
@media (max-width:760px){ nav.bottombar{display:flex} }

/* ---------- Chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;border:0;background:var(--bg-chip);color:var(--ink);
  padding:7px 13px;border-radius:8px;font-size:13.5px;font-weight:500;
}
.chip.active{background:var(--ink);color:var(--bg)}

/* ---------- Video grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:26px 16px}
@media (max-width:480px){.grid{grid-template-columns:minmax(0,1fr);gap:22px}}
.vcard{cursor:pointer}
.thumb{position:relative;border-radius:var(--radius);overflow:hidden;background:#000;box-sizing:content-box;height:0;padding-top:56.25%}
.thumb img{position:absolute;top:0;left:0;width:100%;height:100%;aspect-ratio:16/9;object-fit:cover;display:block;transition:transform .25s ease}
.vcard:hover .thumb img{transform:scale(1.03)}
.thumb .dur{
  position:absolute;bottom:7px;inset-inline-end:7px;background:rgba(0,0,0,.82);color:#fff;
  font-size:12px;font-weight:500;padding:2px 5px;border-radius:5px;
}
.thumb .adtag{
  position:absolute;top:7px;inset-inline-start:7px;background:#f9c846;color:#111;
  font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.02em;
}
.vmeta{display:flex;gap:11px;margin-top:11px}
.vmenu-btn{flex:none;width:34px;height:34px;align-self:flex-start}
.vshare-btn{flex:none;width:34px;height:34px;align-self:flex-start}
.shelf-share{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:0;display:flex;align-items:center;justify-content:center;z-index:2;cursor:pointer}
.shelf-share svg{width:16px;height:16px}
.shelf-menu{position:absolute;top:6px;right:40px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:0;display:flex;align-items:center;justify-content:center;z-index:2;cursor:pointer}
.shelf-menu svg{width:16px;height:16px}
.ask-note{font-size:13px;color:var(--ink-2);margin:10px 0 0}
.ask-chip{display:inline-block;border:1px solid #ddd;border-radius:999px;padding:7px 12px;margin:4px 6px 0 0;background:#fff3f3;color:#c00;font-size:13.5px;cursor:pointer}
.vmeta .avatar{width:36px;height:36px;font-size:14px;cursor:pointer}
.vtext{min-width:0;flex:1}
.vtitle{font-size:15.5px;font-weight:500;line-height:1.35;margin:0 0 3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vsub{font-size:13px;color:var(--ink-2);margin:0;line-height:1.45}
.vsub .chname{cursor:pointer}
.vsub .chname:hover{color:var(--ink)}
/* ---------- Team ads: animated sticker above the player, never on the video ---------- */
@keyframes adGrad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes adFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes adShine{0%{transform:translateX(-140%) skewX(-18deg)}100%{transform:translateX(260%) skewX(-18deg)}}
@keyframes adPacketFloat{0%,100%{transform:translateY(0) rotate(-1.5deg) scale(1)}50%{transform:translateY(-6px) rotate(1.5deg) scale(1.04)}}
/* The ad packet photo: gentle float/bounce + a little wiggle, like a real ad. */
.ad-packet{animation:adPacketFloat 2.8s ease-in-out infinite}
.ad-banner img.ad-packet{height:140px;width:auto;margin:6px auto}
.adcard img.ad-packet{height:160px;width:auto;margin:6px auto}
.ad-banner.slim img.ad-packet{display:block;flex:none;height:52px;width:auto;margin:0;border-radius:8px}
.adcard{
  position:relative;overflow:hidden;border:0;border-radius:18px;padding:14px 16px;color:#fff;
  background:linear-gradient(120deg,#ff3d00,#ff9100,#ffca28,#ff4081,#7c4dff,#2979ff,#ff3d00);
  background-size:300% 300%;animation:adGrad 9s ease infinite;
  display:flex;flex-direction:column;gap:6px;justify-content:center;min-height:120px;cursor:pointer;
  box-shadow:0 6px 18px rgba(255,61,0,.30);
}
.adcard .adtag{align-self:flex-start;background:rgba(255,255,255,.95);color:#d50000;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;letter-spacing:.4px}
.adcard h4{margin:2px 0 0;font-size:16px;color:#fff}
.adcard p{margin:0;color:rgba(255,255,255,.93);font-size:13.5px}
.adcard img{display:block;max-width:100%;border-radius:10px;margin:4px 0}
.adcard .ad-cta{align-self:flex-start;margin-top:6px;background:#fff;color:#d50000;border:0;border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.ad-banner{
  position:relative;overflow:hidden;border:0;border-radius:18px;padding:10px 14px;color:#fff;
  background:linear-gradient(120deg,#ff3d00,#ff9100,#ffca28,#ff4081,#7c4dff,#2979ff,#ff3d00);
  background-size:300% 300%;animation:adGrad 9s ease infinite,adFloat 3.2s ease-in-out infinite;
  display:flex;flex-direction:column;gap:4px;margin:2px 0 10px;cursor:pointer;
  box-shadow:0 6px 18px rgba(255,61,0,.35);
}
.ad-banner::after{content:"";position:absolute;top:0;bottom:0;width:34%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:adShine 3.4s ease-in-out infinite;pointer-events:none}
.ad-banner .adtag{align-self:flex-start;background:rgba(255,255,255,.95);color:#d50000;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;letter-spacing:.4px}
.ad-banner h4{margin:2px 0 0;font-size:17px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.ad-banner p{margin:0;color:rgba(255,255,255,.93);font-size:13.5px}
.ad-banner img{display:block;max-width:100%;border-radius:10px;margin:4px 0}
.ad-banner .ad-cta{align-self:flex-start;margin-top:7px;background:#fff;color:#d50000;border:0;border-radius:999px;padding:9px 18px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.ad-banner .ad-cta:active{transform:scale(.96)}

/* ---------- Slim one-row sticker (above the player) ---------- */
.ad-banner.slim{flex-direction:row;align-items:center;gap:10px;padding:8px 12px;margin:2px 0 8px;border-radius:12px}
.ad-banner.slim h4{font-size:14px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-banner.slim p{display:none}
.ad-banner.slim img{display:none}
.ad-banner.slim .adtag{flex:none;padding:2px 7px;font-size:10px}
.ad-banner.slim .ad-cta{flex:none;margin:0;padding:6px 12px;font-size:12px;white-space:nowrap}

/* ---------- Rotate to landscape = big video (theater mode) ---------- */
.fs-btn{position:absolute;bottom:8px;right:8px;z-index:6;width:36px;height:36px;border:0;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s ease}
.player-box.show-fs .fs-btn{opacity:1;pointer-events:auto}
.fs-btn svg{width:20px;height:20px}
.fs-btn:active{transform:scale(.94)}
.q-btn{position:absolute;bottom:8px;right:52px;z-index:6;height:36px;min-width:52px;padding:0 10px;border:0;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.q-btn:active{transform:scale(.94)}
body.landscape-watch .q-btn{display:none}
body.landscape-watch{overflow:hidden}
body.landscape-watch header.topbar,body.landscape-watch nav.rail,body.landscape-watch nav.bottombar,body.landscape-watch .footer-note,body.landscape-watch #miniplayer{display:none}
body.landscape-watch .player-box{position:fixed;inset:0;z-index:9990;background:#000;border-radius:0;display:flex;align-items:center;justify-content:center}
body.landscape-watch .player-box iframe,body.landscape-watch .player-box video{width:100%;height:100%;aspect-ratio:auto}
body.landscape-watch .fs-btn{display:none}
.player-box:fullscreen{border-radius:0}
.player-box:fullscreen iframe,.player-box:fullscreen video{width:100%;height:100%;aspect-ratio:auto}

/* ---------- You tab (YouTube-style) ---------- */
.accounts-btn{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;padding:6px 2px}
.accounts-btn svg{width:16px;height:16px}
.bell-wrap{position:relative}
.bell-badge{position:absolute;top:1px;right:1px;min-width:16px;height:16px;border-radius:9px;background:#c00;color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center;padding:0 4px;box-sizing:border-box}
.you-head{display:flex;align-items:center;gap:14px;margin:10px 0 12px}
.you-head .nm{font-size:19px;font-weight:700;line-height:1.25}
.you-head .handle{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.you-btns{display:flex;gap:10px;margin:0 0 18px}
.you-btns .btn{flex:1}
.hist-row{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.hist-row::-webkit-scrollbar{display:none}
.hist-card{flex:0 0 148px;cursor:pointer;min-width:0}
.hist-card .thumb{border-radius:10px;overflow:hidden;position:relative;box-sizing:content-box;height:0;padding-top:56.25%;background:#000}
.hist-card .thumb img{position:absolute;top:0;left:0;width:100%;height:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.hist-card .dur{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.8);color:#fff;font-size:11px;padding:2px 5px;border-radius:5px}
.hist-card h4{margin:6px 0 2px;font-size:13px;line-height:1.35;max-height:36px;overflow:hidden}
.hist-card p{margin:0;color:var(--ink-2);font-size:12px}
.lib-row{display:flex;align-items:center;gap:14px;padding:10px 2px;cursor:pointer;border-bottom:1px solid var(--line)}
.lib-row h4{margin:0;font-size:15px}
.lib-row p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.lib-row .chev{margin-left:auto;color:var(--ink-2);font-size:20px}
.lib-thumb{width:64px;height:36px;border-radius:6px;overflow:hidden;flex:none;background:#000}
.lib-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.lib-ic{width:64px;height:36px;border-radius:6px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none}
.lib-ic svg{width:22px;height:22px}

/* ---------- Channel page (YouTube-style) ---------- */
.chan-head2{display:flex;gap:14px;margin:14px 0 8px;align-items:flex-start}
.chan-head2 .nm{font-size:21px;font-weight:700;line-height:1.25}
.chan-head2 .handle{color:var(--ink-2);font-size:13.5px;margin-top:3px}
.sub-line{display:flex;align-items:center;gap:6px;margin-top:6px;cursor:pointer;color:var(--ink);font-size:13.5px;font-weight:600}
.sub-avatars{display:inline-flex;align-items:center}
.sub-avatars .avatar{margin-left:-6px;border:2px solid var(--panel)}
.sub-avatars .avatar:first-child{margin-left:0}
.chan-about{font-size:13.5px;line-height:1.5;color:var(--ink-2);margin:4px 0 10px;white-space:pre-wrap}
.chan-about .more-link{color:#0f0f0f;font-weight:700;cursor:pointer}
.chan-about .hint{color:var(--ink-2);font-size:12.5px}
.chan-links{display:flex;align-items:center;gap:7px;color:#065fd4;font-size:14px;font-weight:600;cursor:pointer;margin:0 0 12px}
.chan-links svg{width:16px;height:16px;flex:none}
.chan-owner-btns{display:flex;gap:10px;margin:0 0 10px}
.chan-owner-btns .btn{flex:1}
.chan-community{width:100%;justify-content:center;margin:0 0 12px}
.chan-community svg{width:17px;height:17px}
/* Owner buttons: the SVGs need an explicit size (their default is 300x150). */
.chan-owner-btns svg{width:18px;height:18px;flex:none}
.vis-row{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.vis-opt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:19px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;background:var(--bg-chip);color:var(--ink)}
.vis-opt.on{border-color:var(--red);background:rgba(255,0,0,.08)}
.vis-opt input{accent-color:var(--red)}
.create-opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg-chip);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;color:var(--ink)}
.create-opt svg{width:24px;height:24px;flex:none;color:var(--red)}
.create-opt b{display:block;font-size:15.5px;color:var(--ink)}
.create-opt .cr-sub{display:block;font-size:13px;color:var(--ink-2)}
.post-card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;background:var(--bg)}
.post-card img{width:100%;border-radius:10px;margin-top:8px;aspect-ratio:1/1;object-fit:cover;object-position:center}
.post-head{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
.up-status{font-size:13.5px;color:var(--ink-2);margin:2px 0 10px}
/* Shorts shelf (Home feed, after the first long-video cards) */
.shorts-shelf{margin:6px 0 16px;min-width:0}
.shelf-head{display:flex;align-items:center;gap:6px;margin:0 0 8px}
.shelf-head h3{margin:0;font-size:17px}
.shelf-head .shelf-ic svg{width:20px;height:20px;color:var(--red)}
.shelf-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;touch-action:pan-x pan-y;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.shelf-card{flex:0 0 150px;max-width:150px;scroll-snap-align:start;cursor:pointer}
.shelf-card .thumb{box-sizing:content-box;height:0;padding-top:177.78%;border-radius:12px;overflow:hidden;position:relative}
.shelf-card .thumb img{position:absolute;top:0;left:0;width:100%;height:100%;aspect-ratio:9/16;object-fit:cover}
.shelf-card h4{margin:6px 0 2px;font-size:13.5px;line-height:1.25}
.shelf-card p{margin:0;font-size:12px;color:var(--ink-2)}
/* Channel Shorts tab: vertical 9:16 cards in a 3-column grid. */
.shorts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shorts-grid .shelf-card{max-width:none}
/* Placeholder when a video has no poster: dark card with a play glyph. */
.thumb-ph{position:relative;background:linear-gradient(135deg,#3d3d3d,#141414)}
.thumb-ph-ic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;color:rgba(255,255,255,.85)}
.thumb-ph-title{position:absolute;left:10px;right:10px;bottom:8px;color:#fff;font-size:12.5px;font-weight:600;line-height:1.3;text-align:left;text-shadow:0 1px 4px rgba(0,0,0,.8)}
/* Community post card in the Home feed (YouTube post format) */
.feed-post{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
.feed-post .post-top{display:flex;align-items:flex-start;gap:10px}
.feed-post .post-top .grow{flex:1;min-width:0}
.feed-post .post-top .nm{font-size:15px}
.feed-post .post-top .sb{font-size:12.5px;color:var(--ink-2)}
.feed-post .post-text{margin:10px 0;white-space:pre-wrap;font-size:14.5px;line-height:1.45}
.feed-post .post-img{position:relative;border-radius:12px;overflow:hidden;margin-bottom:10px;aspect-ratio:1/1}
.feed-post .post-img img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.feed-post .post-count{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.72);color:#fff;font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:999px}
.feed-post .post-comments{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.feed-post .post-comments .add-comment{display:flex;gap:8px;align-items:center;margin-top:8px}
.feed-post .post-comments .add-comment input{flex:1}
.ad-sample-note{font-size:11.5px;color:var(--ink-2);margin-top:4px}
.up-prog{height:10px;background:var(--bg-chip);border-radius:5px;overflow:hidden;margin:8px 0 4px}
.up-prog i{display:block;height:100%;background:var(--red);border-radius:5px;transition:width .25s ease}
.featured{margin:6px 0 14px;cursor:pointer}
.featured .thumb{border-radius:12px;overflow:hidden;position:relative;box-sizing:content-box;height:0;padding-top:56.25%;background:#000}
.featured .thumb img{position:absolute;top:0;left:0;width:100%;height:100%;aspect-ratio:16/9;object-fit:cover;display:block}
/* 16:9 / 9:16 by aspect-ratio on modern WebViews; the padding-top
   hack above stays as the fallback for old ones. Ratio boxes must
   be content-box. */
@supports (aspect-ratio: 16 / 9){
  .thumb{height:auto;padding-top:0;aspect-ratio:16/9}
  .hist-card .thumb{height:auto;padding-top:0;aspect-ratio:16/9}
  .featured .thumb{height:auto;padding-top:0;aspect-ratio:16/9}
}
@supports (aspect-ratio: 9 / 16){
  .shelf-card .thumb{height:auto;padding-top:0;aspect-ratio:9/16}
}
/* 16:9 on phones: explicit vw height (aspect-ratio is unreliable
   in old WebViews). Single-column grid only (<=480px): main has
   12px side padding, so height = (100vw - 24px)*9/16. */
@media (max-width:480px){
  .grid .thumb,.featured .thumb{height:calc((100vw - 24px)*9/16);padding-top:0}
  /* Photo posts are square 1:1 on phones (explicit vw height). */
  .feed-post .post-img{height:calc(100vw - 50px)}
  .post-card img{height:calc(100vw - 50px)}
}
.featured .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);color:#fff;font-size:11.5px;padding:2px 6px;border-radius:5px}
.featured h3{margin:8px 0 3px;font-size:16px;line-height:1.35}
.featured p{margin:0;color:var(--ink-2);font-size:13px}
.subs-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.subs-row h4{font-size:15px}
.subs-row svg{width:20px;height:20px;color:var(--ink-2);flex:none}
@media (min-width:768px){.hist-card{flex-basis:180px}}


/* ---------- Watch ---------- */
.watch-wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
@media (max-width:1020px){.watch-wrap{grid-template-columns:minmax(0,1fr)}}
/* Grid children default to min-width:auto: a wide child (long title,
   comment row) would force the whole watch page wider than the phone.
   min-width:0 lets every column shrink to the screen. */
.watch-wrap>*{min-width:0}
.player-box{position:relative;background:#000;border-radius:var(--radius);overflow:hidden}
.player-box video{width:100%;display:block;aspect-ratio:16/9;background:#000;object-fit:contain}
.player-box iframe{width:100%;display:block;aspect-ratio:16/9;border:0;background:#000}
.thumb .autotag{
  position:absolute;top:7px;inset-inline-end:7px;background:rgba(0,0,0,.82);color:#fff;
  font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;
}
.preroll{
  position:absolute;inset:0;background:rgba(8,8,8,.94);color:#fff;z-index:5;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;
}
.preroll .adtag{background:#f9c846;color:#111;font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px}
.preroll h3{margin:0;font-size:22px}
.preroll p{margin:0;color:#ccc;max-width:420px}
.preroll .skip{
  position:absolute;bottom:18px;inset-inline-end:18px;background:rgba(255,255,255,.14);color:#fff;
  border:1px solid rgba(255,255,255,.4);padding:8px 16px;border-radius:6px;font-size:14px;
}
/* House video ad (RK Tube promo, rk-tube-ad.mp4, 11s) — fills the
   player box; Ad tag top-left, Skip stays bottom-right. */
.preroll.house-ad{background:#000;padding:0}
.preroll.house-ad video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.preroll.house-ad .adtag{position:absolute;top:10px;inset-inline-start:10px;z-index:2}
.watch-title{font-size:20px;font-weight:600;margin:14px 0 8px;line-height:1.35}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.tag-chip{border:1px solid var(--line);background:var(--bg-chip);color:var(--blue);border-radius:14px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer}
.watch-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.watch-row>*{min-width:0}
/* The channel name must shrink (ellipsis) instead of shoving the
   Subscribe button off the right edge of the screen. */
.chan-chip{display:flex;align-items:center;gap:10px;margin-inline-end:auto;flex:1 1 auto;min-width:0}
.chan-chip>div{min-width:0}
.chan-chip .avatar{width:40px;height:40px}
.chan-chip .nm{font-size:15px;font-weight:600;line-height:1.2;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan-chip .sb{font-size:12.5px;color:var(--ink-2)}
.sub-btn{
  background:var(--ink);color:var(--bg);border:0;height:38px;padding:0 17px;border-radius:19px;
  font-size:14px;font-weight:600;white-space:nowrap;flex:none;
}
.sub-btn.subbed{background:var(--bg-chip);color:var(--ink)}
/* Bell next to Subscribe (YouTube-style): greyed out until subscribed,
   red with a dot while notifications are on for that channel. */
.bell-btn{width:38px;height:38px;border-radius:50%;border:0;background:var(--bg-chip);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:none;cursor:pointer;position:relative}
.bell-btn svg{width:20px;height:20px}
.bell-btn.off{opacity:.45}
.bell-btn.on{color:var(--red)}
.bell-btn.on::after{content:"";position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
.pill-actions{display:flex;gap:8px;flex-wrap:wrap;min-width:0}
.pill{
  display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border:0;
  border-radius:19px;background:var(--bg-chip);color:var(--ink);font-size:14px;font-weight:500;
}
.pill svg{width:19px;height:19px}
.pill.on{background:var(--ink);color:var(--bg)}
.desc-box{background:var(--bg-soft);border-radius:var(--radius);padding:12px 14px;margin-top:14px;font-size:14px;line-height:1.55}
.desc-box .stats{font-weight:600;margin-bottom:4px}
.below-ad{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-top:14px;display:flex;gap:12px;align-items:center;background:var(--card)}
.below-ad .adtag{background:#f9c846;color:#111;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;flex:none}
.below-ad h4{margin:0;font-size:15px}
.below-ad p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.comments{margin-top:26px}
.comments h3{font-size:16px;margin:0 0 14px}
.comment{display:flex;gap:11px;margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.comment .avatar{width:36px;height:36px;font-size:13px;flex:none}
.comment-body{flex:1;min-width:0}
.comment .who{font-size:13px;font-weight:600}
.comment .who span{color:var(--ink-2);font-weight:400;margin-inline-start:6px}
.comment p{margin:3px 0 0;font-size:14px;line-height:1.5}
.comment-actions{display:flex;gap:6px;margin-top:9px}
.comment-actions button{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:transparent;color:var(--ink-2);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.comment-actions button svg{width:15px;height:15px}
.comment-actions button.on{color:var(--red);border-color:var(--red);background:#fff0ef}
.add-comment{display:flex;gap:11px;margin-bottom:22px;align-items:center}
.add-comment input{
  flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);
  font-size:14px;padding:10px 16px;outline:none;
}
.add-comment input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(230,33,23,.12)}
.add-comment .post-btn{flex:none;border-radius:999px;padding:9px 20px;font-weight:700}
.flip-ic{display:inline-flex}
.flip-ic svg{transform:rotate(180deg)}
.upnext h3{font-size:16px;margin:2px 0 12px}
.unext-row{display:flex;gap:10px;cursor:pointer;margin-bottom:12px}
.unext-row .thumb{width:168px;flex:none}
.unext-row .vtitle{font-size:14px}
.unext-row .vsub{font-size:12.5px}

/* ---------- Channel ---------- */
.banner{
  height:170px;border-radius:var(--radius);overflow:hidden;position:relative;
  background:linear-gradient(115deg,#8f130c,#e62117 45%,#ff7a45);
  background-size:cover;background-position:center;background-repeat:no-repeat;
}
.banner>img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.banner .size-note{
  position:absolute;bottom:9px;inset-inline-end:10px;background:rgba(0,0,0,.65);color:#fff;
  font-size:11.5px;padding:3px 8px;border-radius:5px;
}
@media (max-width:760px){.banner{height:104px}}
.chan-head{display:flex;gap:18px;align-items:center;margin:18px 0 6px;flex-wrap:wrap}
.chan-head .avatar{width:96px;height:96px;font-size:36px;border-radius:50%}
@media (max-width:760px){.chan-head .avatar{width:72px;height:72px;font-size:27px}}
.chan-head h1{margin:0;font-size:26px;display:flex;align-items:center;gap:8px}
.chan-head .handle{color:var(--ink-2);font-size:14px;margin-top:3px}
.chan-stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.stat-chip{background:var(--bg-soft);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:13px}
.stat-chip b{font-size:14.5px}
.owner-badge{background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:9px;letter-spacing:.04em}
.verified-badge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#1d9bf0;color:#fff;flex:none;margin-inline-start:5px;vertical-align:-2px}
.verified-badge.verified-red{background:#e62117}
.verified-badge svg{width:11px;height:11px;display:block}
.chan-head h1 .verified-badge{width:23px;height:23px;vertical-align:0}
.chan-head h1 .verified-badge svg{width:15px;height:15px}
.section-title{font-size:18px;margin:26px 0 12px}
.about-box{background:var(--bg-soft);border-radius:var(--radius);padding:14px 16px;font-size:14.5px;line-height:1.6;white-space:pre-wrap}
.empty-note{border:1.5px dashed var(--line);border-radius:var(--radius);padding:30px 18px;text-align:center;color:var(--ink-2);font-size:14.5px;line-height:1.6}
.empty-note b{color:var(--ink)}

/* ---------- Studio / panels ---------- */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:8px 0 20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  border:0;background:transparent;color:var(--ink-2);font-size:15px;font-weight:500;
  padding:10px 14px;border-bottom:3px solid transparent;white-space:nowrap;
}
.tabs button.active{color:var(--ink);border-color:var(--ink)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px}
.panel h3{margin:0 0 6px;font-size:17px}
.panel .hint{color:var(--ink-2);font-size:13.5px;line-height:1.55;margin:0 0 14px}
.field{margin-bottom:15px}
.field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px}
.field .size{display:inline-block;background:var(--bg-chip);border-radius:5px;padding:1px 7px;font-size:12px;font-weight:600;margin-inline-start:6px}
.field input[type=text],.field input[type=email],.field input[type=url],.field textarea,.field select{
  width:100%;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);
  padding:10px 12px;font-size:14.5px;outline:none;
}
.field textarea{min-height:96px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue)}
.btn{
  display:inline-flex;align-items:center;gap:7px;border:0;border-radius:19px;height:39px;padding:0 18px;
  font-size:14px;font-weight:600;background:var(--ink);color:var(--bg);
}
.btn.red{background:var(--red);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.ghost{background:var(--bg-chip);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.progress{height:10px;background:var(--bg-chip);border-radius:5px;overflow:hidden;margin:8px 0 5px}
.progress i{display:block;height:100%;background:var(--red);border-radius:5px;transition:width .4s ease}
.meter-row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-2)}
.meter-row b{color:var(--ink)}
.status-ok{color:var(--green);font-weight:600}
.ad-list-item{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:10px;flex-wrap:wrap}
/* 180px minimum forced search/subscriber rows wider than a 320px
   phone (avatar + 180px + Subscribe button > the screen), which
   widened the whole page. The text truncates instead. */
.ad-list-item .grow{flex:1;min-width:0}
.ad-list-item h4{margin:0;font-size:14.5px}
.ad-list-item p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}
.switch{position:relative;width:44px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;background:var(--bg-chip);border:1px solid var(--line);border-radius:12px;transition:.2s}
.switch i:before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--ink-2);top:2px;inset-inline-start:2px;transition:.2s}
.switch input:checked + i{background:var(--blue);border-color:var(--blue)}
.switch input:checked + i:before{transform:translateX(20px);background:#fff}
[dir="rtl"] .switch input:checked + i:before{transform:translateX(-20px)}

/* ---------- Auth ---------- */
.auth-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px 14px;
  background:var(--bg-soft);
}
.auth-card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  width:100%;max-width:430px;padding:30px 28px 26px;text-align:center;
}
.auth-card .logo{justify-content:center}
.auth-card h1{font-size:22px;margin:16px 0 4px}
.auth-card .sub{color:var(--ink-2);font-size:14px;margin:0 0 20px;line-height:1.5}
.auth-card .field{text-align:start}
.google-note{
  display:flex;gap:9px;align-items:flex-start;background:var(--bg-soft);border-radius:10px;
  padding:10px 12px;font-size:12.5px;color:var(--ink-2);line-height:1.5;text-align:start;margin-top:14px;
}
.error-msg{color:var(--red-dark);background:var(--red-soft);border-radius:8px;padding:9px 12px;font-size:13.5px;margin-bottom:13px;text-align:start}
.linklike{border:0;background:none;color:var(--blue);font-size:14px;font-weight:500;padding:4px}
.install-box{margin-top:18px;border-top:1px solid var(--line);padding-top:16px;text-align:start}
.install-box h4{margin:0 0 6px;font-size:14.5px}
.install-box p,.install-box li{font-size:13px;color:var(--ink-2);line-height:1.55}
.install-box ol{margin:6px 0 0;padding-inline-start:18px}

/* ---------- Modals ---------- */
.modal-back{
  position:fixed;inset:0;background:rgba(10,10,10,.55);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;padding:0;
}
@media (min-width:700px){.modal-back{align-items:center;padding:20px}}
.modal{
  background:var(--card);color:var(--ink);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  border-radius:16px 16px 0 0;padding:22px 22px 26px;box-shadow:var(--shadow);
}
@media (min-width:700px){.modal{border-radius:16px}}
.modal h2{margin:0 0 4px;font-size:19px}
.modal .sub{color:var(--ink-2);font-size:13.5px;margin:0 0 16px;line-height:1.5}
.modal .x{float:right}
/* Logo zoom editor: circular preview, zoom slider, drag to position. */
.logo-zoom-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.logo-zoom-stage{width:260px;height:260px;border-radius:50%;overflow:hidden;background:#111;touch-action:none;cursor:grab;position:relative;flex:none}
.logo-zoom-stage:active{cursor:grabbing}
.logo-zoom-stage canvas{width:100%;height:100%;display:block}
.logo-zoom-row{display:flex;align-items:center;gap:10px;width:100%}
.logo-zoom-row input[type=range]{flex:1}
.logo-zoom-actions{display:flex;gap:10px;width:100%}
.logo-zoom-actions .btn{flex:1;justify-content:center}
.drop{
  border:1.5px dashed var(--line);border-radius:var(--radius);padding:20px;text-align:center;
  color:var(--ink-2);font-size:14px;line-height:1.6;margin-bottom:15px;cursor:pointer;
}
.drop:hover{border-color:var(--blue);color:var(--ink)}
.drop b{color:var(--blue)}
.quota-box{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:15px}
.quota-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:7px}
.quota-head span{color:var(--ink-2);font-size:12.5px}
.quota-bar{height:8px;border-radius:99px;background:var(--bg-hover);overflow:hidden;margin-bottom:8px}
.quota-bar i{display:block;height:100%;background:var(--red);border-radius:99px}
.quota-box p{margin:2px 0;font-size:12.5px;color:var(--ink-2);line-height:1.55}
.thumb-preview{width:100%;border-radius:10px;margin-bottom:12px}
.menu-pop{
  position:fixed;z-index:120;background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);padding:7px;min-width:230px;
}
.menu-pop button{
  display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:var(--ink);
  padding:10px 11px;border-radius:8px;font-size:14.5px;text-align:start;
}
.menu-pop button:hover{background:var(--bg-hover)}
.menu-pop button svg{width:20px;height:20px;flex:none}
.menu-pop .sep{height:1px;background:var(--line);margin:5px 4px}
/* Settings sheet rows (gear icon in the top header) */
.set-row{
  display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--ink);
  padding:13px 6px;border-bottom:1px solid var(--line);border-radius:0;font-size:15px;text-align:start;cursor:pointer;
}
.set-row:last-of-type{border-bottom:0}
.set-row:hover{background:var(--bg-hover)}
.set-row svg{width:21px;height:21px;flex:none}
.set-row .chev{margin-inline-start:auto;color:var(--ink-2);font-size:15px}
.set-lang{display:flex;flex-wrap:wrap;gap:8px;padding:12px 2px 2px}
.set-lang button{border:1px solid var(--line);background:var(--bg-soft);color:var(--ink);border-radius:16px;padding:7px 13px;font-size:13.5px;cursor:pointer}
.set-lang button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toast{
  position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:200;
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:9px;font-size:14px;
  box-shadow:var(--shadow);max-width:88vw;text-align:center;
}
@media (min-width:761px){.toast{bottom:26px}}
.footer-note{color:var(--ink-3);font-size:12.5px;text-align:center;margin-top:44px;line-height:1.7}
/* ---------- Help Center (headset icon in the top bar) ---------- */
.help-modal{position:relative;display:flex;flex-direction:column;overflow:hidden;max-height:94vh}
.help-modal .x{position:absolute;top:10px;inset-inline-end:10px;float:none;z-index:2}
.help-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;padding-inline-end:38px;flex:none}
.help-avatar{width:46px;height:46px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.help-avatar svg{width:26px;height:26px}
.help-head h2{margin:0;font-size:19px}
.help-status{display:flex;align-items:center;gap:6px;margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}
.help-dot{width:8px;height:8px;border-radius:50%;background:#0f9d58;flex:none}
.help-about{border:1px solid var(--line);background:var(--bg-soft);border-radius:10px;padding:9px 12px;font-size:13.5px;line-height:1.75;margin-bottom:10px;flex:none}
.help-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;flex:none}
.help-chips::-webkit-scrollbar{display:none}
.help-chip{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:7px 12px;font-size:13px;cursor:pointer}
.help-chip:hover{background:var(--bg-hover)}
.help-msgs{flex:1;overflow-y:auto;min-height:150px;padding:4px 2px 8px;display:flex;flex-direction:column;gap:10px}
.help-row{display:flex;gap:8px;align-items:flex-start}
.help-row.me{justify-content:flex-end}
.help-mini{width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.help-mini svg{width:17px;height:17px}
.help-bubble{max-width:82%;border-radius:14px;padding:10px 13px;font-size:14px;line-height:1.6;word-break:break-word}
.help-row.bot .help-bubble{background:var(--bg-soft);border:1px solid var(--line);border-top-left-radius:4px}
[dir="rtl"] .help-row.bot .help-bubble{border-top-left-radius:14px;border-top-right-radius:4px}
.help-row.me .help-bubble{background:var(--red);color:#fff;border-top-right-radius:4px}
[dir="rtl"] .help-row.me .help-bubble{border-top-right-radius:14px;border-top-left-radius:4px}
.help-typing{display:inline-flex;gap:4px;padding:4px 2px}
.help-typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:helpBlink 1s infinite}
.help-typing i:nth-child(2){animation-delay:.15s}
.help-typing i:nth-child(3){animation-delay:.3s}
@keyframes helpBlink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion: reduce){.help-typing i{animation:none;opacity:.6}}
.help-form{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:12px;margin-top:4px;flex:none}
.help-form input{flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:21px;padding:0 15px;font-size:14.5px;background:var(--bg);color:var(--ink);outline:none}
.help-form input:focus{border-color:var(--blue)}
.help-send{width:42px;height:42px;border-radius:50%;border:0;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
.help-send svg{width:19px;height:19px}
.help-note{margin:8px 0 0;font-size:12px;color:var(--ink-3);text-align:center;flex:none}
/* ---------- Guidelines / AutoCheck ---------- */
.guide-banner{border-radius:var(--radius);padding:13px 15px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-start;line-height:1.5;font-size:14px}
.guide-banner.warn{background:#fff8e1;border:1px solid #f9c846;color:#5d4037}
.guide-banner.strike{background:#fdecea;border:1px solid #f5c6c2;color:#7a1710}
.guide-banner.good{background:#e6f4ea;border:1px solid #a3d9b1;color:#174d2a}
.guide-banner.term{background:#0f0f0f;border:1px solid #0f0f0f;color:#fff}
.guide-banner b{font-size:15px}
.strike-dots{display:flex;gap:7px;margin:10px 0}
.strike-dot{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--bg)}
.strike-dot.on{background:var(--red);border-color:var(--red);color:#fff}
.strike-dot.warn-on{background:#f9c846;border-color:#e6a817;color:#111}
.policy-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.policy-grid{grid-template-columns:1fr}}
.policy-card{border:1px solid var(--line);border-radius:10px;padding:13px 14px;background:var(--bg-soft)}
.policy-card h4{margin:0 0 5px;font-size:14.5px}
.policy-card p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.55}
.violation-item{border:1px solid var(--line);border-left:4px solid var(--red);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.violation-item.warn{border-left-color:#e6a817}
.violation-item h4{margin:0 0 3px;font-size:14.5px}
.violation-item p{margin:2px 0;font-size:13px;color:var(--ink-2);line-height:1.5}
.scan-box{text-align:center;padding:8px 0 4px}
.scan-bar{height:9px;background:var(--bg-chip);border-radius:5px;overflow:hidden;margin:16px 0 8px}
.scan-bar i{display:block;height:100%;background:var(--red);width:0%;transition:width .3s ease}
.scan-steps{text-align:start;max-width:380px;margin:12px auto 0;font-size:13.5px;line-height:1.9;color:var(--ink-2)}
.scan-steps .done{color:var(--green);font-weight:600}
.standing-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:12px}
.standing-pill.good{background:#e6f4ea;color:#0f7b3d}
.standing-pill.warn{background:#fff3cd;color:#856404}
.standing-pill.strike{background:#fdecea;color:#c81e12}
.standing-pill.term{background:#0f0f0f;color:#fff}
/* ---------- Video source (YouTube / own server) ---------- */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 4px}
@media (max-width:700px){.mode-grid{grid-template-columns:1fr}}
.mode-card{border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;background:var(--bg-soft)}
.mode-card.on{border-color:var(--red);background:var(--red-soft)}
.mode-card h4{margin:0 0 5px;font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mode-card p{margin:0 0 12px;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.mode-current{background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:9px;letter-spacing:.03em}
.danger-zone{border:1.5px solid var(--red);border-radius:12px;padding:15px 16px;margin-top:16px;background:var(--red-soft)}
.danger-zone h4{margin:0 0 5px;font-size:15.5px}
.danger-zone p{margin:0 0 12px;font-size:13.5px;color:var(--ink-2);line-height:1.55}
/* ---------- Team account ---------- */
.owner-box{margin-top:20px;border:1.5px solid var(--red);border-radius:12px;padding:16px 14px 14px;text-align:start;background:var(--red-soft)}
.owner-box h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px}
.owner-box .osub{color:var(--ink-2);font-size:13px;line-height:1.55;margin:0 0 12px}
.owner-box .field input[type=password]{
  width:100%;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);
  padding:10px 12px;font-size:14.5px;outline:none;
}
.owner-box .field input[type=password]:focus{border-color:var(--red)}
.auth-divider{display:flex;align-items:center;gap:10px;margin:20px 0 0;color:var(--ink-3);font-size:12px;font-weight:600;letter-spacing:.06em}
.auth-divider:before,.auth-divider:after{content:"";flex:1;height:1px;background:var(--line)}
.owner-chip{display:inline-flex;align-items:center;gap:5px;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:10px;letter-spacing:.05em;flex:none}
/* ---------- Corner account menu (YouTube-style) ---------- */
.menu-head{display:flex;gap:12px;align-items:flex-start;padding:10px 11px 8px}
.menu-head .avatar{width:44px;height:44px;font-size:17px}
.menu-head-text{min-width:0;flex:1}
.menu-name{font-size:16px;font-weight:600;line-height:1.3;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.menu-sub{font-size:13px;color:var(--ink-2);line-height:1.45;word-break:break-all}
.menu-lang{display:flex;align-items:center;gap:11px;padding:7px 11px}
.menu-lang svg{width:20px;height:20px;flex:none}
.menu-lang select{flex:1}
@media (max-width:760px){
  .menu-pop{left:10px !important;right:10px !important;width:auto;max-height:82vh;overflow-y:auto}
  /* keep the corner Sign in / avatar inside the phone top bar */
  .signin-btn{padding:0 10px;height:36px;font-size:13.5px}
  header.topbar{gap:8px;padding:0 10px}
  .top-actions{gap:4px}
}
/* Sign-in opens in a modal over the feed */
.modal.auth-modal{max-width:470px;text-align:center}
.modal.auth-modal .field{text-align:start}
.modal.auth-modal .logo{justify-content:center}
.signin-cta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* ---------- Mini player (drag down to dock) ---------- */
#miniplayer{position:fixed;left:8px;right:8px;bottom:70px;z-index:90;background:#111;color:#fff;border-radius:12px;display:flex;align-items:center;gap:10px;padding:6px;box-shadow:var(--shadow);cursor:pointer}
#miniplayer[hidden]{display:none}
@media (min-width:761px){#miniplayer{left:auto;right:20px;bottom:20px;width:380px}}
.mini-player-slot{width:128px;flex:none;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}
.mini-player-slot video,.mini-player-slot iframe{width:100%;height:100%;display:block;border:0}
.mini-title{flex:1;min-width:0;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-btn{background:transparent;border:0;color:#fff;width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.mini-btn:hover{background:rgba(255,255,255,.14)}
.mini-btn svg{width:20px;height:20px}
/* ---------- Shorts ---------- */
/* ---------- Shorts: native vertical scroll-snap paging ----------
   One full-screen section per short inside a snap scroller. Swiping
   scrolls natively to the next/previous short — no JS touch
   detection (touches inside a YouTube iframe never reach the page,
   so JS swipe detection could never work there). */
.shorts-scroller{height:calc(100vh - 190px);height:calc(100dvh - 190px);overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.shorts-scroller::-webkit-scrollbar{display:none}
.shorts-page{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;justify-content:center}
.shorts-page .shorts-player{width:100%;max-width:420px;height:100%;max-height:none;aspect-ratio:auto}
.shorts-media{position:absolute;inset:0}
.shorts-touch{position:absolute;inset:0;z-index:2}
.shorts-media .shorts-poster,.shorts-media iframe,.shorts-media video{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover;display:block}
.shorts-player{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:9/16;max-height:calc(100vh - 190px)}
.shorts-player video,.shorts-player iframe{width:100%;height:100%;display:block;border:0;object-fit:cover}
/* ---------- FIX 6: Shorts fullscreen (YouTube-style) ---------- */
body.shorts-mode header.topbar,body.shorts-mode nav.rail,body.shorts-mode nav.bottombar,body.shorts-mode .footer-note{display:none}
body.shorts-mode #main{padding:0}
body.shorts-mode .shorts-scroller{height:100vh;height:100dvh}
body.shorts-mode .shorts-page .shorts-player{max-width:none;border-radius:0;max-height:none}
body.shorts-mode .shorts-player{border-radius:0;max-height:none}
body.shorts-mode #shorts-count,body.shorts-mode .shorts-nav{display:none}
.shorts-exit{position:fixed;top:10px;left:10px;z-index:60;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:20px;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer}
body.shorts-mode .shorts-exit{display:flex}
.shorts-info{position:absolute;z-index:3;left:12px;bottom:14px;right:64px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.shorts-info h3{margin:0 0 4px;font-size:15px;line-height:1.35}
.shorts-info p{margin:0;font-size:13px;opacity:.9}
.shorts-side{position:absolute;z-index:3;right:8px;bottom:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.shorts-side button{width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;gap:1px}
.shorts-side button svg{width:22px;height:22px}
.shorts-side button.on{background:var(--red)}
.shorts-nav{display:flex;gap:10px;justify-content:center;margin-top:12px}
.search-open{flex:1}
.notif-item{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;text-align:start;width:100%;background:transparent;border-left:0;border-right:0;border-top:0;color:var(--ink)}
.notif-item:last-child{border-bottom:0}
.notif-item h4{margin:0 0 3px;font-size:14.5px}
.notif-item p{margin:0;font-size:13px;color:var(--ink-2)}
</style>

    + '</svg>';
}
function logoLockup(size){
  return '<span class="logo">'+logoSVG(size||34)+'<span class="wordmark"><b>RK</b> Tube</span></span>';
}

/* ONE team account for the whole app.
   The owner sets their own name + Gmail + password in the app (first-time
   setup on the sign-in screen). Nothing is hardcoded in this source and no
   real password is shipped. Owner powers exist ONLY in an team session:
   signing in with that same Gmail through the regular form does NOT open
   them — the password check in Team sign in is what opens them.
   The team account itself is SAVED in this phone/browser's localStorage
   (key below) so closing and reopening the app does NOT ask to create it
   again, and nobody else can create a new team account on this device.
   The owner SESSION is kept with the sign-in on this device (see
   restoreUserData): reopening the app restores it when the signed-in
   email matches the stored team Gmail, so Team control is there
   without re-entering the password. The password is still required
   the first time, for recovery, and when no team account is stored
   on this device. Signing out clears the team session.
   Per earlier approval this owner credential is the one deliberate
   exception to the app's otherwise in-session-only data. */
var OWNER_KEY="rktube_owner_account_v1";
function loadOwnerCreds(){
  try{
    var raw=window.localStorage.getItem(OWNER_KEY);
    if(!raw) return null;
    var o=JSON.parse(raw);
    if(o && o.name && o.email && o.password) return {name:String(o.name),email:String(o.email).toLowerCase(),password:String(o.password),
      recoveryEmail:o.recoveryEmail?String(o.recoveryEmail).toLowerCase():"",phone:o.phone?String(o.phone):""};
  }catch(e){}
  return null;
}
function saveOwnerCreds(){
  try{ if(ownerCreds) window.localStorage.setItem(OWNER_KEY,JSON.stringify(ownerCreds)); }catch(e){}
}
var ownerCreds=loadOwnerCreds(); /* {name,email,password} — created in-app, saved on this device, never shipped */
var ownerSession=false;
function isOwner(){
  if(fbIsFirebaseOwner()) return true;
  return !!(ownerSession && ownerCreds && state.user && state.user.email
    && state.user.email.toLowerCase()===ownerCreds.email);
}
/* ---- Blue verified badge ----
   The owner's own channel (the channel whose login Gmail is the
   team Gmail - including the RK MEDIA 24 platform channel) is
   verified automatically. Every other channel is verified ONLY by
   the owner, after review, and ONLY at 50,000+ subscribers (see the
   Verification section in Studio -> Team control). The verified
   flag is stored per channel in rktube_data_v1. Verification is
   never sold and never automatic at any other threshold. */
var VERIFY_MIN_SUBS=50000;
function isOwnerChannel(ch){
  if(!ch) return false;
  if(ch.owner===true && ch.id==="rk") return true;
  return !!(ownerCreds && ownerCreds.email && ch.ownerEmail
    && String(ch.ownerEmail).toLowerCase()===ownerCreds.email);
}
function isVerified(ch){
  if(!ch) return false;
  if(isOwnerChannel(ch)) return true;
  return ch.verified===true;
}
/* The owner's main channel always shows a RED badge; every other
   verified channel shows blue. Checked on ownerEmail / channel id,
   not on a stored flag, so it survives a fresh install, a pull from
   Firestore and a channel-name edit. */
function isOwnerMainChannel(ch){
  if(!ch) return false;
  return String(ch.ownerEmail||"").toLowerCase()==="jolhash096@gmail.com" || ch.id==="ch1794012012681";
}
function verifiedBadgeHTML(ch){
  if(!isVerified(ch)) return "";
  var lbl=esc(t("verifyVerified"));
  var red=isOwnerMainChannel(ch)?" verified-red":"";
  return ' <span class="verified-badge'+red+'" data-verified="1" title="'+lbl+'" aria-label="'+lbl+'"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5l5 5L19.5 7"/></svg></span>';
}
function chanNameHTML(ch){ return esc(ch?ch.name:"")+verifiedBadgeHTML(ch); }
function ownerOnlyHTML(title){
  return '<div class="panel" style="text-align:center;padding:30px 22px">'
  + '<div style="display:flex;justify-content:center;margin-bottom:10px"><span class="owner-chip" style="font-size:13px;padding:7px 14px">🔒 '+esc(t("ownerOnlyTitle"))+'</span></div>'
  + '<h3>'+esc(title||t("ownerOnlyTitle"))+'</h3>'
  + '<p class="hint" style="max-width:480px;margin:0 auto 16px">'+esc(t("ownerOnlyMsg"))+'</p>'
  + '<button class="btn red" data-act="signout-to-owner">'+esc(t("ownerOnlyBtn"))+'</button></div>';
}

/* Team ads (RK Tube's own ad system — the owner advertises his own
   services on any video, like a platform's house ads).
   An ad is {id, videoId, placement, headline, text, link, img, active}.
   videoId "all" = every video. placement is a list of slots:
   "above" (banner above the player), "below" (banner under the
   Like/Share/Save/Report buttons), "comments" (banner above the
   comments), "feed" (card inside the home feed), "all" (every slot).
   Old ads stored a single string — "pre" (the old pre-roll overlay,
   which no longer gates the player) is read as "above".
   Ads are NEVER an overlay on the video itself and never gate
   playback. They are saved in rktube_data_v1 (see saveUserData). */

/* ============================================================
   Saved user data — rktube_data_v1 (persistence fix).
   Before this, channels/videos/state.user lived only in memory:
   a cold start (app process killed, e.g. after installing an APK
   update) reloaded the file fresh and wiped the banner, logo,
   channel edits, sign-in and user-uploaded videos. Now the
   signed-in user, the user's own channels (banner, logo, name,
   handle, about, ownership/admin/recovery fields) and
   user-uploaded videos are saved to localStorage and restored
   on startup, merged OVER the hardcoded seeds (seed channels and
   seed videos stay for everyone else; a stored channel replaces
   its seed by id). Auto-import channels (autoSource) are NOT
   stored here — they are rebuilt from aiStore by aiRehydrate().
   The team account (rktube_owner_account_v1) is untouched. If the
   restored sign-in email matches the stored team Gmail, the owner
   session is restored too (ownerSession=true), so Team control is
   present after a cold start without re-entering the password -
   device-bound persistence on the owner's own phone. The password
   is still required the first time, for recovery, and whenever no
   stored owner credentials exist; sign out clears the session.
   User-uploaded videos keep their record (title, thumbnail,
   channel); their src is a blob: URL made for this session, so
   playback of an uploaded video after a restart needs the file
   re-uploaded — only the record itself can be kept in storage.
   saveUserData() returns false when the write fails (e.g. the
   ~5 MB localStorage quota) so callers never toast "saved" for
   a save that did not happen.
   Team ads live here too (ads + adsSeeded): the Ads manager used
   to keep ads in memory only, so every ad vanished on a cold start.
   ============================================================ */

  return '<span class="avatar" style="width:'+size+'px;height:'+size+'px;background:'+ch.color+';font-size:'+Math.round(size*0.42)+'px">'+esc(ch.initial||ch.name.charAt(0))+'</span>';
}
function toast(msg){
  var old=document.querySelector(".toast"); if(old) old.remove();
  var d=document.createElement("div"); d.className="toast"; d.textContent=msg;
  document.body.appendChild(d); setTimeout(function(){ d.remove(); },2600);
}
function adPlaces(a){ if(!a) return []; if(Array.isArray(a.placement)) return a.placement; if(typeof a.placement==="string" && a.placement) return [a.placement]; return []; }
function adHasPlace(a,slot){ var p=adPlaces(a); if(p.indexOf("all")>=0) return true; if(slot==="above" && p.indexOf("pre")>=0) return true; return p.indexOf(slot)>=0; }
function adsFor(videoId,placement){
  return ads.filter(function(a){ return a.active && (a.videoId===videoId || a.videoId==="all" || !a.videoId) && adHasPlace(a,placement); });
}
/* Ad rotation: each slot takes the NEXT active ad in order, so the
   slots cycle his ad → Pran sample ad → his ad → Pran ad … and the
   same ad never sits in every slot. Advances on each render/view. */
var adRotIdx=0;
function nextAdFor(videoId,placement){
  var list=adsFor(videoId,placement);
  if(!list.length) return null;
  var a=list[adRotIdx % list.length]; adRotIdx++;
  return a;
}
function adPlaceNames(a){ var p=adPlaces(a); if(p.indexOf("all")>=0) return t("placeAll"); return p.map(function(x){ return x==="pre"||x==="above"?t("placeAbove"):x==="below"?t("placeBelow"):x==="comments"?t("placeComments"):x==="feed"?t("placeFeed"):x; }).join(", "); }
/* Banner ad shown around the player (above / below / above the
   comments). It is a plain card — NEVER an overlay on the video
   itself, and it never gates playback. Tapping it opens the ad
   link in the device browser (see the data-adlink handler in
   bindMain, backed by the RkTubeNative bridge in the APK). */
/* Sticker ad: colorful animated gradient card with a real button.
   The button opens the ad link (same handler as the card itself);
   the sticker never sits on the video — it renders in its slot
   above / below the player with a clear gap. */
function adBannerHTML(a,slim){
  return '<div class="ad-banner'+(slim?" slim":"")+'"'+(a.link?' data-adlink="'+esc(a.link)+'"':"")+'><span class="adtag">'+esc(t("adBadge"))+'</span>'
    + (a.img?'<img class="ad-packet" src="'+esc(a.img)+'" alt="">':"")
    + '<h4>'+esc(a.headline)+'</h4>'
    + (!slim && a.text?'<p>'+esc(a.text)+'</p>':"")
    + (!slim && a.sample?'<div class="ad-sample-note">'+esc(t("sampleAd"))+'</div>':"")
    + (a.link?'<button type="button" class="ad-cta" data-adlink="'+esc(a.link)+'">'+esc(t("adVisit"))+' ↗</button>':"")
    + '</div>';
}

/* Keeper selection: when several channels share one Gmail, the channel
   that owns the videos is the real one -- not the last one created.
   (The old loop kept overwriting `owned`, so a fresh empty channel
   stole the account from the channel with the videos.) Most videos
   wins; tie: verified first, then earliest createdAt, then earliest
   id. Only when NO channel has any video do we keep the old last-match
   behaviour (a brand-new account with no videos yet). */
function fbPickOwnerChannel(list){
  var arr=[], i, c, n, counts={}, maxN=0, best=null, bv, cv, bt, ct;
  try{ (list||[]).forEach(function(x){ if(x) arr.push(x); }); }catch(e){}
  if(!arr.length) return null;
  /* FIX 3: the last channel this Gmail used on this device wins first. */
  try{ var __last=lastChannelFor(state&&state.user&&state.user.email?String(state.user.email).toLowerCase():""); if(__last){ for(var __li=0;__li<arr.length;__li++){ if(arr[__li].id===__last) return arr[__li]; } } }catch(e){}
  for(i=0;i<arr.length;i++){
    c=arr[i]; n=0;
    try{ (videos||[]).forEach(function(v){ if(v && v.channelId===c.id && !fbIsDeletedId(v.id)) n++; }); }catch(e){}
    counts[c.id]=n; if(n>maxN) maxN=n;
  }
  if(maxN===0) return arr[arr.length-1];
  for(i=0;i<arr.length;i++){
    c=arr[i]; if(counts[c.id]!==maxN) continue;
    if(!best){ best=c; continue; }
    bv=false; cv=false;
    try{ bv=!!best.verified; cv=!!c.verified; }catch(e){}
    if(cv!==bv){ if(cv) best=c; continue; }
    /* FIX 1: never prefer the legacy placeholder id 'raj' over the
       real Firestore channel (ch...) when video counts tie. */
    if((best.id==="raj")!==(c.id==="raj")){ if(c.id!=="raj") best=c; continue; }
    bt=0; ct=0;
    try{ bt=best._fbCreatedAt||best.createdAt||0; ct=c._fbCreatedAt||c.createdAt||0; }catch(e){}
    if(ct!==bt){ if(ct<bt) best=c; continue; }
    if(String(c.id)<String(best.id)) best=c;
  }
  return best;
}
function enterChannelForUser(welcomeKey){
  var em=state.user.email.toLowerCase(), owned=null, adminOf=null, recoveryOf=null;
  var ownedList=[];
  channels.forEach(function(c){
    if(c.ownerEmail && c.ownerEmail===em) ownedList.push(c);
    else if(c.admins && c.admins.some(function(a){ return a.email===em; })) adminOf=c;
    else if(c.recoveryEmail && c.recoveryEmail===em) recoveryOf=c;
  });
  owned=fbPickOwnerChannel(ownedList);
  if(owned){ myChannel=owned; state.role="owner"; try{ rememberChannel(em,owned.id); }catch(e){} finishSignIn(welcomeKey||"backAsOwner"); return; }
  if(!owned && recoveryOf && !ownerSession){
    /* Signed in with the channel's saved recovery Gmail: the channel
       comes back — the recovery Gmail becomes its new main Gmail. */
    recoveryOf.ownerEmail=em; recoveryOf.ownerName=state.user.name; recoveryOf.recoveryEmail="";
    myChannel=recoveryOf; state.role="owner"; finishSignIn("uRecRecovered"); return;
  }
  if(adminOf && !ownerSession){ myChannel=adminOf; state.role="admin"; finishSignIn("backAsAdmin"); return; }
  if(adminOf && ownerSession){ myChannel=adminOf; state.role="admin"; finishSignIn(welcomeKey); return; }
  /* Signed in, but this Gmail has no channel yet. Only actions that
     need a channel (upload, Studio, Your channel) open the Create
     channel form now; a plain corner sign-in just signs in, and the
     account menu offers Create channel — exactly like YouTube. */
  myChannel=null; state.role="owner";
  if(pendingNeedsChannel()){
    overlay.innerHTML="";
    saveUserData(); /* signed in but no channel yet — keep the sign-in for next time */
    openChannelForm();
    if(welcomeKey) setTimeout(function(){ toast(t(welcomeKey)); },50);
    return;
  }
  finishSignIn(welcomeKey);
}

/* ============================================================
   Mini player - drag down to dock, back minimizes, back again closes.
   The live <video>/<iframe> element is NEVER re-created: before any
   renderApp()/renderMain() rebuild, preservePlayer() moves the live
   player node into a hidden holding div on document.body (outside
   #app); after the rebuild, restorePlayer() moves the SAME node
   back into the fresh .player-box (full watch) or into the mini
   player slot (minimized), so playback continues without reloading.
   History: opening a video pushStates {rkWatch:id} (stack at most
   [home, watch]); minimizing pushStates {rkMini:id}; system back
   (popstate) while watching minimizes, while minimized closes.
   ============================================================ */
var miniState={id:null,minimized:false};
var viewRecordedFor=null;
var __preserving=false, __holder=null;
function ensureMiniplayer(){ var mp=document.getElementById("miniplayer"); if(!mp){ mp=document.createElement("div"); mp.id="miniplayer"; mp.hidden=true; document.body.appendChild(mp); } return mp; }
/* The video the player node itself is showing, read off the node. */
function playerVideoId(node){
  if(!node) return null;
  var src=node.getAttribute("src")||"";
  var m, v;
  if(node.tagName==="IFRAME"){
    m=src.match(/\/embed\/([^?&#]+)/);
    if(m){ v=videos.filter(function(x){return x.ytId===m[1];})[0]; return v?v.id:null; }
  } else {
    v=videos.filter(function(x){return x.src===src;})[0];
    return v?v.id:null;
  }
  return null;
}
function preservePlayer(){
  if(__preserving) return null;
  var p=document.getElementById("player")||document.getElementById("yt-player");
  if(!p) return null;
  var vid=playerVideoId(p)||state.watchId||miniState.id;
  if(!vid) return null;
  __preserving=true;
  if(__holder) __holder.remove();
  __holder=document.createElement("div"); __holder.id="player-holder"; __holder.style.display="none";
  document.body.appendChild(__holder);
  /* Strip the id while the node sits in the holder: the rebuild creates a new #player, and two elements with the same id would break getElementById(). */
  var __pid=p.id; p.removeAttribute("id");
  __holder.appendChild(p);
  return {node:p,videoId:vid,pid:__pid};
}
function restorePlayer(saved){
  if(!saved){ return; }
  var node=saved.node;
  if(saved.pid){ node.id=saved.pid; }
  if(miniState.minimized && miniState.id===saved.videoId){
    renderMiniplayer();
    var slot=document.getElementById("mini-slot");
    if(slot){ var oldMini=slot.querySelector("#player,#yt-player"); if(oldMini && oldMini!==node) oldMini.remove(); slot.appendChild(node); }
  } else if(state.view==="watch" && state.watchId===saved.videoId){
    var __v=null; try{ __v=videoById(saved.videoId); }catch(e){}
    if(__v && (fbIsRemoteOnly(__v) || __v._srcDead)){ try{ if(node.tagName==="VIDEO") node.pause(); }catch(e){} /* unplayable now (remote-only / file gone): never restore a stale player over the honest note */ }
    else { var box=document.querySelector(".player-box"); if(box){ var oldBox=box.querySelector("#player,#yt-player"); if(oldBox && oldBox!==node) oldBox.remove(); box.appendChild(node); } }
  } else {
    try{ if(node.tagName==="VIDEO") node.pause(); else if(node.tagName==="IFRAME") ytCmd(node,"pauseVideo"); }catch(e){}
  }
  if(__holder){ __holder.remove(); __holder=null; }
  __preserving=false;
}
function renderMiniplayer(){
  var mp=ensureMiniplayer();
  var v=miniState.minimized?videoById(miniState.id):null;
  if(!v){ mp.hidden=true; mp.innerHTML=""; return; }
  mp.hidden=false;
  mp.innerHTML='<div class="mini-player-slot" id="mini-slot"></div>'
  + '<div class="mini-title">'+esc(v.title)+'</div>'
  + '<button class="mini-btn" id="mini-toggle" aria-label="'+esc(t("playBtn"))+' / '+esc(t("pauseBtn"))+'">'+IC.pause+'</button>'
  + '<button class="mini-btn" id="mini-close" aria-label="'+esc(t("miniClose"))+'">'+IC.close+'</button>';
  var tog=document.getElementById("mini-toggle");
  if(tog) tog.addEventListener("click",function(e){
    e.stopPropagation();
    var p=document.getElementById("player");
    if(p){ if(p.paused){ p.play().catch(function(){}); tog.innerHTML=IC.pause; } else { p.pause(); tog.innerHTML=IC.play; } return; }
    expandMiniplayer();
  });
  var cl=document.getElementById("mini-close");
  if(cl) cl.addEventListener("click",function(e){ e.stopPropagation(); closeMiniplayer(true); });
  mp.onclick=function(e){ if(e.target.closest("button")) return; expandMiniplayer(); };
}
function minimizePlayer(){
  if(state.view!=="watch" || !state.watchId) return;
  var id=state.watchId;
  miniState={id:id,minimized:true};
  state.watchId=null; state.view="home"; state.searchOpen=false;
  renderApp(); window.scrollTo(0,0);
  try{ history.pushState({rkMini:id},""); }catch(e){}
}
function expandMiniplayer(){
  var id=miniState.id; if(!id) return;
  miniState={id:null,minimized:false};
  state.watchId=id; state.view="watch"; state.searchOpen=false; state.adPending=null;
  renderApp(); window.scrollTo(0,0);
  /* Hide the mini bar only AFTER renderApp: preservePlayer() must
     still find the live node inside the mini slot to move it back
     into the full player. Clearing it first would destroy the node
     and restart playback from the beginning. */
  var mp=document.getElementById("miniplayer"); if(mp){ mp.hidden=true; mp.innerHTML=""; }
  watchHistoryPush(id);
}
function closeMiniplayer(stop){
  var mp=document.getElementById("miniplayer");
  if(mp){ var p=mp.querySelector("video"); if(p && stop!==false){ try{ p.pause(); }catch(e){} } var f=mp.querySelector("iframe"); if(f && stop!==false){ try{ ytCmd(f,"pauseVideo"); }catch(e){} } mp.hidden=true; mp.innerHTML=""; }
  miniState={id:null,minimized:false};
  viewRecordedFor=null;
}
function watchHistoryPush(id){
  try{
    var st=null; try{ st=history.state; }catch(e){}
    if(st && (st.rkWatch || st.rkMini)) history.replaceState({rkWatch:id},"");
    else history.pushState({rkWatch:id},"");
  }catch(e){}
}
window.addEventListener("popstate",function(){
  if(miniState.minimized){ closeMiniplayer(true); return; }
  if(state.view==="watch" && state.watchId){ minimizePlayer(); return; }
});
/* ---------- Rotate to landscape = big video (theater mode) ----------
   Rotating the phone while watching makes the player fill the screen
   with pure CSS (a class toggle needs no user gesture, so it works on
   rotation). The player's own fullscreen button and the corner button
   use the Fullscreen API instead, which the native WebView shows
   through onShowCustomView. Neither path moves or rebuilds the player
   node, so playback continues at the same position. */
var __theaterOn=false;
function syncLandscapeTheater(){
  var landscape=false;
  try{ landscape=window.innerWidth>window.innerHeight; }catch(e){}
  var watching=state.view==="watch" && !!state.watchId && !miniState.minimized;
  var want=landscape && watching && !document.fullscreenElement;
  if(want && !__theaterOn){ document.body.classList.add("landscape-watch"); __theaterOn=true; }
  else if(!want && __theaterOn){ document.body.classList.remove("landscape-watch"); __theaterOn=false; }
}
function toggleFullscreen(){
  if(__theaterOn){ document.body.classList.remove("landscape-watch"); __theaterOn=false; return; }
  if(document.fullscreenElement){ try{ document.exitFullscreen(); }catch(e){} return; }
  var el=document.getElementById("yt-player")||document.getElementById("player");
  if(!el) return;
  try{
    var p=el.requestFullscreen ? el.requestFullscreen() : null;
    if(p && p.catch) p.catch(function(){ document.body.classList.add("landscape-watch"); __theaterOn=true; });
    else if(!p){ document.body.classList.add("landscape-watch"); __theaterOn=true; }
  }catch(e){ document.body.classList.add("landscape-watch"); __theaterOn=true; }
}
if(window.matchMedia){ try{ var __mq=window.matchMedia("(orientation: landscape)"); if(__mq.addEventListener) __mq.addEventListener("change",syncLandscapeTheater); else if(__mq.addListener) __mq.addListener(syncLandscapeTheater); }catch(e){} }

window.addEventListener("resize",function(){ setTimeout(syncLandscapeTheater,120); });
document.addEventListener("fullscreenchange",syncLandscapeTheater);
function attachDragToPlayer(){
  var box=document.getElementById("player-box"); if(!box || box._rkDrag) return; box._rkDrag=true;
  var startY=0,startX=0,dy=0,dragging=false;
  function reset(){ box.style.transition="transform .25s ease"; box.style.transform=""; setTimeout(function(){ box.style.transition=""; },260); }
  box.addEventListener("touchstart",function(e){ if(!e.touches.length) return; startY=e.touches[0].clientY; startX=e.touches[0].clientX; dy=0; dragging=false; },{passive:true});
  box.addEventListener("touchmove",function(e){
    if(!e.touches.length) return;
    var ny=e.touches[0].clientY, nx=e.touches[0].clientX; dy=ny-startY; var dx=nx-startX;
    if(dy>0 && Math.abs(dy)>Math.abs(dx)){ dragging=true; e.preventDefault(); box.style.transition="none"; var sc=Math.max(0.55,1-dy/900); box.style.transform="translateY("+dy+"px) scale("+sc+")"; }
  },{passive:false});

  box.addEventListener("mousedown",function(e){
    startY=e.clientY; startX=e.clientX; dy=0; dragging=false;
    function mm(ev){ dy=ev.clientY-startY; if(dy>0 && Math.abs(dy)>Math.abs(ev.clientX-startX)){ dragging=true; box.style.transition="none"; var sc=Math.max(0.55,1-dy/900); box.style.transform="translateY("+dy+"px) scale("+sc+")"; } }
    function mu(){ document.removeEventListener("mousemove",mm); document.removeEventListener("mouseup",mu); if(dragging){ if(dy>110){ box.style.transform=""; box.style.transition=""; minimizePlayer(); } else reset(); } }
    document.addEventListener("mousemove",mm); document.addEventListener("mouseup",mu);
  });
}
/* ---------- Watch fullscreen button: auto-hide like YouTube controls ----------
   The .fs-btn sits at the bottom of the player and must not float over the

/* Runtime guard for 16:9 thumbnails: the padding hack + aspect-ratio

   Only intervenes when the measured height is wrong; a correct box

/* FIX (Shorts instant): pre-resolve every Short's video source early,
   so a swipe never waits on the async IndexedDB / B2 round-trip.
   Runs in the background, one video at a time, when Shorts opens and
   once at boot after the pull. YouTube shorts use iframes (no src to
   resolve) and videos whose src is already a live blob: URL are
   skipped. Only the record's src is resolved here — nothing is
   played and nothing is mounted; mountShortMedia's FAST PATH then
   builds the <video> element at once on swipe. A per-item 15s guard
   keeps the chain moving if one source never answers.
   HONEST LIMIT: YouTube serves small adaptive chunks from a global
   CDN; RK Tube serves full files from B2 (US East). This removes the
   app-side wait, so swiping is much faster, but on a very slow
   network a large B2 file can still take a moment to buffer — that
   part is the network, not the app. */
var __rkPreResolving=false, __rkPreResolvePending=false;
function preResolveShortsSources(){
  if(__rkPreResolving){ __rkPreResolvePending=true; return; }
  var list=[];
  try{ list=shortsPlayerList(); }catch(e){ return; }
  if(!list.length) return;
  __rkPreResolving=true; __rkPreResolvePending=false;
  var i=0;
  function next(){
    if(i>=list.length){
      __rkPreResolving=false;
      if(__rkPreResolvePending){ __rkPreResolvePending=false; preResolveShortsSources(); }
      return;
    }
    var v=list[i++];
    if(!v || v.ytId){ next(); return; }
    if(typeof v.src==="string" && v.src.indexOf("blob:")===0){ next(); return; }
    var done=false;
    function step(){ if(done) return; done=true; next(); }
    try{ ensureVideoSrc(v,step); }catch(e){ step(); return; }
    setTimeout(step,15000);
  }
  next();
}
/* A Short that cannot play on THIS phone fills the Shorts screen
   with the reason and, when the file is still only on the
   uploader's phone, a Check again button — never a silent black
   screen or a dead poster that merely "does not play". Check again
   re-reads the video's shared record: the moment the uploader's
   upload lands in the shared store, the same tap mounts the video
   and it plays. z-index lifts the note above the .shorts-touch
   tap layer so the button is actually tappable. */
function shortsBlockedHTML(v){
  var remote=false; try{ remote=fbIsRemoteOnly(v); }catch(e){}
  var msg=""; try{ msg=t(remote?"fbLocalOnlyNote":"upFileGone"); }catch(e){}
  if(!msg||msg==="fbLocalOnlyNote"||msg==="upFileGone") msg=remote?"This video was uploaded on another phone — its file is only on the uploader's phone, so it cannot play here yet.":"This video file is no longer available.";
  var rcLabel=""; try{ rcLabel=t("shortsRecheck"); }catch(e){}
  if(!rcLabel||rcLabel==="shortsRecheck") rcLabel=(state.lang==="bn")?"আবার চেক করো":"Check again";
  return '<div style="position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px 22px;text-align:center;background:#000;color:#fff">'
  + '<div style="font-size:15.5px;line-height:1.55;max-width:420px">'+esc(msg)+'</div>'
  + (remote?'<button type="button" data-srecheck="'+esc(v.id)+'" style="padding:10px 22px;border-radius:20px;border:1px solid #fff;background:transparent;color:#fff;font-size:14.5px;cursor:pointer">'+esc(rcLabel)+'</button>':"")
  + '</div>';
